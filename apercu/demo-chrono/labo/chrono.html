<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Chronomètre</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f1220; color: #eef0f8;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px; }
  #temps { font-size: clamp(56px, 16vw, 140px); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -2px; }
  .boutons { display: flex; gap: 12px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  button { font: inherit; font-size: 20px; padding: 12px 26px; border: 0; border-radius: 12px; cursor: pointer;
           background: #232846; color: #eef0f8; transition: transform .12s ease-out, background .15s; }
  button:active { transform: scale(.97); }
  #start { background: #3ddc84; color: #0f1220; font-weight: 600; }
  #start.marche { background: #ffb020; }
  #tours { margin: 22px auto 0; padding: 0; max-width: 320px; list-style: none; counter-reset: t;
           font-size: 22px; font-variant-numeric: tabular-nums; text-align: left; }
  #tours li { counter-increment: t; display: flex; justify-content: space-between; padding: 6px 4px;
              border-bottom: 1px solid #ffffff14; }
  #tours li::before { content: "Tour " counter(t); color: #9aa3c0; }
</style>
</head>
<body>
<main>
  <div id="temps" aria-live="off">00:00,00</div>
  <div class="boutons">
    <button id="start">Démarrer</button>
    <button id="tour">Tour</button>
    <button id="reset">Remise à zéro</button>
  </div>
  <ol id="tours"></ol>
</main>
<script>
  const affichage = document.getElementById("temps");
  const bStart = document.getElementById("start");
  let cumul = 0, depart = 0, minuterie = null;

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000);
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0") + "," + String(cs).padStart(2, "0");
  }
  function maintenant() { return cumul + (minuterie ? performance.now() - depart : 0); }
  function rafraichir() { affichage.textContent = format(maintenant()); }

  bStart.addEventListener("click", () => {
    if (minuterie) {                       // pause
      cumul = maintenant(); clearInterval(minuterie); minuterie = null;
      bStart.textContent = "Reprendre"; bStart.classList.remove("marche");
    } else {                               // démarrage / reprise
      depart = performance.now(); minuterie = setInterval(rafraichir, 31);
      bStart.textContent = "Pause"; bStart.classList.add("marche");
    }
  });
  const liste = document.getElementById("tours");
  document.getElementById("tour").addEventListener("click", () => {
    const li = document.createElement("li");
    const v = document.createElement("span"); v.textContent = format(maintenant());
    li.append(v); liste.append(li);
  });
  document.getElementById("reset").addEventListener("click", () => {
    clearInterval(minuterie); minuterie = null; cumul = 0; liste.replaceChildren();
    bStart.textContent = "Démarrer"; bStart.classList.remove("marche"); rafraichir();
  });
</script>
</body>
</html>
