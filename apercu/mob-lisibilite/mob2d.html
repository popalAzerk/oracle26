<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MOB RACER — jeu 16-bit de machines à laver le sol</title>
<style>
/* ============================================================ */
/* MOB RACER 2D — page hôte : canvas centré + pads tactiles     */
/* Les boutons tactiles émettent de vrais KeyboardEvent        */
/* (voir game.js : KEYMAP / emitKey / bindTouchButtons).        */
/* ============================================================ */
html, body { margin: 0; padding: 0; height: 100%; background: #202430; overflow: hidden; }
body {
  display: flex; flex-direction: row; align-items: stretch;
  font-family: "Courier New", monospace;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
#stage { flex: 1 1 auto; order: 0; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
canvas#game {
  display: block; background: #202430; touch-action: none; cursor: pointer;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#bottombar { display: none; }
.pad { display: none; }

/* ---- mode tactile (pointer: coarse ou ?touch=1) : pads visibles ---- */
body.touch .pad {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; touch-action: none;
}
/* paysage : D-pad à gauche (188 px), A/B à droite (188 px), jamais sur l'arène */
body.touch #bottombar { display: contents; }
body.touch:not(.portrait) #padL { order: -1; flex: 0 0 188px; max-width: 188px; }
body.touch:not(.portrait) #padR { order: 1; flex: 0 0 188px; max-width: 188px; }
/* portrait : barre de 230 px sous le jeu, D-pad à gauche, A/B à droite */
body.touch.portrait { flex-direction: column; }
body.touch.portrait #stage { align-items: flex-end; padding-bottom: 6px; }
body.touch.portrait #bottombar { display: flex; flex: 0 0 230px; max-height: 230px; }
body.touch.portrait .pad { flex: 1 1 50%; }

button {
  -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none;
  border: 2px solid #8C95B4; border-radius: 8px; background: #343A5C; color: #FCFAF2;
  font: 700 24px "Courier New", monospace; padding: 0; outline: none;
}
button.on, button:active { background: #FFD23E; color: #3C2C56; border-color: #FCFAF2; }

.dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 3px; }
.dpad button { border-radius: 10px; }
.dpad .up    { grid-area: 1 / 2; }
.dpad .left  { grid-area: 2 / 1; }
.dpad .down  { grid-area: 3 / 2; }
.dpad .right { grid-area: 2 / 3; }

.ab { display: flex; gap: 12px; }
.ab button { width: 74px; height: 74px; border-radius: 50%; font-size: 26px; }
.mini { display: flex; gap: 12px; }
.mini button { width: 56px; height: 56px; border-radius: 10px; font-size: 20px; }
.lbl { color: #8C95B4; font-size: 11px; letter-spacing: 1px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="680" height="472"></canvas></div>

<div id="bottombar">
  <div class="pad" id="padL" aria-label="Commandes directionnelles">
    <div class="dpad">
      <button data-k="up"    class="up"    aria-label="Haut">▲</button>
      <button data-k="left"  class="left"  aria-label="Gauche">◀</button>
      <button data-k="down"  class="down"  aria-label="Bas">▼</button>
      <button data-k="right" class="right" aria-label="Droite">▶</button>
    </div>
    <div class="lbl">D-PAD<br>1 CASE PAR APPUI</div>
  </div>
  <div class="pad" id="padR" aria-label="Actions">
    <div class="ab">
      <button data-k="a" aria-label="Torpille">A</button>
      <button data-k="b" aria-label="Valider">B</button>
    </div>
    <div class="lbl">A&nbsp;:&nbsp;TORPILLE<br>B&nbsp;:&nbsp;VALIDER</div>
    <div class="mini">
      <button data-k="pause" aria-label="Pause">⏸</button>
      <button data-k="mute"  aria-label="Son">♪</button>
    </div>
  </div>
</div>

/* MOB RACER 2D — vue « diorama » (mission H) : 5 salles, casting de 4 pilotes-machine (mission G),

   exacte X = x + (x−480)/1000·z, Y = y − z), silhouettes « rayons X » des personnages cachés.

// =====================================================================================================

// Vue de partie : on ne montre que l'arène + 2 bandeaux ; le canvas prend ces dimensions, donc
// l'arène est agrandie à l'écran (les menus gardent W × H).
const VIEW = { x: GX - 12, y: 0, w: COLS * CELL + 24, h: GY + ROWS * ROW + 6 + BOT_H };
const IN_ARENA = { countdown: 1, play: 1, pause: 1, results: 1 };
const MOVE_TIME = 0.135;           // s par case à vitesse 1
const BUFFER_WINDOW = 0.15;        // appui mémorisé pendant un déplacement

// =====================================================================================================
// HASARD À GRAINE (mulberry32) — remplace Math.random ; ?seed=N pour une partie reproductible
// =====================================================================================================
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const ACCENTS = { 'É': ['E', 'a'], 'È': ['E', 'g'], 'Ê': ['E', 'c'], 'Ë': ['E', 'd'], 'À': ['A', 'g'], 'Â': ['A', 'c'], 'Ç': ['C', 'z'],
  'Ô': ['O', 'c'], 'Î': ['I', 'c'], 'Ï': ['I', 'd'], 'Ù': ['U', 'g'], 'Û': ['U', 'c'], 'Ü': ['U', 'd'] };
const ACC_PIX = { a: [[3, -2], [2, -1]], g: [[1, -2], [2, -1]], c: [[2, -2], [1, -1], [3, -1]], d: [[1, -1], [3, -1]], z: [[2, 7], [1, 8]] };
const FONT_CHARS = Object.keys(GLYPHS).concat(Object.keys(ACCENTS));
const FONT_IDX = {}; FONT_CHARS.forEach((c, i) => { FONT_IDX[c] = i; });
const GW = 6, GH = 10, GOFF = 2; // cellule de glyphe : 2 rangées d'accent au-dessus
let fontBase = null; const fontCache = {};
function buildFont() {
  const c = document.createElement('canvas');
  c.width = FONT_CHARS.length * GW; c.height = GH;
  const g = c.getContext('2d'); g.fillStyle = '#fff';
  FONT_CHARS.forEach((ch, i) => {
    let base = ch, acc = null;
    if (ACCENTS[ch]) { base = ACCENTS[ch][0]; acc = ACCENTS[ch][1]; }
    const rows = GLYPHS[base];
    for (let r = 0; r < 7; r++) {
      const v = parseInt(rows[r], 32);
      for (let b = 0; b < 5; b++) if (v & (16 >> b)) g.fillRect(i * GW + b, GOFF + r, 1, 1);
    }
    if (acc) for (const [px, py] of ACC_PIX[acc]) if (GOFF + py < GH) g.fillRect(i * GW + px, GOFF + py, 1, 1);
  });
  fontBase = c;
}
function fontFor(color) {
  if (!fontCache[color]) {
    const c = document.createElement('canvas'); c.width = fontBase.width; c.height = fontBase.height;
    const g = c.getContext('2d'); g.drawImage(fontBase, 0, 0);
    g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
    fontCache[color] = c;
  }
  return fontCache[color];
}
function textW(str, s = 1) { return str.length * GW * s - s; }
// y = haut des majuscules ; align : 'left' | 'center' | 'right' ; out = couleur de contour (facultatif)
function text(str, x, y, color, s = 1, align = 'left', out = null) {
  str = String(str).toUpperCase();
  const w = textW(str, s);
  let x0 = align === 'center' ? Math.round(x - w / 2) : align === 'right' ? x - w : x;
  if (out) {
    const f = fontFor(out);
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1], [1, 1]]) drawStr(f, str, x0 + dx * s, y + dy * s, s);
  }
  drawStr(fontFor(color), str, x0, y, s);
  return w;
}
function drawStr(f, str, x0, y, s) {
  for (let i = 0; i < str.length; i++) {
    const idx = FONT_IDX[str[i]];
    if (idx === undefined) continue;
    ctx.drawImage(f, idx * GW, 0, GW, GH, x0 + i * GW * s, y - GOFF * s, GW * s, GH * s);
  }
}
function wrap(str, maxChars) {
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    if ((cur + ' ' + w).trim().length > maxChars) { if (cur) lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim();
  }
  if (cur) lines.push(cur);
  return lines;
}

const held = { up: false, down: false, left: false, right: false };
function actionOf(e) {
  switch (e.key) { // flèches et touches nommées : e.key
    case 'ArrowUp': return 'up'; case 'ArrowDown': return 'down'; case 'ArrowLeft': return 'left'; case 'ArrowRight': return 'right';
    case 'Enter': return 'ok'; case ' ': return 'torp'; case 'Escape': return 'pause';
    case 'm': case 'M': return 'mute'; case 'p': case 'P': return 'pause'; case 'h': case 'H': return 'help';
    default: break;
  }
  switch (e.code) { // lettres : position physique (ZQSD sur AZERTY = KeyW/A/S/D)
    case 'KeyW': return 'up'; case 'KeyS': return 'down'; case 'KeyA': return 'left'; case 'KeyD': return 'right';
    case 'KeyE': case 'Space': return 'torp'; case 'NumpadEnter': return 'ok';
    default: return null;
  }
}
const ACT_DIR = { up: 'N', down: 'S', left: 'W', right: 'E' };
window.addEventListener('keydown', (e) => {
  const a = actionOf(e);
  if (!a) return;
  e.preventDefault();
  audioUnlock();
  if (ACT_DIR[a]) held[a] = true;
  // répétition automatique du clavier ignorée, sauf pendant la fusée (déplacement continu)
  if (e.repeat && !(app.mode === 'play' && world && world.player.rocket > 0)) return;
  onAction(a);
});
window.addEventListener('keyup', (e) => { const a = actionOf(e); if (a && ACT_DIR[a]) held[a] = false; });
window.addEventListener('blur', () => { for (const k in held) held[k] = false; });

function onAction(a) {
  if (a === 'mute') { app.muted = !app.muted; localStorage.setItem('mob2d_muted', app.muted ? '1' : '0'); applyMute(); return; }
  switch (app.mode) {
    case 'title':
      if (a === 'help' || a === 'torp') { app.help = !app.help; sfx('blip'); }
      else if (a === 'ok') { app.help = false; app.mode = 'charPick'; sfx('ok'); }
      break;
    case 'charPick':
      if (a === 'left') { app.charIdx = (app.charIdx + CHARS.length - 1) % CHARS.length; sfx('blip'); }
      else if (a === 'right') { app.charIdx = (app.charIdx + 1) % CHARS.length; sfx('blip'); }
      else if (a === 'up') { app.charIdx = (app.charIdx + CHARS.length - 4) % CHARS.length; sfx('blip'); }
      else if (a === 'down') { app.charIdx = (app.charIdx + 4) % CHARS.length; sfx('blip'); }
      else if (a === 'ok') { app.machIdx = CHARS[app.charIdx].machIdx; app.mode = 'roomPick'; sfx('ok'); }
      else if (a === 'pause') { app.mode = 'title'; sfx('back'); }
      break;
    case 'roomPick':
      if (a === 'left') { app.roomIdx = (app.roomIdx + LEVELS.length - 1) % LEVELS.length; sfx('blip'); }
      else if (a === 'right') { app.roomIdx = (app.roomIdx + 1) % LEVELS.length; sfx('blip'); }
      else if (a === 'ok') { startRound(); sfx('ok'); }
      else if (a === 'pause') { app.mode = 'charPick'; sfx('back'); }
      break;
    case 'play':
      if (ACT_DIR[a]) playerPress(ACT_DIR[a]);
      else if (a === 'torp') fireTorpedo(world.player);
      else if (a === 'pause') { app.mode = 'pause'; sfx('back'); }
      break;
    case 'pause':
      if (a === 'pause' || a === 'ok') { app.mode = 'play'; sfx('ok'); }
      break;
    case 'results':
      if (app.results && app.results.t < 1.2) break;
      if (ACT_DIR[a]) { app.resSel = 1 - app.resSel; sfx('blip'); }
      else if (a === 'ok') { sfx('ok'); if (app.resSel === 0) startRound(); else { app.mode = 'title'; app.demoRoom = (app.demoRoom + 1) % LEVELS.length; startDemo(); } }
      break;
    default: break;
  }
}

// Boutons tactiles : ils émettent les mêmes KeyboardEvent que le clavier
const KEYMAP = {
  up: { key: 'ArrowUp', code: 'ArrowUp' }, down: { key: 'ArrowDown', code: 'ArrowDown' },
  left: { key: 'ArrowLeft', code: 'ArrowLeft' }, right: { key: 'ArrowRight', code: 'ArrowRight' },
  a: { key: ' ', code: 'Space' }, b: { key: 'Enter', code: 'Enter' }, pause: { key: 'Escape', code: 'Escape' }, mute: { key: 'm', code: 'KeyM' },
};
function emitKey(type, k) { window.dispatchEvent(new KeyboardEvent(type, { key: k.key, code: k.code, bubbles: true, cancelable: true })); }
function bindTouchButtons() {
  document.querySelectorAll('[data-k]').forEach((btn) => {
    const k = KEYMAP[btn.dataset.k];
    let down = false;
    const press = (e) => { e.preventDefault(); if (down) return; down = true; btn.classList.add('on'); emitKey('keydown', k); };
    const release = (e) => { e.preventDefault(); if (!down) return; down = false; btn.classList.remove('on'); emitKey('keyup', k); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  // tap sur le jeu = Entrée
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); emitKey('keydown', KEYMAP.b); emitKey('keyup', KEYMAP.b); });
}

// =====================================================================================================
// LOGIQUE — monde, grille, déplacements
// =====================================================================================================
function inGrid(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }
function makeGrid(v) { return Array.from({ length: ROWS }, () => new Array(COLS).fill(v)); }

// lettres props (infranchissables) par salle — les états du sol (s n h b v .) restent praticables
const PROP_LETTERS = { 1: 'GgFKPBN', 2: 'TtAUcQFKW', 3: 'ZDdLlYH', 4: 'GgMYZQ', 5: 'AKcWPB' };

function parseLayout(lv) {
  // Port exact des règles validées par work/check_salles.py (mission H) : chaque lettre
  // devient une empreinte + un volume nommé ; les runs et blocs suivent la légende de la salle.
  const tile = makeGrid('#'); // '#' mur, 'P' prop, '.' sol
  const props = []; const stations = {}; const bonusSpots = []; const coins = []; const poubelles = [];
  const L = LAYOUTS[lv.num].map((r) => r.split(''));
  const used = makeGrid(false);
  const isPropL = (c) => PROP_LETTERS[lv.num].includes(c);
  const FLOOR_L = 'svnbw';
  const alt = { t: 0, Z: 0, A: 0, c: 0, k: 0, g: 0 }; // alternances (variantes dressées)
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = L[y][x];
    if (c === '#') { tile[y][x] = '#'; continue; }
    if (isPropL(c) && !FLOOR_L.includes(c)) { tile[y][x] = 'P'; used[y][x] = false; continue; }
    tile[y][x] = '.';
    if (c === 'R') stations.R = [x, y];
    if (c === 'V') stations.V = [x, y];
    if (c === 'E') bonusSpots.push(['bonbonne', x, y]);
    if (c === 'S') bonusSpots.push(['savon', x, y]);
    if (c === 'X') bonusSpots.push(['fusee', x, y]);
    if (c === 'O') coins.push([x, y]);
  }
  for (const [x, y] of lv.extraWater) bonusSpots.push(['bonbonne', x, y]);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = L[y][x];
    if (used[y][x] || !(isPropL(c) && !FLOOR_L.includes(c))) continue;
    const runH = () => { let n = 0; while (x + n < COLS && L[y][x + n] === c) { used[y][x + n] = true; n++; } return n; };
    const runV = () => { let n = 0; while (y + n < ROWS && L[y + n][x] === c) { used[y + n][x] = true; n++; } return n; };
    // --- salle 1 : gondoles verticales forcées (une seule tête PROMO, pas de raccord),
    // congélateurs/caisses/bancs en 2×1, présentoirs et bac à plante en 1×1
    if (lv.num === 1) {
      if (c === 'g') {
        let n = runV();
        if (n >= 6) n = 6; else n = 3;
        for (let i = 0; i < n; i++) used[y + i][x] = true;
        props.push({ el: 'gondole_1x' + n, x, y, l: 1, h: n });
      } else if (c === 'G') {
        const n = runH();
        const len = n >= 3 ? 3 : n;
        props.push({ el: 'gondole_' + len + 'x1', x, y, l: len, h: 1 });
      } else if (c === 'F') { const n = runH(); for (let off = 0; off < n; off += 2) props.push({ el: 'congelateur_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'K') { const n = runH(); for (let off = 0; off < n; off += 2) props.push({ el: (alt.k++ % 2) ? 'caisse_2x1_b' : 'caisse_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'N') { const n = runH(); for (let off = 0; off < n; off += 2) props.push({ el: 'banc_2x1', x: x + off, y, l: 2, h: 1 }); }
      else { // P, B
        used[y][x] = true;
        props.push({ el: c === 'P' ? 'presentoir_1x1' : 'bac_plante_1x1', x, y, l: 1, h: 1 });
      }
      continue;
    }
    // --- salle 5 : vergers et cabane en blocs 2×2
    if (lv.num === 5 && (c === 'A' || c === 'K') && x + 1 < COLS && y + 1 < ROWS
        && L[y][x + 1] === c && L[y + 1][x] === c && L[y + 1][x + 1] === c) {
      used[y][x] = used[y][x + 1] = used[y + 1][x] = used[y + 1][x + 1] = true;
      const el = c === 'K' ? 'cabane_2x2' : ['pommier_2x2', 'poirier_2x2', 'prunier_2x2'][alt.A++ % 3];
      props.push({ el, x, y, l: 2, h: 2 });
      continue;
    }
    // --- runs verticaux (cloisons de cuisine, balustrades de patinoire)
    if ((lv.num === 2 && c === 'c') || (lv.num === 4 && c === 'g')) {
      const n = runV();
      props.push({ el: c === 'c' ? 'cloison_v_1x1' : 'balustrade_1x2', x, y, l: 1, h: n });
      continue;
    }
    // --- salle 3 : les cordons 'l' verticaux sont rangés en paires cordon_1x2 (jamais dédoublés)
    if (lv.num === 3 && c === 'l') {
      const n = runV();
      for (let off = 0; off < n; off += 2) {
        const nn = Math.min(2, n - off);
        for (let i = 0; i < nn; i++) used[y + off + i][x] = true;
        props.push({ el: nn === 2 ? 'cordon_1x2' : 'cordon_2x1', x, y: y + off, l: 1, h: nn });
      }
      continue;
    }
    // --- 1×1 (lettres jamais en run dans leur salle)
    const SINGLES = { 1: 'PB', 2: 'tUQK', 3: 'ZdH', 4: 'Q', 5: 'cPB' };
    if (SINGLES[lv.num].includes(c)) {
      used[y][x] = true;
      if (lv.num === 2) {
        if (c === 't') props.push({ el: (alt.t++ % 2) ? 'table_ronde_1x1_b' : 'table_ronde_1x1', x, y, l: 1, h: 1 });
        else if (c === 'U') props.push({ el: 'tonneau_1x1', x, y, l: 1, h: 1 });
        else if (c === 'Q') props.push({ el: 'passe_plat_1x1', x, y, l: 1, h: 1 });
        else if (c === 'K') props.push({ el: 'frigo_1x1', x, y, l: 1, h: 1 });
      } else if (lv.num === 3) {
        if (c === 'Z') props.push({ el: ['statue_buste_1x1', 'statue_drapee_1x1', 'statue_sphere_1x1'][alt.Z++ % 3], x, y, l: 1, h: 1 });
        else if (c === 'd') props.push({ el: 'vitrine_1x1', x, y, l: 1, h: 1 });
        else if (c === 'H') props.push({ el: 'chevalet_1x1', x, y, l: 1, h: 1 });
      } else if (lv.num === 4) {
        props.push({ el: 'cage_1x1', x, y, l: 1, h: 1 });
      } else {
        if (c === 'P') { props.push({ el: 'poubelle_1x1', x, y, l: 1, h: 1 }); poubelles.push([x, y]); }
        else if (c === 'B') props.push({ el: 'brouette_1x1', x, y, l: 1, h: 1 });
        else props.push({ el: ['caisse_pommes_1x1', 'caisse_poires_1x1', 'caisse_prunes_1x1'][alt.c++ % 3], x, y, l: 1, h: 1 });
      }
      continue;
    }
    // --- runs horizontaux (tables, comptoirs, vitrines, banquettes, balustrades…)
    const n = runH();
    if (lv.num === 2) {
      if (c === 'T') { for (let off = 0; off < n; off += 2) props.push({ el: 'table_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'A') { for (let off = 0; off < n; off += 3) props.push({ el: 'comptoir_3x1', x: x + off, y, l: 3, h: 1 }); }
      else if (c === 'F') { for (let off = 0; off < n; off += 2) props.push({ el: 'fourneau_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'W') { for (let off = 0; off < n; off += 2) props.push({ el: 'plan_travail_2x1', x: x + off, y, l: 2, h: 1 }); }
    } else if (lv.num === 3) {
      if (c === 'L') { let off = 0; while (off < n) { const len = Math.min(3, n - off); props.push({ el: len === 3 ? 'cordon_3x1' : 'cordon_2x1', x: x + off, y, l: len, h: 1 }); off += len; } }
      else if (c === 'D') { for (let off = 0; off < n; off += 2) props.push({ el: 'vitrine_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'Y') { for (let off = 0; off < n; off += 2) props.push({ el: 'banquette_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'd') { for (let i = 0; i < n; i++) props.push({ el: 'vitrine_1x1', x: x + i, y, l: 1, h: 1 }); }
    } else if (lv.num === 4) {
      if (c === 'G') {
        let off = 0;
        while (off < n) { const len = (n - off === 2 || n - off === 4) ? 2 : Math.min(3, n - off); props.push({ el: len === 3 ? 'balustrade_3x1' : 'balustrade_2x1', x: x + off, y, l: len, h: 1 }); off += len; }
      } else if (c === 'M') { for (let off = 0; off < n; off += 2) props.push({ el: 'tableau_affichage_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'Y') { for (let off = 0; off < n; off += 2) props.push({ el: 'banc_joueurs_2x1', x: x + off, y, l: 2, h: 1 }); }
      else if (c === 'Z') { for (let off = 0; off < n; off += 2) props.push({ el: 'surfaceuse_2x1', x: x + off, y, l: 2, h: 1 }); }
    } else if (lv.num === 5) {
      if (c === 'W') { for (let off = 0; off < n; off += 2) props.push({ el: 'pile_caisses_2x1', x: x + off, y, l: 2, h: 1 }); }
    }
  }
  // empreintes complètes : un run impair laisse la table 2×1 déborder d'une case
  // (règle du vérificateur check_salles.py) → cette case est aussi un meuble
  for (const p of props) {
    for (let dy = 0; dy < p.h; dy++) for (let dx = 0; dx < p.l; dx++) tile[p.y + dy][p.x + dx] = 'P';
    p.row = p.y + p.h - 1;
  }
  return { tile, props, stations, bonusSpots, coins, poubelles };
}
let MAP = null;        // layout parsé de la salle courante
let WALKABLE = [];     // cases praticables de la salle courante
function setRoom(idx) {
  LV = LEVELS[idx];
  MAP = parseLayout(LV);
  WALKABLE = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (MAP.tile[y][x] === '.') WALKABLE.push([x, y]);
  buildRoomScene();
}
function isFloor(x, y) { return inGrid(x, y) && MAP.tile[y][x] === '.'; }
function isStation(x, y) { const { R, V } = MAP.stations; return (R[0] === x && R[1] === y) || (V[0] === x && V[1] === y); }

function makeMachine(kind, x, y, opts) {
  return {
    kind, x, y, fx: x, fy: y, t: 1, moving: false, dir: kind === 'player' ? 'E' : 'W', face: kind === 'player' ? 'E' : 'W', turnDiag: null,
    moveTime: opts.moveTime, baseMoveTime: opts.moveTime, dist: 0, water: opts.startWater != null ? opts.startWater : 100, grime: 0, bonusPts: 0,
    soap: 0, rocket: 0, slow: 0, torpLeft: 1, torpSize: opts.torpSize, grip: opts.grip, inertia: opts.inertia,
    soapDur: 4 * (opts.soapMul || 1), rocketDur: 4.5 + (opts.rocketBonus || 0), slipMul: opts.slipMul != null ? opts.slipMul : 1,
    waterMul: opts.waterMul || 1, grimeMul: opts.grimeMul || 1, drainBonus: opts.drainBonus || 5, coinVal: opts.coinVal || 1,
    scareR: opts.scareR || 0, slowImmune: !!opts.slowImmune,
    buffer: null, bump: 0, think: 0, ai: opts.ai, owner: kind === 'player' ? PLAYER : LAYA,
    emptyAlarm: 0, sheet: opts.sheet, idleSheet: opts.idleSheet || null, label: opts.label, washed: 0, slipNext: false,
    refills: 0, drains: 0,
  };
}

function createWorld(cfg) {
  const w = {
    cfg, st: makeGrid(CLEAN), hp: makeGrid(1), wt: makeGrid(1), sal: makeGrid(null), nest: makeGrid(false),
    floorDirty: true,
    timeLeft: ROUND_TIME, elapsed: 0, dirtyByPolluters: 0, particles: [], floats: [], waves: [], shake: 0,
    bonuses: [], polluters: [], ambient: [], granny: null, msg: null, msgT: 0, demo: !!cfg.demo,
  };
  // sol : ~70 % des cases praticables sales, puis les nids (graine)
  const reserved = new Set();
  const key = (x, y) => x + ',' + y;
  const { R, V } = MAP.stations;
  reserved.add(key(R[0], R[1])); reserved.add(key(V[0], V[1]));
  for (const [, x, y] of MAP.bonusSpots) reserved.add(key(x, y));
  for (const [x, y] of MAP.coins) reserved.add(key(x, y));
  reserved.add(key(LV.spawnP[0], LV.spawnP[1])); reserved.add(key(LV.spawnL[0], LV.spawnL[1]));
  reserved.add(key(LV.granny[0], LV.granny[1]));
  const cand = WALKABLE.filter(([x, y]) => !reserved.has(key(x, y)));
  for (const [x, y] of cand) if (Math.random() < 0.7 / (cand.length / WALKABLE.length)) w.st[y][x] = DIRTY;
  const nestCand = cand.filter(([x, y]) => Math.abs(x - LV.spawnP[0]) + Math.abs(y - LV.spawnP[1]) > 2 && Math.abs(x - LV.spawnL[0]) + Math.abs(y - LV.spawnL[1]) > 2);
  for (let i = 0; i < LV.nests && nestCand.length; i++) {
    const [x, y] = nestCand.splice(rndi(nestCand.length), 1)[0];
    w.st[y][x] = NEST; w.hp[y][x] = 3; w.wt[y][x] = 2; w.nest[y][x] = true; w.sal[y][x] = 'tas';
  }
  // bonus
  for (const [type, x, y] of MAP.bonusSpots) w.bonuses.push({ type, x, y, active: true, t: 0 });
  for (const [x, y] of MAP.coins) w.bonuses.push({ type: 'piece', x, y, active: true, t: 0, once: true });
  // machines — duo personnage + SA machine (mission H) : sprites mission G, une case par duo
  const ch = CHARS[cfg.charIdx], mc = MACHINES[ch.machIdx], fx = ch.fx || {};
  const playerFactor = (mc.speed / 100) * (fx.speed || 1);
  const sheet = 'cast_' + ch.id + '_poussette', idleSheet = 'cast_' + ch.id + '_idle';
  const startWater = fx.startWater || 100;
  w.player = makeMachine('player', LV.spawnP[0], LV.spawnP[1], {
    moveTime: MOVE_TIME / playerFactor, torpSize: fx.torp || 5, grip: mc.grip, inertia: 1,
    soapMul: fx.soap || 1, rocketBonus: fx.rocket || 0, slipMul: fx.slip != null ? fx.slip : 1,
    waterMul: fx.water || 1, grimeMul: fx.grime || 1, drainBonus: fx.drain || 5, coinVal: fx.coin || 1,
    scareR: fx.scare || 0, slowImmune: !!fx.slowImmune, startWater,
    ai: !!cfg.demo, sheet, idleSheet, label: 'TOI',
  });
  w.laya = makeMachine('laya', LV.spawnL[0], LV.spawnL[1], {
    moveTime: MOVE_TIME / (playerFactor * LV.layaSpeed), torpSize: 5, grip: 140, inertia: 1, soapMul: 1,
    ai: true, sheet: 'laya', label: 'LAYA',
  });
  w.loadout = {
    personnage: ch.name + ' · pilote IMG_' + ch.id, machine: mc.name, salle: LV.name + ' — ' + LV.diff,
    effets: {
      vitesse_machine: mc.speed, adherence: mc.grip, bonus_personnage: ch.perk,
      temps_par_case_s: +w.player.moveTime.toFixed(4), torpille: (fx.torp || 5) + '×' + (fx.torp || 5),
      eau_par_case: 2.5 * (fx.water || 1), reservoir_depart_pct: startWater,
      savon_s: +(4 * (fx.soap || 1)).toFixed(2), fusee_s: 4.5 + (fx.rocket || 0),
      glisse_patinoire_pct: LV.ice ? Math.round(Math.min(0.85, 0.48 * 100 / mc.grip) * (fx.slip != null ? fx.slip : 1) * 100) : 0,
      vidange_bonus: fx.drain || 5, piece_valeur: fx.coin || 1, rayon_effroi_cases: fx.scare || 0,
      immune_mamie: !!fx.slowImmune, multiplicateur_vitesse: fx.speed || 1,
      sprite: 'duo ' + ch.name + ' (pilote IMG_' + ch.id + ', une case, sprites mission G)',
      laya_temps_par_case_s: +w.laya.moveTime.toFixed(4),
    },
  };
  // pollueurs de la salle + ambiance (mamie partout)
  const spots = WALKABLE.filter(([x, y]) => !isStation(x, y) && !reserved.has(key(x, y)));
  let ci = 0;
  for (const [kind, n] of LV.pollueurs) for (let i = 0; i < n; i++) {
    const [x, y] = spots.splice(rndi(spots.length), 1)[0];
    w.polluters.push(makePolluter(kind, x, y, ci++));
  }
  for (const [kind, n] of LV.ambience) for (let i = 0; i < n; i++) {
    const [x, y] = spots.splice(rndi(spots.length), 1)[0];
    w.ambient.push(makePolluter(kind, x, y, 0));
  }
  w.granny = { x: LV.granny[0], y: LV.granny[1], fx: LV.granny[0], fy: LV.granny[1], t: 1, moving: false, dir: 'E',
    coinT: 20, count: 0, countT: 0, hits: [], angry: 0, wait: 2 };
  return w;
}

function makePolluter(kind, x, y, i) {
  const def = POLL_DEF[kind];
  const coef = LV.coef;
  const speed = 1 + 0.15 * (coef - 1);
  return {
    kind, x, y, fx: x, fy: y, t: 1, moving: false, dir: 'E', face: 'E', dist: 0,
    state: 'rest', timer: rnd(1.5, 4) / coef + i * 0.7, path: [], target: null,
    moveTime: def.mt / speed, restBase: def.rest, sal: def.sal, nests: !!def.nest,
    sheet: kind === 'client' ? (i % 2 ? 'pnj_client_B' : 'pnj_client_A') : def.sheet,
    flee: 0, fly: def.fly, h: def.fly ? 22 + rndi(8) : 0, landed: true,
  };
}

// ---------- occupation des cases
function machineCells(m) { return m.moving ? [[m.fx, m.fy], [m.x, m.y]] : [[m.x, m.y]]; }
function grannyCells(g) { return g.moving ? [[g.fx, g.fy], [g.x, g.y]] : [[g.x, g.y]]; }
function occupiedBy(cells, x, y) { return cells.some(([a, b]) => a === x && b === y); }
function blockedForMachine(w, m, x, y) {
  if (!isFloor(x, y)) return 'wall';
  const other = m === w.player ? w.laya : w.player;
  if (occupiedBy(machineCells(other), x, y)) return 'machine';
  if (w.granny && occupiedBy(grannyCells(w.granny), x, y)) return 'granny';
  return null;
}

// ---------- démarrage d'un déplacement
function startMove(w, m, d) {
  const [dx, dy] = DV[d];
  const nx = m.x + dx, ny = m.y + dy;
  const prev = m.dir;
  m.dir = d;
  const blk = blockedForMachine(w, m, nx, ny);
  if (blk) {
    m.face = d; m.bump = 0.12;
    if (blk === 'granny') hitGranny(w, m);
    else if (m.kind === 'player' && !w.demo) sfx('bump');
    return false;
  }
  m.turnDiag = (prev !== d && DIAG[prev + ',' + d]) ? DIAG[prev + ',' + d] : null;
  m.fx = m.x; m.fy = m.y; m.x = nx; m.y = ny; m.t = 0; m.moving = true; m.face = d;
  let mt = m.baseMoveTime;
  if (m.soap > 0) mt /= 1.6;
  if (m.rocket > 0) mt /= 1.9;
  if (m.slow > 0) mt *= 2;
  m.moveTime = mt;
  scarePolluters(w, nx, ny, m.scareR || 0);
  if (m.kind === 'player' && !w.demo) sfx('step');
  return true;
}

function playerPress(d) {
  const p = world.player;
  if (!p.moving) startMove(world, p, d);
  else p.buffer = { d, t: world.elapsed };
}

// ---------- mise à jour d'une machine
function updateMachine(w, m, dt) {
  // stationner sur une station : effet continu (le savon adjacent peut consommer juste après l'arrivée)
  if (!m.moving) {
    const { R, V } = MAP.stations;
    if (m.x === R[0] && m.y === R[1]) { if (m.water < 100) m.water = 100; }
    else if (m.x === V[0] && m.y === V[1]) { if (m.grime > 0) m.grime = 0; }
  }
  if (m.soap > 0) m.soap = Math.max(0, m.soap - dt);
  if (m.rocket > 0) m.rocket = Math.max(0, m.rocket - dt);
  if (m.slow > 0) m.slow = Math.max(0, m.slow - dt);
  if (m.bump > 0) m.bump = Math.max(0, m.bump - dt);
  if (m.emptyAlarm > 0) m.emptyAlarm -= dt;
  if (m.moving) {
    const step = dt / m.moveTime;
    m.t += step; m.dist += Math.min(step, 1 - (m.t - step));
    if (m.t >= 1) {
      m.t = 1; m.moving = false; m.turnDiag = null;
      onEnterCell(w, m);
      // glissade : sol savonneux (toutes salles) ou patinoire (toute la glace, enchaînements permis)
      const soapP = m.soap > 0 ? Math.min(0.9, 0.5 * 100 / m.grip * m.inertia) : 0;
      const iceP = LV.ice ? Math.min(0.85, 0.48 * 100 / m.grip) * m.slipMul : 0;
      if (Math.random() < Math.max(soapP, iceP)) {
        m.slipNext = true;
        if (startMove(w, m, m.dir)) { if (m.kind === 'player' && !w.demo && LV.ice && soapP <= 0) sfx('slip'); return; }
      }
      m.slipNext = false;
    }
  }
  if (!m.moving) {
    if (m.ai) { aiThink(w, m, dt); return; }
    // appui mémorisé pendant le déplacement précédent
    if (m.buffer && w.elapsed - m.buffer.t <= BUFFER_WINDOW) { const d = m.buffer.d; m.buffer = null; if (startMove(w, m, d)) return; }
    m.buffer = null;
    // fusée : déplacement continu touche maintenue
    if (m.rocket > 0) {
      for (const a of ['up', 'down', 'left', 'right']) if (held[a]) { if (startMove(w, m, ACT_DIR[a])) break; }
    }
  }
}

// ---------- arrivée sur une case : stations, bonus, lavage
function onEnterCell(w, m) {
  const { x, y } = m;
  const { R, V } = MAP.stations;
  const me = m.kind === 'player' && !w.demo;
  if (x === R[0] && y === R[1]) {
    if (m.water < 100) { m.water = 100; m.refills++; float(w, x, y, 'EAU 100 %', COL.cyan); if (me) sfx('refill'); sparkle(w, x, y, COL.cyan); }
  } else if (x === V[0] && y === V[1]) {
    if (m.grime > 0) { m.grime = 0; m.drains++; m.bonusPts += m.drainBonus; float(w, x, y, '+' + m.drainBonus + ' VIDANGE', COL.orange); if (me) sfx('drain'); sparkle(w, x, y, COL.orange); }
  }
  for (const b of w.bonuses) {
    if (!b.active || b.x !== x || b.y !== y) continue;
    takeBonus(w, m, b);
  }
  washCell(w, m, x, y, true);
  if (m.soap > 0) { // savon : trace de 3 cases de large
    const [dx, dy] = DV[m.dir];
    washCell(w, m, x + dy, y + dx, false);
    washCell(w, m, x - dy, y - dx, false);
  }
}

function canWash(m) { return m.water > 0 && m.grime < 100; }
function washCell(w, m, x, y, main) {
  if (!isFloor(x, y) || isStation(x, y)) return false;
  const s = w.st[y][x];
  const own = m.owner, other = own === PLAYER ? LAYA : PLAYER;
  if (s !== DIRTY && s !== NEST && s !== WET && s !== other) return false;
  if (!canWash(m)) {
    if (main && m.emptyAlarm <= 0) {
      m.emptyAlarm = 1.4;
      if (m.kind === 'player' && !w.demo) { sfx('alarm'); w.msg = m.water <= 0 ? 'empty' : 'full'; w.msgT = 2.5; }
    }
    return false;
  }
  m.water = Math.max(0, m.water - 2.5 * m.waterMul);
  if (s === NEST || s === WET) {
    w.hp[y][x] -= 1; m.grime = Math.min(100, m.grime + 2 * m.grimeMul);
    if (w.hp[y][x] > 0) { w.st[y][x] = WET; bubbles(w, x, y, 3); w.floorDirty = true; if (m.kind === 'player' && !w.demo) sfx('scrub'); return true; }
    w.wt[y][x] = w.nest[y][x] ? 2 : 1; // nids 2 pts, humide simple 1 pt
    w.sal[y][x] = null;
  } else if (s === DIRTY) {
    if (LV.twoPass && w.hp[y][x] > 1) { // salles 4-5 : 2 passages (sale → humide → propre)
      w.hp[y][x] -= 1; m.grime = Math.min(100, m.grime + 2 * m.grimeMul);
      w.st[y][x] = WET; bubbles(w, x, y, 3); w.floorDirty = true;
      if (m.kind === 'player' && !w.demo) sfx('scrub');
      return true;
    }
    m.grime = Math.min(100, m.grime + 3 * m.grimeMul);
    w.wt[y][x] = 1; w.sal[y][x] = null;
  } else { // repeint la case de l'adversaire
    m.grime = Math.min(100, m.grime + 3 * m.grimeMul);
  }
  w.st[y][x] = own; w.hp[y][x] = 0; m.washed++;
  w.floorDirty = true;
  bubbles(w, x, y, 6);
  if (m.kind === 'player' && !w.demo) sfx('wash');
  if (m.water <= 0 && m.kind === 'player' && !w.demo) { w.msg = 'empty'; w.msgT = 3; }
  if (m.grime >= 100 && m.kind === 'player' && !w.demo) { w.msg = 'full'; w.msgT = 3; }
  return true;
}

function takeBonus(w, m, b) {
  const me = m.kind === 'player' && !w.demo;
  b.active = false; b.t = BONUS_DEF[b.type].respawn;
  if (b.type === 'bonbonne') { m.water = Math.min(Math.max(100, m.water), m.water + 55); float(w, b.x, b.y, '+55 % EAU', COL.cyan); }
  if (b.type === 'savon') { m.soap = m.soapDur; float(w, b.x, b.y, 'SAVON !', COL.rose); }
  if (b.type === 'fusee') { m.rocket = m.rocketDur; float(w, b.x, b.y, 'FUSÉE !', COL.orange); }
  if (b.type === 'piece') { m.bonusPts += m.coinVal; float(w, b.x, b.y, '+' + m.coinVal, COL.jaune); }
  sparkle(w, b.x, b.y, COL.jaune);
  if (me) sfx('pickup');
  if (b.once) w.bonuses.splice(w.bonuses.indexOf(b), 1);
}

function fireTorpedo(m) {
  const w = world;
  if (!w) return;
  if (m.torpLeft <= 0) { if (m === w.player && !w.demo) sfx('bump'); return; }
  m.torpLeft--;
  const n = m.torpSize, h0 = Math.floor((n - 1) / 2), h1 = n - 1 - h0;
  let c = 0;
  for (let y = m.y - h0; y <= m.y + h1; y++) for (let x = m.x - h0; x <= m.x + h1; x++) {
    if (!isFloor(x, y) || isStation(x, y)) continue;
    const s = w.st[y][x];
    if (s === DIRTY || s === NEST || s === WET || s === (m.owner === PLAYER ? LAYA : PLAYER)) {
      w.wt[y][x] = (s === NEST || (s === WET && w.nest[y][x])) ? 2 : 1;
      w.st[y][x] = m.owner; w.hp[y][x] = 0; w.sal[y][x] = null; c++; bubbles(w, x, y, 4);
    }
  }
  w.floorDirty = true;
  w.waves.push({ x: m.x, y: m.y, n, t: 0, owner: m.owner });
  w.shake = 0.35;
  float(w, m.x, m.y, 'TORPILLE +' + c, m.owner === PLAYER ? COL.bleuC : COL.vertC);
  if (!w.demo) sfx('torpedo');
}

// ---------- pollueurs : repos → déplacement → action → repos
function soilCell(x, y, kind = 'dirty', sal = null) {
  const w = world;
  if (!w || !isFloor(x, y) || isStation(x, y)) return false;
  const s = w.st[y][x];
  if (s !== CLEAN && s !== PLAYER && s !== LAYA) return false; // ne salit qu'une case propre ou lavée
  if (kind === 'nest') { w.st[y][x] = NEST; w.hp[y][x] = 3; w.wt[y][x] = 2; w.nest[y][x] = true; w.sal[y][x] = sal || 'tas'; }
  else { w.st[y][x] = DIRTY; w.hp[y][x] = LV.twoPass ? 2 : 1; w.wt[y][x] = 1; w.sal[y][x] = sal; }
  w.dirtyByPolluters++;
  w.floorDirty = true;
  puff(w, x, y);
  if (!w.demo) sfx('soil');
  return true;
}

function bfs(w, sx, sy, passable) {
  const dist = makeGrid(-1), prev = makeGrid(null);
  const q = [[sx, sy]]; dist[sy][sx] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const d of ['N', 'E', 'S', 'W']) {
      const nx = x + DV[d][0], ny = y + DV[d][1];
      if (!inGrid(nx, ny) || dist[ny][nx] >= 0 || !passable(nx, ny)) continue;
      dist[ny][nx] = dist[y][x] + 1; prev[ny][nx] = [x, y, d]; q.push([nx, ny]);
    }
  }
  return { dist, prev, order: q };
}
function firstStep(b, tx, ty) {
  let cur = [tx, ty], d = null;
  while (b.prev[cur[1]][cur[0]]) { const p = b.prev[cur[1]][cur[0]]; d = p[2]; cur = [p[0], p[1]]; }
  return d;
}
function pathTo(b, tx, ty) {
  const path = []; let cur = [tx, ty];
  while (b.prev[cur[1]][cur[0]]) { const p = b.prev[cur[1]][cur[0]]; path.unshift(p[2]); cur = [p[0], p[1]]; }
  return path;
}
function polluterPassable(w, x, y, self) {
  if (!isFloor(x, y)) return false;
  for (const m of [w.player, w.laya]) if (occupiedBy(machineCells(m), x, y)) return false;
  if (w.granny && occupiedBy(grannyCells(w.granny), x, y)) return false;
  for (const p of w.polluters) if (p !== self && p.x === x && p.y === y) return false;
  return true;
}
function scarePolluters(w, x, y, r = 0) {
  for (const p of w.polluters.concat(w.ambient)) {
    if (p.fly) continue; // les volants ne se laissent pas intimider
    const dd = Math.max(Math.abs(p.x - x), Math.abs(p.y - y));
    if (dd > r) continue; // r=0 : seulement la case visée ; LA CRÉATURE : rayon 2
    const opts = ['N', 'E', 'S', 'W'].filter((d) => polluterPassable(w, p.x + DV[d][0], p.y + DV[d][1], p));
    p.state = 'move'; p.flee = 1.2; p.path = opts.length ? [pick(opts)] : [];
    if (p.kind === 'chien' && !w.demo) sfx('yap');
  }
}
function updatePolluter(w, p, dt) {
  if (p.fly) return updateFlyer(w, p, dt);
  if (p.flee > 0) p.flee -= dt;
  if (p.moving) {
    const sp = p.flee > 0 ? 2 : 1;
    const step = dt * sp / p.moveTime; p.t += step; p.dist += step;
    if (p.t >= 1) { p.t = 1; p.moving = false; }
    else return;
  }
  const coef = LV.coef;
  if (p.state === 'rest') {
    p.timer -= dt;
    if (p.timer <= 0) {
      // choisit une case cible propre ou lavée (de préférence lavée : c'est là que ça fait mal)
      const b = bfs(w, p.x, p.y, (x, y) => polluterPassable(w, x, y, p));
      const cands = [];
      for (const [x, y] of b.order) {
        const dd = b.dist[y][x];
        if (dd < 2 || dd > 9 || isStation(x, y)) continue;
        const s = w.st[y][x];
        if (!p.sal && !p.nests) { cands.push([x, y, 1]); continue; } // le chat se promène
        let wgt = 1;
        if (p.kind === 'raton' && MAP.poubelles.length) { // le raton laveur fouille près des poubelles
          const dp = Math.min(...MAP.poubelles.map(([px, py]) => Math.abs(px - x) + Math.abs(py - y)));
          if (dp <= 1) wgt = 5;
        }
        if (s === PLAYER || s === LAYA) cands.push([x, y, 3 * wgt]);
        else if (s === CLEAN) cands.push([x, y, wgt]);
      }
      if (!cands.length) { p.timer = 1; return; }
      const tot = cands.reduce((a, c) => a + c[2], 0);
      let r = Math.random() * tot, sel = cands[0];
      for (const c of cands) { r -= c[2]; if (r <= 0) { sel = c; break; } }
      p.target = [sel[0], sel[1]];
      p.path = pathTo(b, sel[0], sel[1]);
      p.state = 'move';
    }
    return;
  }
  if (p.state === 'move') {
    if (!p.path.length) {
      if (p.flee > 0 || !p.target || (!p.sal && !p.nests)) { p.state = 'rest'; p.timer = rnd(0.8, 1.6); p.target = null; return; }
      p.state = 'act'; p.timer = p.nests ? 1.0 : 0.7; return;
    }
    const d = p.path[0];
    const nx = p.x + DV[d][0], ny = p.y + DV[d][1];
    if (!polluterPassable(w, nx, ny, p)) { p.path = []; p.state = 'rest'; p.timer = rnd(0.4, 1.0); p.target = null; return; } // il évite les machines
    p.path.shift();
    p.fx = p.x; p.fy = p.y; p.x = nx; p.y = ny; p.t = 0; p.moving = true; p.dir = d;
    p.face = d;
    return;
  }
  if (p.state === 'act') {
    p.timer -= dt;
    if (p.timer <= 0) {
      if (p.sal || p.nests) soilCell(p.x, p.y, p.nests ? 'nest' : 'dirty', p.sal);
      p.state = 'rest';
      p.timer = Math.max(1.5, (p.restBase / coef) * rnd(0.6, 1.4));
      p.target = null;
    }
  }
}
// volants (mouette, oiseau du verger, pigeon d'ambiance) : volent, se posent, salissent, repartent
function updateFlyer(w, p, dt) {
  const def = POLL_DEF[p.kind];
  p.timer -= dt; p.dist += dt * 8;
  if (p.state === 'fly') {
    p.h = Math.min(26, p.h + dt * 60);
    p.t += dt / p.moveTime;
    if (p.t >= 1) {
      p.t = 1; p.state = 'rest'; p.timer = rnd(p.kind === 'pigeon' ? 4 : 2, p.kind === 'pigeon' ? 9 : 5);
      p.landed = false;
    }
  } else {
    p.h = Math.max(0, p.h - dt * 40);
    if (!p.landed) { p.landed = true; if (def.sal) soilCell(p.x, p.y, 'dirty', def.sal); }
    if (p.timer <= 0 || occupiedBy(machineCells(w.player), p.x, p.y) || occupiedBy(machineCells(w.laya), p.x, p.y)) {
      const [x, y] = pick(WALKABLE); p.fx = p.x; p.fy = p.y; p.x = x; p.y = y; p.t = 0; p.state = 'fly';
      p.moveTime = 0.35 * (Math.abs(p.x - p.fx) + Math.abs(p.y - p.fy) + 1); p.face = p.x >= p.fx ? 'E' : 'W';
    }
  }
}
function updatePigeon(w, p, dt) { return updateFlyer(w, p, dt); }

// ---------- grand-mère : obstacle mobile ultra-lent (0,10 case/s)
function updateGranny(w, dt) {
  const g = w.granny;
  g.countT += dt; if (g.countT > 1.2) { g.countT = 0; g.count = (g.count % 3) + 1; }
  if (g.angry > 0) g.angry -= dt;
  g.hits = g.hits.filter((t) => w.elapsed - t < 15);
  g.coinT -= dt;
  if (g.coinT <= 0) {
    g.coinT = 20;
    const spots = [[g.x, g.y], [g.x + 1, g.y], [g.x - 1, g.y], [g.x, g.y + 1], [g.x, g.y - 1]].filter(([x, y]) => isFloor(x, y) && !isStation(x, y) && !w.bonuses.some((b) => b.x === x && b.y === y && b.active));
    if (spots.length) { const [x, y] = spots[spots.length > 1 ? 1 + rndi(spots.length - 1) : 0]; w.bonuses.push({ type: 'piece', x, y, active: true, t: 0, once: true }); if (!w.demo) sfx('coin'); }
  }
  if (g.moving) {
    g.t += dt / 10; // 10 s par case
    if (g.t >= 1) { g.t = 1; g.moving = false; g.wait = rnd(1, 3); }
    return;
  }
  g.wait -= dt;
  if (g.wait > 0) return;
  const opts = ['N', 'E', 'S', 'W'].filter((d) => {
    const nx = g.x + DV[d][0], ny = g.y + DV[d][1];
    return isFloor(nx, ny) && !isStation(nx, ny) && !occupiedBy(machineCells(w.player), nx, ny) && !occupiedBy(machineCells(w.laya), nx, ny);
  });
  if (!opts.length) { g.wait = 1; return; }
  const d = opts.includes(g.dir) && Math.random() < 0.6 ? g.dir : pick(opts);
  g.fx = g.x; g.fy = g.y; g.x += DV[d][0]; g.y += DV[d][1]; g.t = 0; g.moving = true; g.dir = d;
}
function hitGranny(w, m) {
  const g = w.granny;
  if (m.bump > 0.05 && m.lastGrannyHit && w.elapsed - m.lastGrannyHit < 0.4) return;
  m.lastGrannyHit = w.elapsed;
  g.hits.push(w.elapsed);
  if (!w.demo && m.kind === 'player') sfx('bump');
  if (g.hits.length >= 2) {
    g.angry = 3; g.hits = [];
    if (m.slowImmune) { float(w, g.x, g.y, 'ÇA NE COLLLE PAS !', COL.cyan); } // LE ROBOT glisse sur les pièces
    else { m.slow = 2; float(w, g.x, g.y, 'RALENTI !', COL.rouge); }
    if (!w.demo) sfx('angry');
  }
}

// ---------- effets (particules, textes flottants)
function cellCenter(x, y) { return [GX + x * CELL + CELL / 2, GY + y * ROW + ROW / 2]; }
function bubbles(w, x, y, n) {
  const [cx, cy] = cellCenter(x, y);
  for (let i = 0; i < n; i++) w.particles.push({ x: cx + rnd(-12, 12), y: cy + rnd(-8, 10), vx: rnd(-6, 6), vy: rnd(-22, -8), life: rnd(0.4, 0.8), t: 0, kind: 'bubble', r: pick([1, 2, 2, 3]) });
}
function sparkle(w, x, y, col) {
  const [cx, cy] = cellCenter(x, y);
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; w.particles.push({ x: cx, y: cy - 8, vx: Math.cos(a) * 50, vy: Math.sin(a) * 50, life: 0.45, t: 0, kind: 'spark', col }); }
}
function puff(w, x, y) {
  const [cx, cy] = cellCenter(x, y);
  for (let i = 0; i < 8; i++) w.particles.push({ x: cx + rnd(-6, 6), y: cy + rnd(-2, 6), vx: rnd(-25, 25), vy: rnd(-20, -2), life: rnd(0.4, 0.7), t: 0, kind: 'puff', col: pick([COL.sale, COL.saleC, '#6E4628']) });
}
function float(w, x, y, str, col) { const [cx, cy] = cellCenter(x, y); w.floats.push({ x: cx, y: cy - 30, str, col, t: 0 }); }

// ---------- scores
function scores(w) {
  let p = 0, l = 0, dirty = 0, nests = 0, total = 0;
  for (const [x, y] of WALKABLE) {
    if (isStation(x, y)) continue;
    total++;
    const s = w.st[y][x];
    if (s === PLAYER) p += w.wt[y][x];
    else if (s === LAYA) l += w.wt[y][x];
    else if (s === DIRTY) dirty++;
    else if (s === NEST || s === WET) { dirty++; nests++; }
  }
  return { player: p, laya: l, dirty, nests, clean: Math.round(100 * (total - dirty) / total) };
}
function countCells(w, owner) { let n = 0; for (const [x, y] of WALKABLE) if (w.st[y][x] === owner) n++; return n; }

// ---------- mise à jour du monde
function updateWorld(w, dt) {
  w.elapsed += dt;
  if (w.shake > 0) w.shake = Math.max(0, w.shake - dt);
  if (w.msgT > 0) w.msgT -= dt;
  for (const b of w.bonuses) if (!b.active && !b.once) { b.t -= dt; if (b.t <= 0 && !occupiedBy(machineCells(w.player), b.x, b.y) && !occupiedBy(machineCells(w.laya), b.x, b.y)) b.active = true; }
  updateMachine(w, w.player, dt);
  updateMachine(w, w.laya, dt);
  for (const p of w.polluters) updatePolluter(w, p, dt);
  for (const p of w.ambient) updatePolluter(w, p, dt);
  updateGranny(w, dt);
  for (const p of w.particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'puff') p.vy += 40 * dt; }
  w.particles = w.particles.filter((p) => p.t < p.life);
  for (const f of w.floats) f.t += dt;
  w.floats = w.floats.filter((f) => f.t < 1.2);
  for (const v of w.waves) v.t += dt;
  w.waves = w.waves.filter((v) => v.t < 0.6);
  if (w.player.water <= 0 && !w.demo && w.msgT <= 0) { w.msg = 'empty'; w.msgT = 0.5; }
  else if (w.player.grime >= 100 && !w.demo && w.msgT <= 0) { w.msg = 'full'; w.msgT = 0.5; }
}

// =====================================================================================================
// IA — LAYA (et le « joueur » de la démo de l'écran titre)
// =====================================================================================================
function aiThink(w, m, dt) {
  if (m.think > 0) { m.think -= dt; return; }
  const passable = (x, y) => !blockedForMachine(w, m, x, y);
  const b = bfs(w, m.x, m.y, passable);
  const { R, V } = MAP.stations;
  let goal = null;
  // 1. ressources
  if (m.water < 15 && b.dist[R[1]][R[0]] > 0) goal = R;
  else if (m.grime > 85 && b.dist[V[1]][V[0]] > 0) goal = V;
  // 4. torpille si >= 12 cases sales dans sa zone 5×5
  if (m.torpLeft > 0) {
    let n = 0;
    for (let y = m.y - 2; y <= m.y + 2; y++) for (let x = m.x - 2; x <= m.x + 2; x++) if (inGrid(x, y)) { const s = w.st[y][x]; if (s === DIRTY || s === NEST || s === WET) n++; }

    for (const bo of w.bonuses) {

function drawBoxD(L, x0, x1, y0, y1, z0, z1, P) {

// ---- construction des couches statiques de la salle (appelée par setRoom) ----
function buildRoomScene() {
  const Wt = wallTexFor(LV.num);
  const entries = [];
  // mur nord : un seul volume (x 128..832, y 16..40, z 0..64) ; décals posés sur sa face avant
  const north = layerOfBoxes([[128, 832, 16, 40, 0, 64]]);
  drawBoxD(north, 128, 832, 16, 40, 0, 64, { top: texP(Wt.top), front: texP(Wt.face) });
  for (const xs of Object.keys(LV.north)) {
    const art = texD('dec_' + LV.num + '_' + LV.north[xs].slice('mur_nord_'.length)); // art 64×112 monde, posé en 64×56 sur la face (z 4..60)
    if (!art) continue;
    const hArt = halfD({ W: art.width, H: art.height, ox: 0, oy: 0, d: art });
    drawBoxD(north, +xs * 64, +xs * 64 + 64, 39, 40, 4, 60, {
      front: (u, v) => {
        const uu = Math.max(0, Math.min(63, Math.floor(u))), vv = Math.max(0, Math.min(hArt.height - 1, Math.floor(v)));
        const i2 = (vv * hArt.width + uu) * 4;

  // murs latéraux : une boîte par rangée (24 px épais, 64 de haut), pour le tri
  for (let r = 1; r <= ROWS - 2; r++) {
    const y0 = r * CD2, y1 = y0 + CD2;
    for (const [side, xa] of [['ouest', 64 - EP2], ['est', (COLS - 1) * CW2 - EP2]]) {
      const L = layerOfBoxes([[xa, xa + EP2, y0, y1, 0, 64]]);
      drawBoxD(L, xa, xa + EP2, y0, y1, 0, 64, { top: texP(Wt.topS), front: texP(Wt.face), side: texP(Wt.cote) });
      outlineD(L, 'MARINE');
      entries.push(layerToEntry('mur_' + side + '_' + r, L, y1, xa + EP2 / 2));
    }

  outlineD(sud, 'MARINE');
  entries.push(layerToEntry('mur_sud', sud, 520, XC2));

  for (const p of MAP.props) {
    const vol = volOf(p.el);

    entries.push(layerToEntry(p.el + '@' + p.x + ',' + p.y, volLayer(vol, p.x * 64, p.y * 40), (p.y + p.h) * CD2, (p.x + p.l / 2) * 64));
  }

// ombres de contact : empreinte des volumes décalée selon la hauteur (1 px logique par ~10 de haut)
function buildShadowsH() {

  g.fillStyle = '#202430';

    if (!vol) return;

    g.fill();

  for (const p of MAP.props) foot(volOf(p.el), p.x, p.y);
  for (const kk of ['R', 'V']) { const [x, y] = MAP.stations[kk]; foot(stationVol(kk), x, y); }
  g.fillRect(CELL, ROW, (COLS - 2) * CELL, 4);      // sous le mur nord

  // bandeau de la salle : posé au-dessus du mur nord, son bord bas passe derrière le chaperon

  if (band) { const ba = band.at;
    ctx.drawImage(IMG.atlas, ba.x, ba.y, ba.w, ba.h,
      GX + (COLS * CELL - ba.w / 2) / 2, GY + (16 - 64) / 2 - ba.h / 2 + 7, ba.w / 2, ba.h / 2);
  }
  ctx.drawImage(floorCanvas, GX, GY);
  // vagues de torpille (au sol)
  for (const v of w.waves) {
    const k = v.t / 0.6, h0 = Math.floor((v.n - 1) / 2);
    ctx.globalAlpha = 1 - k; ctx.fillStyle = v.owner === PLAYER ? COL.cyan : COL.vertC;
    const x0 = GX + (v.x - h0) * CELL, y0 = GY + (v.y - h0) * ROW, s = v.n * CELL, sv = v.n * ROW, gr = Math.round(k * 10);
    ctx.fillRect(x0 - gr, y0 - gr, s + gr * 2, 3); ctx.fillRect(x0 - gr, y0 + sv + gr - 3, s + gr * 2, 3);
    ctx.fillRect(x0 - gr, y0 - gr, 3, sv + gr * 2); ctx.fillRect(x0 + s + gr - 3, y0 - gr, 3, sv + gr * 2);
    ctx.globalAlpha = 1;
  }
  // ---- tri painter : statique (murs, stations, meubles) + bonus/pictos/acteurs, par clé
  // (ligne de base croissante, décor avant acteurs, puis éloignement de l'axe caméra)
  const items = ROOMSCENE.static.map((e) => ({ key: e.key, prop: e }));
  for (const b of w.bonuses) {
    if (!b.active) continue;
    items.push({ key: [(b.y + 1) * CD2, 0.5, -Math.abs(b.x * 64 + 32 - XC2)], draw: () => drawBonus(w, b) });
  }
  // pictogrammes flottants des stations (vues a/b alternées, z = 124)
  for (const kk of ['R', 'V']) {
    const [sx, sy] = MAP.stations[kk];
    const t = texD('picto_' + (kk === 'R' ? 'recharge' : 'vidange') + (Math.floor(w.elapsed * 2) % 2 ? '_b' : '_a'));
    if (!t) continue;
    const xw = sx * 64 + 32, z = 124, footY = sy * 40 + 7;
    const px = Math.round(GX + (xw + kOf(xw) * z) / 2), py = Math.round(GY + (footY - z) / 2);
    items.push({ key: [(sy + 1) * CD2, 0.5, -Math.abs(xw - XC2)], draw: () => {
      ctx.drawImage(pictoCanvas('picto_' + (kk === 'R' ? 'recharge' : 'vidange') + (Math.floor(w.elapsed * 2) % 2 ? '_b' : '_a')), px - 10, py - 12, 20, 12);
    } });
  }
  pushActorItems(w, items);
  items.sort((a, b) => a.key[0] - b.key[0] || a.key[1] - b.key[1] || a.key[2] - b.key[2]);
  const drawn = [];
  const xrayList = [];
  for (const it of items) {
    if (it.prop) {
      const p = it.prop;
      ctx.drawImage(p.cv, Math.round(p.sx) + GX, Math.round(p.sy) + GY);
      drawn.push(p);
    } else {
      if (it.draw) it.draw();
      if (it.spec && it.kind) xrayList.push([it.spec, it.kind]);
    }
  }
  // rayons X après le passage complet : la trame doit rester au-dessus des meubles
  // dessinés APRÈS l'acteur (sinon ils la recouvrent, comme le sprite lui-même)
  for (const [spec, kind] of xrayList) xray(spec, kind, drawn);
  // pollueurs en vol : au-dessus de tout
  for (const p of w.polluters.concat(w.ambient)) {
    if (p.fly && p.h > 4) drawPolluter(w, p, p._spr);
  }
  // flèche rebondissante vers la station utile (réservoir presque vide / cuve presque pleine)
  if (!w.demo) {
    const p = w.player, need = p.water < 15 ? 'R' : p.grime > 85 ? 'V' : null;
    if (need) {
      const [sx, sy] = MAP.stations[need];
      // flèche posée au sol devant la station, pointe vers elle (le haut de la station sort du cadre)
      const ax = GX + sx * CELL + CELL / 2, ay = GY + (sy + 1) * ROW + 6 + Math.round(Math.abs(Math.sin(w.elapsed * 6)) * 4);
      const col = need === 'R' ? COL.cyan : COL.orange;
      for (let i = 0; i < 7; i++) { ctx.fillStyle = COL.nuit; ctx.fillRect(ax - 1 - i, ay - 1 + i, 3 + 2 * i, 2); }
      for (let i = 0; i < 6; i++) { ctx.fillStyle = col; ctx.fillRect(ax - i, ay + i, 1 + 2 * i, 1); }
      ctx.fillStyle = COL.nuit; ctx.fillRect(ax - 3, ay + 6, 7, 7); ctx.fillStyle = col; ctx.fillRect(ax - 2, ay + 6, 5, 6);
    }

  for (const kk of ['R', 'V']) {
    const [sx, sy] = MAP.stations[kk];
    const cx = GX + sx * CELL + CELL / 2;
    const ty = Math.round(GY + (sy * CD2 - stationVol(kk).hauteur_px - 10) / 2);
    const str = kk === 'R' ? 'RECHARGE' : 'VIDANGE';
    const tw = textW(str) + 4;

    ctx.fillStyle = kk === 'R' ? COL.bleuF : COL.rougeF; ctx.fillRect(Math.round(lx), ty - 2, tw, 11);
    text(str, Math.round(lx) + 2, ty, COL.blanc);
  }
  // particules et textes flottants
  for (const p of w.particles) {
    const k = p.t / p.life;
    if (p.kind === 'bubble') { ctx.fillStyle = k < 0.7 ? COL.blanc : COL.bleuC; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.r, p.r); }
    else { ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
  }
  for (const f of w.floats) text(f.str, Math.round(f.x), Math.round(f.y - f.t * 22), f.col, 1, 'center', COL.nuit);
  // flèche vers la station quand le réservoir est vide / le bac plein
  if (!w.demo && (w.player.water <= 0 || w.player.grime >= 100)) {
    const tgt = w.player.water <= 0 ? MAP.stations.R : MAP.stations.V;
    const [px2, py2] = entPos(w.player);
    const ang = Math.atan2(tgt[1] - py2, tgt[0] - px2);
    const cx = GX + px2 * CELL + CELL / 2 + Math.cos(ang) * 22, cy = GY + py2 * ROW + 10 + Math.sin(ang) * 10 - 30;
    if (Math.floor(w.elapsed * 4) % 2) arrow(cx, cy, ang, w.player.water <= 0 ? COL.cyan : COL.orange);
  }
  ctx.restore();
}
// acteurs : machines (joueur, Laya), grand-mère, pollueurs au sol — avec sprite et clé de tri
function pushActorItems(w, items) {
  const push = (spec, kind, draw, base, xc) => {
    items.push({ key: [base, 1, -Math.abs(xc - XC2)], draw, spec: Object.assign({}, spec, { key0: base, key1: 1, key2: -Math.abs(xc - XC2) }), kind });
  };
  for (const m of [w.player, w.laya]) {
    const spr = getMachineSprite(m);
    const spec = machSpec(m, spr);
    push(spec, m.kind, () => drawMachine(w, m, spr), baseOf(m), xcOf(m));
  }
  const g = w.granny;
  if (g) {
    const r = grannyFrame(g, w);
    const meta = metaOf('pnj_granny');
    const [ex, ey] = entPos(g);
    const gfx = Math.round(GX + ex * CELL + CELL / 2), gfy = Math.round(GY + ey * ROW + 14), ghd = hdReady('granny');
    const spec = ghd ? hdSpec(ghd, gfx, gfy, 0) : { img: IMG.pnj_granny, sx: r.sx, sy: r.sy, fw: meta.fw, fh: meta.fh,
      ax: meta.fw / 2, ay: meta.sol, fx: gfx, fy: gfy };
    push(spec, 'granny', () => drawGranny(w), baseOf(g), xcOf(g));
  }
  for (const p of w.polluters.concat(w.ambient)) {
    if (p.fly && p.h > 4) { p._spr = polluterFrame(p, w); continue; } // en vol : dessiné au-dessus de tout
    const spr = polluterFrame(p, w);
    const spec = pollSpec(p, spr);
    push(spec, 'poll', () => drawPolluter(w, p, spr), baseOf(p), xcOf(p));
  }
}
function arrow(cx, cy, ang, col) {
  ctx.save(); ctx.translate(Math.round(cx), Math.round(cy)); ctx.rotate(ang);
  ctx.fillStyle = COL.nuit; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(-5, -7); ctx.lineTo(-5, 7); ctx.closePath(); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(7, 0); ctx.lineTo(-3, -5); ctx.lineTo(-3, 5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

  });
  text(IS_TOUCH ? '◄ ► : CHOISIR   B : JOUER' : '← → : CHOISIR   ENTRÉE : JOUER   ÉCHAP : RETOUR', W / 2, H - 18, COL.lilasC, 1, 'center');
}
function renderCountdown() {
  renderArena(world); renderHUD(world);
  const n = Math.ceil(app.countdown / 0.8) - 1;
  const str = n >= 1 ? String(n) : 'GO !';
  const cx = GX + COLS * CELL / 2;

}
function renderPause() {
  renderArena(world); renderHUD(world);
  const cx = GX + COLS * CELL / 2;
  ctx.globalAlpha = 0.55; ctx.fillStyle = COL.nuit; ctx.fillRect(VIEW.x, HUD_H, VIEW.w, VIEW.h - HUD_H - BOT_H); ctx.globalAlpha = 1;

    if (t === '.') { const s = w.st[y][x2]; c = s === DIRTY ? COL.sale : s === NEST || s === WET ? '#4A2E20' : s === PLAYER ? COL.bleu : s === LAYA ? COL.vert : COL.cremeC; }

  text(IS_TOUCH ? 'B : REPRENDRE' : 'P / ÉCHAP / ENTRÉE : REPRENDRE', cx, 144, COL.blanc, 1, 'center');

  const labels = ['REJOUER', 'MENU'];
  labels.forEach((l, i) => {

  text(IS_TOUCH ? '◄ ► : CHOISIR   B : VALIDER' : '← → : CHOISIR   ENTRÉE : VALIDER', cx, 392, COL.lilasC, 1, 'center');
  text(CHARS[world.cfg.charIdx].name + ' · ' + MACHINES[world.cfg.machIdx].name, cx, 410, COL.ardoC, 1, 'center');

// ---------- transitions
function startDemo() {
  setRoom(app.demoRoom); // la démo tourne dans une salle (elle change à chaque retour au titre)
  app.demo = createWorld({ charIdx: 0, demo: true }); // démo : LA POUSSETTE (IMG_7922) contre Laya
  app.demo.player.ai = true;
  world = app.demo;
}
function startRound() {
  setRoom(app.roomIdx);
  world = createWorld({ charIdx: app.charIdx, machIdx: app.machIdx, demo: false });
  app.mode = 'countdown'; app.countdown = 3.2; app.results = null; app.resSel = 0;
  sfx('count');
}
function endRound() {
  const w = world, sc = scores(w);
  let winner = sc.player > sc.laya ? 'player' : sc.laya > sc.player ? 'laya' : null, tieBreak = false;
  if (!winner) {
    tieBreak = true;
    winner = w.player.bonusPts > w.laya.bonusPts ? 'player' : w.laya.bonusPts > w.player.bonusPts ? 'laya' : 'tie';
  }
  const prev = readRecord(LV.num);
  const newRecord = sc.player > prev;
  if (newRecord) localStorage.setItem(recordKey(LV.num), String(sc.player));
  app.results = { t: 0, player: sc.player, laya: sc.laya, pBonus: w.player.bonusPts, lBonus: w.laya.bonusPts, winner, tieBreak,
    resoiled: w.dirtyByPolluters, clean: sc.clean, record: Math.max(prev, sc.player), newRecord, salle: LV.num };
  app.mode = 'results'; app.resSel = 0;
  sfx(winner === 'player' ? 'win' : 'end');
}

// =====================================================================================================
// AUDIO — Web Audio, sons 8-bit synthétisés (touche M)
// =====================================================================================================
let AC = null, master = null;
function audioUnlock() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C(); master = AC.createGain(); master.connect(AC.destination); applyMute();
}
function applyMute() { if (master) master.gain.value = app.muted ? 0 : 0.18; }
function tone(freq, dur, type = 'square', vol = 1, slide = 0, delay = 0) {
  if (!AC || app.muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.6, delay = 0) {
  if (!AC || app.muted) return;
  const t0 = AC.currentTime + delay;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (((i * 1103515245 + 12345) >>> 16) & 1 ? 1 : -1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(master); s.start(t0);
}
function sfx(name) {
  switch (name) {
    case 'blip': tone(660, 0.05, 'square', 0.5); break;
    case 'ok': tone(523, 0.06); tone(784, 0.08, 'square', 1, 0, 0.06); break;
    case 'back': tone(392, 0.06); tone(262, 0.08, 'square', 1, 0, 0.06); break;
    case 'step': tone(180, 0.03, 'triangle', 0.5); break;
    case 'wash': tone(880, 0.05, 'square', 0.35, 300); noise(0.05, 0.15); break;
    case 'scrub': noise(0.08, 0.3); tone(220, 0.06, 'square', 0.3); break;
    case 'pickup': tone(988, 0.05); tone(1319, 0.09, 'square', 1, 0, 0.05); break;
    case 'coin': tone(1319, 0.05, 'square', 0.4); tone(1760, 0.08, 'square', 0.4, 0, 0.05); break;
    case 'refill': for (let i = 0; i < 5; i++) tone(400 + i * 120, 0.05, 'triangle', 0.7, 0, i * 0.04); break;
    case 'drain': for (let i = 0; i < 5; i++) tone(900 - i * 120, 0.05, 'square', 0.4, 0, i * 0.04); break;
    case 'alarm': tone(880, 0.12, 'square', 0.6); tone(660, 0.12, 'square', 0.6, 0, 0.14); break;
    case 'bump': tone(110, 0.08, 'square', 0.5, -40); break;
    case 'angry': tone(200, 0.1, 'sawtooth', 0.6); tone(150, 0.15, 'sawtooth', 0.6, 0, 0.1); break;
    case 'soil': noise(0.06, 0.2); tone(150, 0.06, 'triangle', 0.3, -60); break;
    case 'yap': tone(700, 0.04, 'square', 0.4, 200); tone(700, 0.04, 'square', 0.4, 200, 0.08); break;
  case 'slip': tone(1200, 0.18, 'sine', 0.4, -700); noise(0.12, 0.2, 0.02); break;
    case 'torpedo': noise(0.4, 0.8); tone(120, 0.4, 'sawtooth', 0.7, -80); break;
    case 'count': tone(440, 0.12, 'square', 0.6); break;
    case 'go': tone(880, 0.25, 'square', 0.7); break;
    case 'end': [523, 392, 330, 262].forEach((f, i) => tone(f, 0.16, 'square', 0.6, 0, i * 0.16)); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.6, 0, i * 0.12)); break;
    default: break;
  }
}

// =====================================================================================================
// BOUCLE PRINCIPALE + MISE À L'ÉCHELLE ENTIÈRE
// =====================================================================================================
const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window) || QS.get('touch') === '1';
function layout() {
  document.body.classList.toggle('touch', IS_TOUCH);
  const land = innerWidth >= innerHeight;
  document.body.classList.toggle('portrait', IS_TOUCH && !land);
  const dpr = window.devicePixelRatio || 1;
  let aw = innerWidth, ah = innerHeight;
  if (IS_TOUCH) { if (land) aw -= 2 * 188; else ah -= 230; }
  aw = Math.max(aw, 100); ah = Math.max(ah, 100);
  // Échelle entière en pixels physiques SI elle remplit au moins 95 % de la place ; sinon échelle libre
  // (sur iPhone, dpr 3 : l'échelle entière ×1 donnait un jeu de 226 pt de large sur 390).
  const cw = canvas.width / RS, ch = canvas.height / RS;
  const fit = Math.min(aw / cw, ah / ch);
  const k = Math.floor(fit * dpr);
  const css = k >= 1 && k / dpr >= 0.95 * fit ? k / dpr : fit;
  canvas.style.width = (cw * css) + 'px';
  canvas.style.height = (ch * css) + 'px';
  app.scale = +(css * dpr).toFixed(3);
}
let last = 0;
function frame(ts) {
  const now = ts / 1000;
  let dt = last ? now - last : 1 / 60;
  last = now;
  if (dt > 0) { app.fpsAcc += dt; app.fpsN++; if (app.fpsAcc >= 0.5) { app.fps = Math.round(app.fpsN / app.fpsAcc); app.fpsAcc = 0; app.fpsN = 0; } }
  dt = Math.min(dt, 0.05) * app.timeScale;
  app.time += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function update(dt) {
  switch (app.mode) {
    case 'title': case 'charPick': case 'roomPick':
      if (app.demo) { world = app.demo; updateWorld(app.demo, dt); app.demo.timeLeft -= dt; if (app.demo.timeLeft <= 0) { app.demoRoom = (app.demoRoom + 1) % LEVELS.length; startDemo(); } }
      break;
    case 'countdown': {
      const before = Math.ceil(app.countdown / 0.8);
      app.countdown -= dt;
      const after = Math.ceil(app.countdown / 0.8);
      if (after !== before && after >= 2) sfx('count');
      if (after === 1 && before !== 1) sfx('go');
      if (app.countdown <= 0) app.mode = 'play';
      break;
    }
    case 'play':
      updateWorld(world, dt);
      world.timeLeft -= dt;
      if (world.timeLeft <= 0) { world.timeLeft = 0; endRound(); }
      break;
    case 'results':
      if (app.results) app.results.t += dt;
      updateWorld(world, 0);
      break;
    default: break;
  }
}
function render() {
  const v = IN_ARENA[app.mode] && world ? VIEW : null;
  const cw = v ? v.w : W, ch = v ? v.h : H;
  if (canvas.width !== cw * RS || canvas.height !== ch * RS) { canvas.width = cw * RS; canvas.height = ch * RS; layout(); }
  ctx.setTransform(RS, 0, 0, RS, v ? -v.x * RS : 0, v ? -v.y * RS : 0);   // tout le jeu en ×RS, PNJ HD à demi-échelle
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = COL.nuit; ctx.fillRect(0, 0, W, H);
  switch (app.mode) {
    case 'boot': text('CHARGEMENT…', W / 2, H / 2, COL.blanc, 2, 'center'); break;
    case 'title': renderTitle(); break;
    case 'charPick': renderCharPick(); break;
    case 'roomPick': renderRoomPick(); break;
    case 'countdown': renderCountdown(); break;
    case 'play': renderArena(world); renderHUD(world); break;
    case 'pause': renderPause(); break;
    case 'results': renderResults(); break;
    default: break;
  }
}

// =====================================================================================================
// OUTILS DE TEST — window.__state(), window.__dbg, window.__test
// =====================================================================================================
function stateSnapshot() {
  const w = world && !world.demo ? world : null;
  const sc = w ? scores(w) : null;
  return {
    mode: app.mode, seed: SEED, scale: app.scale, fps: app.fps, touch: IS_TOUCH, muted: app.muted, bootError: app.bootError || null,
    selection: { charIdx: app.charIdx, machIdx: app.machIdx, roomIdx: app.roomIdx },
    timeLeft: w ? +w.timeLeft.toFixed(2) : null, time: w ? +w.elapsed.toFixed(2) : null,
    level: LV ? LV.num : null,
    room: LV ? { num: LV.num, name: LV.name, diff: LV.diff, coef: LV.coef, stars: LV.stars,
      nids: LV.nests, pollueurs: LV.pollueurs.reduce((a, p) => a + p[1], 0),
      twoPass: LV.twoPass, ice: LV.ice, record: readRecord(LV.num) } : null,
    playerCells: w ? countCells(w, PLAYER) : 0, layaCells: w ? countCells(w, LAYA) : 0,
    wetCells: w ? countCells(w, WET) : 0,
    playerScore: sc ? sc.player : 0, layaScore: sc ? sc.laya : 0, dirtyCells: sc ? sc.dirty : 0, clean: sc ? sc.clean : 0,
    dirtyByPolluters: w ? w.dirtyByPolluters : 0,
    water: w ? +w.player.water.toFixed(1) : null, grime: w ? +w.player.grime.toFixed(1) : null,
    layaWater: w ? +w.laya.water.toFixed(1) : null, layaGrime: w ? +w.laya.grime.toFixed(1) : null,
    playerRefills: w ? w.player.refills : 0, playerDrains: w ? w.player.drains : 0,
    layaRefills: w ? w.laya.refills : 0, layaDrains: w ? w.laya.drains : 0,
    player: w ? { x: w.player.x, y: w.player.y, moving: w.player.moving, soap: +w.player.soap.toFixed(2), rocket: +w.player.rocket.toFixed(2), torpLeft: w.player.torpLeft, bonus: w.player.bonusPts } : null,
    laya: w ? { x: w.laya.x, y: w.laya.y, torpLeft: w.laya.torpLeft, bonus: w.laya.bonusPts } : null,
    granny: w ? { x: w.granny.x, y: w.granny.y, angry: w.granny.angry > 0 } : null,
    polluters: w ? w.polluters.map((p) => ({ kind: p.kind, x: p.x, y: p.y, state: p.state })) : [],
    loadout: w ? w.loadout : { personnage: CHARS[app.charIdx].name, machine: MACHINES[CHARS[app.charIdx].machIdx].name },
    results: app.results ? { player: app.results.player, laya: app.results.laya, winner: app.results.winner, record: app.results.record } : null,
  };
}
window.__state = stateSnapshot;
Object.defineProperty(window, '__dbg', { get: stateSnapshot });
window.__test = {
  setTimeLeft(s) { if (world && !world.demo) world.timeLeft = s; },
  setTimeScale(k) { app.timeScale = k; },
  setWater(v) { if (world && !world.demo) world.player.water = v; },
  setGrime(v) { if (world && !world.demo) world.player.grime = v; },
  setLayaWater(v) { if (world) world.laya.water = v; },
  setLayaGrime(v) { if (world) world.laya.grime = v; },
  cell(x, y) { return world ? world.st[y][x] : null; },
  soilCell: (x, y, k) => soilCell(x, y, k),
  startRoom(idx) { app.roomIdx = ((idx % LEVELS.length) + LEVELS.length) % LEVELS.length; startRound(); },
  station(k) { return MAP.stations[k === 'V' ? 'V' : 'R'].slice(); },
  walkableCount() { return WALKABLE.length; },
  bfsPath(tx, ty) { // chemin de cases (directions) du joueur vers une case, pour les scripts de test
    const w = world; const b = bfs(w, w.player.x, w.player.y, (x, y) => !blockedForMachine(w, w.player, x, y));
    return b.dist[ty][tx] >= 0 ? pathTo(b, tx, ty) : null;
  },
};

// =====================================================================================================
// DÉMARRAGE
// =====================================================================================================
buildFont(); // la police doit exister avant le premier rendu (écran de chargement)
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
layout();
bindTouchButtons();
requestAnimationFrame(frame);
loadImages().then(() => {
  startDemo(); // appelle setRoom → buildNavy + buildShadows de la salle de démo
  app.mode = 'title';
}).catch((e) => { app.mode = 'boot'; app.bootError = (e && e.stack) || String(e); });

</script>
