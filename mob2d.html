<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MOB RACER — jeu 16-bit de machines à laver le sol</title>
<style>
/* ============================================================ */
/* MOB RACER 2D — page hôte : canvas centré + pads tactiles     */
/* Les boutons tactiles émettent de vrais KeyboardEvent        */
/* (voir game.js : KEYMAP / emitKey / bindTouchButtons).        */
/* ============================================================ */
html, body { margin: 0; padding: 0; height: 100%; background: #202430; overflow: hidden; }
body {
  display: flex; flex-direction: row; align-items: stretch;
  font-family: "Courier New", monospace;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
#stage { flex: 1 1 auto; order: 0; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
canvas#game {
  display: block; background: #202430; touch-action: none; cursor: pointer;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
#bottombar { display: none; }
.pad { display: none; }

/* ---- mode tactile (pointer: coarse ou ?touch=1) : pads visibles ---- */
body.touch .pad {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; touch-action: none;
}
/* paysage : D-pad à gauche (188 px), A/B à droite (188 px), jamais sur l'arène */
body.touch #bottombar { display: contents; }
body.touch:not(.portrait) #padL { order: -1; flex: 0 0 188px; max-width: 188px; }
body.touch:not(.portrait) #padR { order: 1; flex: 0 0 188px; max-width: 188px; }
/* portrait : barre de 230 px sous le jeu, D-pad à gauche, A/B à droite */
body.touch.portrait { flex-direction: column; }
body.touch.portrait #bottombar { display: flex; flex: 0 0 230px; max-height: 230px; }
body.touch.portrait .pad { flex: 1 1 50%; }

button {
  -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none;
  border: 2px solid #8C95B4; border-radius: 8px; background: #343A5C; color: #FCFAF2;
  font: 700 24px "Courier New", monospace; padding: 0; outline: none;
}
button.on, button:active { background: #FFD23E; color: #3C2C56; border-color: #FCFAF2; }

.dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 3px; }
.dpad button { border-radius: 10px; }
.dpad .up    { grid-area: 1 / 2; }
.dpad .left  { grid-area: 2 / 1; }
.dpad .down  { grid-area: 3 / 2; }
.dpad .right { grid-area: 2 / 3; }

.ab { display: flex; gap: 12px; }
.ab button { width: 74px; height: 74px; border-radius: 50%; font-size: 26px; }
.mini { display: flex; gap: 12px; }
.mini button { width: 56px; height: 56px; border-radius: 10px; font-size: 20px; }
.lbl { color: #8C95B4; font-size: 11px; letter-spacing: 1px; text-align: center; }
</style>
</head>
<body>
<div id="stage"><canvas id="game" width="680" height="472"></canvas></div>

<div id="bottombar">
  <div class="pad" id="padL" aria-label="Commandes directionnelles">
    <div class="dpad">
      <button data-k="up"    class="up"    aria-label="Haut">▲</button>
      <button data-k="left"  class="left"  aria-label="Gauche">◀</button>
      <button data-k="down"  class="down"  aria-label="Bas">▼</button>
      <button data-k="right" class="right" aria-label="Droite">▶</button>
    </div>
    <div class="lbl">D-PAD<br>1 CASE PAR APPUI</div>
  </div>
  <div class="pad" id="padR" aria-label="Actions">
    <div class="ab">
      <button data-k="a" aria-label="Torpille">A</button>
      <button data-k="b" aria-label="Valider">B</button>
    </div>
    <div class="lbl">A : TORPILLE · B : VALIDER</div>
    <div class="mini">
      <button data-k="pause" aria-label="Pause">⏸</button>
      <button data-k="mute"  aria-label="Son">♪</button>
    </div>
  </div>
</div>

// =====================================================================================================
// ENTRÉES (clavier + boutons tactiles qui réémettent de vrais KeyboardEvent)
// =====================================================================================================
const held = { up: false, down: false, left: false, right: false };
function actionOf(e) {
  switch (e.key) { // flèches et touches nommées : e.key
    case 'ArrowUp': return 'up'; case 'ArrowDown': return 'down'; case 'ArrowLeft': return 'left'; case 'ArrowRight': return 'right';
    case 'Enter': return 'ok'; case ' ': return 'torp'; case 'Escape': return 'pause';
    case 'm': case 'M': return 'mute'; case 'p': case 'P': return 'pause'; case 'h': case 'H': return 'help';
    default: break;
  }
  switch (e.code) { // lettres : position physique (ZQSD sur AZERTY = KeyW/A/S/D)
    case 'KeyW': return 'up'; case 'KeyS': return 'down'; case 'KeyA': return 'left'; case 'KeyD': return 'right';
    case 'KeyE': case 'Space': return 'torp'; case 'NumpadEnter': return 'ok';
    default: return null;
  }
}
const ACT_DIR = { up: 'N', down: 'S', left: 'W', right: 'E' };
window.addEventListener('keydown', (e) => {
  const a = actionOf(e);
  if (!a) return;
  e.preventDefault();
  audioUnlock();
  if (ACT_DIR[a]) held[a] = true;
  // répétition automatique du clavier ignorée, sauf pendant la fusée (déplacement continu)
  if (e.repeat && !(app.mode === 'play' && world && world.player.rocket > 0)) return;
  onAction(a);
});
window.addEventListener('keyup', (e) => { const a = actionOf(e); if (a && ACT_DIR[a]) held[a] = false; });
window.addEventListener('blur', () => { for (const k in held) held[k] = false; });

function onAction(a) {
  if (a === 'mute') { app.muted = !app.muted; localStorage.setItem('mob2d_muted', app.muted ? '1' : '0'); applyMute(); return; }
  switch (app.mode) {
    case 'title':
      if (a === 'help' || a === 'torp') { app.help = !app.help; sfx('blip'); }
      else if (a === 'ok') { app.help = false; app.mode = 'charPick'; sfx('ok'); }
      break;
    case 'charPick':
      if (a === 'left' || a === 'right' || a === 'up' || a === 'down') { app.charIdx = (app.charIdx + 1) % CHARS.length; sfx('blip'); }
      else if (a === 'ok') { app.mode = 'vehPick'; sfx('ok'); }
      else if (a === 'pause') { app.mode = 'title'; sfx('back'); }
      break;
    case 'vehPick':
      if (a === 'left' || a === 'up') { app.machIdx = (app.machIdx + MACHINES.length - 1) % MACHINES.length; sfx('blip'); }
      else if (a === 'right' || a === 'down') { app.machIdx = (app.machIdx + 1) % MACHINES.length; sfx('blip'); }
      else if (a === 'ok') { startRound(); sfx('ok'); }
      else if (a === 'pause') { app.mode = 'charPick'; sfx('back'); }
      break;
    case 'play':
      if (ACT_DIR[a]) playerPress(ACT_DIR[a]);
      else if (a === 'torp') fireTorpedo(world.player);
      else if (a === 'pause') { app.mode = 'pause'; sfx('back'); }
      break;
    case 'pause':
      if (a === 'pause' || a === 'ok') { app.mode = 'play'; sfx('ok'); }
      break;
    case 'results':
      if (app.results && app.results.t < 1.2) break;
      if (ACT_DIR[a]) { app.resSel = 1 - app.resSel; sfx('blip'); }
      else if (a === 'ok') { sfx('ok'); if (app.resSel === 0) startRound(); else { app.mode = 'title'; startDemo(); } }
      break;
    default: break;
  }
}

// Boutons tactiles : ils émettent les mêmes KeyboardEvent que le clavier
const KEYMAP = {
  up: { key: 'ArrowUp', code: 'ArrowUp' }, down: { key: 'ArrowDown', code: 'ArrowDown' },
  left: { key: 'ArrowLeft', code: 'ArrowLeft' }, right: { key: 'ArrowRight', code: 'ArrowRight' },
  a: { key: ' ', code: 'Space' }, b: { key: 'Enter', code: 'Enter' }, pause: { key: 'Escape', code: 'Escape' }, mute: { key: 'm', code: 'KeyM' },
};
function emitKey(type, k) { window.dispatchEvent(new KeyboardEvent(type, { key: k.key, code: k.code, bubbles: true, cancelable: true })); }
function bindTouchButtons() {
  document.querySelectorAll('[data-k]').forEach((btn) => {
    const k = KEYMAP[btn.dataset.k];
    let down = false;
    const press = (e) => { e.preventDefault(); if (down) return; down = true; btn.classList.add('on'); emitKey('keydown', k); };
    const release = (e) => { e.preventDefault(); if (!down) return; down = false; btn.classList.remove('on'); emitKey('keyup', k); };
    btn.addEventListener('pointerdown', press);
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', release);
    btn.addEventListener('pointerleave', release);
    btn.addEventListener('contextmenu', (e) => e.preventDefault());
  });
  // tap sur le jeu = Entrée
  canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); emitKey('keydown', KEYMAP.b); emitKey('keyup', KEYMAP.b); });
}

// =====================================================================================================
// LOGIQUE — monde, grille, déplacements
// =====================================================================================================
function inGrid(x, y) { return x >= 0 && y >= 0 && x < COLS && y < ROWS; }
function makeGrid(v) { return Array.from({ length: ROWS }, () => new Array(COLS).fill(v)); }

function parseLayout() {
  const tile = makeGrid('#'); // '#' mur, 'P' prop, '.' sol
  const props = []; const stations = {}; const bonusSpots = []; const coins = [];
  const L = LAYOUT.map((r) => r.split(''));
  const used = makeGrid(false);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = L[y][x];
    if (c === '#') { tile[y][x] = '#'; continue; }
    if ('GgFKPBN'.includes(c)) { tile[y][x] = 'P'; continue; }
    tile[y][x] = '.';
    if (c === 'R') stations.R = [x, y];
    if (c === 'V') stations.V = [x, y];
    if (c === 'E') bonusSpots.push(['bonbonne', x, y]);
    if (c === 'S') bonusSpots.push(['savon', x, y]);
    if (c === 'X') bonusSpots.push(['fusee', x, y]);
    if (c === 'O') coins.push([x, y]);
  }
  for (const [x, y] of EXTRA_WATER) bonusSpots.push(['bonbonne', x, y]);
  // props : runs horizontaux / verticaux (règles de la légende Q)
  let gAlt = 0, kAlt = 0;
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = L[y][x];
    if (used[y][x] || !'GgFKPBN'.includes(c)) continue;
    if (c === 'g') { let n = 0; while (y + n < ROWS && L[y + n][x] === 'g') { used[y + n][x] = true; n++; } props.push({ el: 'gondole_1x3', x, y, l: 1, h: n }); continue; }
    if (c === 'P' || c === 'B') { used[y][x] = true; props.push({ el: c === 'P' ? 'presentoir_1x1' : 'bac_plante_1x1', x, y, l: 1, h: 1 }); continue; }
    let n = 0; while (x + n < COLS && L[y][x + n] === c) { used[y][x + n] = true; n++; }
    if (c === 'G') {
      let off = 0;
      while (off < n) { const len = (n - off === 2 || n - off === 4) ? 2 : Math.min(3, n - off); const el = len === 3 ? (gAlt++ % 2 ? 'gondole_3x1_b' : 'gondole_3x1') : 'gondole_2x1'; props.push({ el, x: x + off, y, l: len, h: 1 }); off += len; }
    } else {
      for (let off = 0; off < n; off += 2) {
        const el = c === 'F' ? 'congelateur_2x1' : c === 'N' ? 'banc_2x1' : (kAlt++ % 2 ? 'caisse_2x1_b' : 'caisse_2x1');
        props.push({ el, x: x + off, y, l: 2, h: 1 });
      }
    }
  }
  for (const p of props) p.row = p.y + p.h - 1;
  return { tile, props, stations, bonusSpots, coins };
}
const MAP = parseLayout();
const WALKABLE = [];
for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (MAP.tile[y][x] === '.') WALKABLE.push([x, y]);
function isFloor(x, y) { return inGrid(x, y) && MAP.tile[y][x] === '.'; }
function isStation(x, y) { const { R, V } = MAP.stations; return (R[0] === x && R[1] === y) || (V[0] === x && V[1] === y); }

function makeMachine(kind, x, y, opts) {
  return {
    kind, x, y, fx: x, fy: y, t: 1, moving: false, dir: kind === 'player' ? 'E' : 'W', face: kind === 'player' ? 'E' : 'W', turnDiag: null,
    moveTime: opts.moveTime, baseMoveTime: opts.moveTime, dist: 0, water: 100, grime: 0, bonusPts: 0,
    soap: 0, rocket: 0, slow: 0, torpLeft: 1, torpSize: opts.torpSize, grip: opts.grip, inertia: opts.inertia,
    soapDur: 4 * (opts.soapMul || 1), buffer: null, bump: 0, think: 0, ai: opts.ai, owner: kind === 'player' ? PLAYER : LAYA,
    emptyAlarm: 0, sheet: opts.sheet, pivotSheet: opts.pivotSheet, label: opts.label, washed: 0, slipNext: false,
  };
}

function createWorld(cfg) {
  const w = {
    cfg, st: makeGrid(CLEAN), hp: makeGrid(0), wt: makeGrid(1), floorDirty: true,
    timeLeft: ROUND_TIME, elapsed: 0, dirtyByPolluters: 0, particles: [], floats: [], waves: [], shake: 0,
    bonuses: [], polluters: [], ambient: [], granny: null, msg: null, msgT: 0, demo: !!cfg.demo,
  };
  // sol : ~70 % des cases praticables sales, puis les nids (graine)
  const reserved = new Set();
  const key = (x, y) => x + ',' + y;
  const { R, V } = MAP.stations;
  reserved.add(key(R[0], R[1])); reserved.add(key(V[0], V[1]));
  for (const [, x, y] of MAP.bonusSpots) reserved.add(key(x, y));
  for (const [x, y] of MAP.coins) reserved.add(key(x, y));
  reserved.add(key(SPAWN_PLAYER[0], SPAWN_PLAYER[1])); reserved.add(key(SPAWN_LAYA[0], SPAWN_LAYA[1]));
  reserved.add(key(GRANNY_START[0], GRANNY_START[1]));
  const cand = WALKABLE.filter(([x, y]) => !reserved.has(key(x, y)));
  for (const [x, y] of cand) if (Math.random() < 0.7 / (cand.length / WALKABLE.length)) w.st[y][x] = DIRTY;
  const nestCand = cand.filter(([x, y]) => Math.abs(x - SPAWN_PLAYER[0]) + Math.abs(y - SPAWN_PLAYER[1]) > 2 && Math.abs(x - SPAWN_LAYA[0]) + Math.abs(y - SPAWN_LAYA[1]) > 2);
  for (let i = 0; i < LEVEL.nests && nestCand.length; i++) {
    const [x, y] = nestCand.splice(rndi(nestCand.length), 1)[0];
    w.st[y][x] = NEST; w.hp[y][x] = 3; w.wt[y][x] = 2;
  }
  // bonus
  for (const [type, x, y] of MAP.bonusSpots) w.bonuses.push({ type, x, y, active: true, t: 0 });
  for (const [x, y] of MAP.coins) w.bonuses.push({ type: 'piece', x, y, active: true, t: 0, once: true });
  // machines
  const ch = CHARS[cfg.charIdx], mc = MACHINES[cfg.machIdx];
  const playerFactor = (mc.speed / 100) * ch.speedMul;
  const sheet = ch.composite ? 'comp_' + mc.id : 'mach_' + mc.id;
  w.player = makeMachine('player', SPAWN_PLAYER[0], SPAWN_PLAYER[1], {
    moveTime: MOVE_TIME / playerFactor, torpSize: ch.torp, grip: mc.grip, inertia: ch.inertia, soapMul: ch.soapMul,
    ai: !!cfg.demo, sheet, label: 'TOI',
  });
  w.laya = makeMachine('laya', SPAWN_LAYA[0], SPAWN_LAYA[1], {
    moveTime: MOVE_TIME / (playerFactor * LEVEL.layaSpeed), torpSize: 5, grip: 140, inertia: 1, soapMul: 1, ai: true, sheet: 'laya', label: 'LAYA',
  });
  w.loadout = {
    personnage: ch.name + ' (IMG_' + ch.id + ')', machine: mc.name,
    effets: {
      vitesse_machine: mc.speed, adherence: mc.grip, bonus_personnage: ch.perk,
      temps_par_case_s: +w.player.moveTime.toFixed(4), torpille: ch.torp + '×' + ch.torp, savon_s: w.player.soapDur,
      sprite: ch.composite ? 'composite ' + ch.id + ' + ' + mc.id : 'machine seule (' + mc.id + ')',
      laya_temps_par_case_s: +w.laya.moveTime.toFixed(4),
    },
  };
  // pollueurs (salle 1 : 2 clients + 2 chiens) et ambiance (chat, pigeon)
  const spots = WALKABLE.filter(([x, y]) => !isStation(x, y) && !reserved.has(key(x, y)));
  let ci = 0;
  for (const p of LEVEL.pollueurs) for (let i = 0; i < p.n; i++) {
    const [x, y] = spots.splice(rndi(spots.length), 1)[0];
    w.polluters.push(makePolluter(p.kind, x, y, ci++));
  }
  { const [x, y] = spots.splice(rndi(spots.length), 1)[0]; w.ambient.push(makePolluter('chat', x, y, 0)); }
  w.ambient.push(makePolluter('pigeon', 7, 5, 0));
  w.granny = { x: GRANNY_START[0], y: GRANNY_START[1], fx: GRANNY_START[0], fy: GRANNY_START[1], t: 1, moving: false, dir: 'E',
    coinT: 20, count: 0, countT: 0, hits: [], angry: 0, wait: 2 };
  return w;
}

function makePolluter(kind, x, y, i) {
  const base = { client: { mt: 0.5, rest: 6 }, chien: { mt: 0.26, rest: 6 }, chat: { mt: 0.4, rest: 4 }, pigeon: { mt: 0.3, rest: 8 } }[kind];
  const coef = LEVEL.coef;
  return {
    kind, x, y, fx: x, fy: y, t: 1, moving: false, dir: 'E', face: 'E', dist: 0,
    state: 'rest', timer: rnd(1.5, 4) / coef + i * 0.7, path: [], target: null,
    moveTime: base.mt / (1 + 0.15 * (coef - 1)), restBase: base.rest, skin: kind === 'client' ? (i % 2 ? 'client_bleu' : 'client_costume') : null,
    flee: 0, fly: kind === 'pigeon' ? 1 : 0, h: kind === 'pigeon' ? 26 : 0,
  };
}

// ---------- occupation des cases
function machineCells(m) { return m.moving ? [[m.fx, m.fy], [m.x, m.y]] : [[m.x, m.y]]; }
function grannyCells(g) { return g.moving ? [[g.fx, g.fy], [g.x, g.y]] : [[g.x, g.y]]; }
function occupiedBy(cells, x, y) { return cells.some(([a, b]) => a === x && b === y); }
function blockedForMachine(w, m, x, y) {
  if (!isFloor(x, y)) return 'wall';
  const other = m === w.player ? w.laya : w.player;
  if (occupiedBy(machineCells(other), x, y)) return 'machine';
  if (w.granny && occupiedBy(grannyCells(w.granny), x, y)) return 'granny';
  return null;
}

// ---------- démarrage d'un déplacement
function startMove(w, m, d) {
  const [dx, dy] = DV[d];
  const nx = m.x + dx, ny = m.y + dy;
  const prev = m.dir;
  m.dir = d;
  const blk = blockedForMachine(w, m, nx, ny);
  if (blk) {
    m.face = d; m.bump = 0.12;
    if (blk === 'granny') hitGranny(w, m);
    else if (m.kind === 'player' && !w.demo) sfx('bump');
    return false;
  }
  m.turnDiag = (prev !== d && DIAG[prev + ',' + d]) ? DIAG[prev + ',' + d] : null;
  m.fx = m.x; m.fy = m.y; m.x = nx; m.y = ny; m.t = 0; m.moving = true; m.face = d;
  let mt = m.baseMoveTime;
  if (m.soap > 0) mt /= 1.6;
  if (m.rocket > 0) mt /= 1.9;
  if (m.slow > 0) mt *= 2;
  m.moveTime = mt;
  scarePolluters(w, nx, ny);
  if (m.kind === 'player' && !w.demo) sfx('step');
  return true;
}

function playerPress(d) {
  const p = world.player;
  if (!p.moving) startMove(world, p, d);
  else p.buffer = { d, t: world.elapsed };
}

// ---------- mise à jour d'une machine
function updateMachine(w, m, dt) {
  if (m.soap > 0) m.soap = Math.max(0, m.soap - dt);
  if (m.rocket > 0) m.rocket = Math.max(0, m.rocket - dt);
  if (m.slow > 0) m.slow = Math.max(0, m.slow - dt);
  if (m.bump > 0) m.bump = Math.max(0, m.bump - dt);
  if (m.emptyAlarm > 0) m.emptyAlarm -= dt;
  if (m.moving) {
    const step = dt / m.moveTime;
    m.t += step; m.dist += Math.min(step, 1 - (m.t - step));
    if (m.t >= 1) {
      m.t = 1; m.moving = false; m.turnDiag = null;
      onEnterCell(w, m);
      // glissade (sol savonneux) : chance de glisser d'une case de plus
      if (m.soap > 0 && !m.slipNext) {
        const p = Math.min(0.9, 0.5 * 100 / m.grip * m.inertia);
        if (Math.random() < p) { m.slipNext = true; if (startMove(w, m, m.dir)) return; }
      }
      m.slipNext = false;
    }
  }
  if (!m.moving) {
    if (m.ai) { aiThink(w, m, dt); return; }
    // appui mémorisé pendant le déplacement précédent
    if (m.buffer && w.elapsed - m.buffer.t <= BUFFER_WINDOW) { const d = m.buffer.d; m.buffer = null; if (startMove(w, m, d)) return; }
    m.buffer = null;
    // fusée : déplacement continu touche maintenue
    if (m.rocket > 0) {
      for (const a of ['up', 'down', 'left', 'right']) if (held[a]) { if (startMove(w, m, ACT_DIR[a])) break; }
    }
  }
}

// ---------- arrivée sur une case : stations, bonus, lavage
function onEnterCell(w, m) {
  const { x, y } = m;
  const { R, V } = MAP.stations;
  const me = m.kind === 'player' && !w.demo;
  if (x === R[0] && y === R[1]) {
    if (m.water < 100) { m.water = 100; float(w, x, y, 'EAU 100 %', COL.cyan); if (me) sfx('refill'); sparkle(w, x, y, COL.cyan); }
  } else if (x === V[0] && y === V[1]) {
    if (m.grime > 0) { m.grime = 0; m.bonusPts += 5; float(w, x, y, '+5 VIDANGE', COL.orange); if (me) sfx('drain'); sparkle(w, x, y, COL.orange); }
  }
  for (const b of w.bonuses) {
    if (!b.active || b.x !== x || b.y !== y) continue;
    takeBonus(w, m, b);
  }
  washCell(w, m, x, y, true);
  if (m.soap > 0) { // savon : trace de 3 cases de large
    const [dx, dy] = DV[m.dir];
    washCell(w, m, x + dy, y + dx, false);
    washCell(w, m, x - dy, y - dx, false);
  }
}

function canWash(m) { return m.water > 0 && m.grime < 100; }
function washCell(w, m, x, y, main) {
  if (!isFloor(x, y) || isStation(x, y)) return false;
  const s = w.st[y][x];
  const own = m.owner, other = own === PLAYER ? LAYA : PLAYER;
  if (s !== DIRTY && s !== NEST && s !== WET && s !== other) return false;
  if (!canWash(m)) {
    if (main && m.emptyAlarm <= 0) {
      m.emptyAlarm = 1.4;
      if (m.kind === 'player' && !w.demo) { sfx('alarm'); w.msg = m.water <= 0 ? 'empty' : 'full'; w.msgT = 2.5; }
    }
    return false;
  }
  m.water = Math.max(0, m.water - 2.5);
  if (s === NEST || s === WET) {
    w.hp[y][x] -= 1; m.grime = Math.min(100, m.grime + 2);
    if (w.hp[y][x] > 0) { w.st[y][x] = WET; bubbles(w, x, y, 3); w.floorDirty = true; if (m.kind === 'player' && !w.demo) sfx('scrub'); return true; }
    w.wt[y][x] = 2;
  } else if (s === DIRTY) {
    m.grime = Math.min(100, m.grime + 3);
    w.wt[y][x] = 1;
  } else { // repeint la case de l'adversaire
    m.grime = Math.min(100, m.grime + 3);
  }
  w.st[y][x] = own; w.hp[y][x] = 0; m.washed++;
  w.floorDirty = true;
  bubbles(w, x, y, 6);
  if (m.kind === 'player' && !w.demo) sfx('wash');
  if (m.water <= 0 && m.kind === 'player' && !w.demo) { w.msg = 'empty'; w.msgT = 3; }
  if (m.grime >= 100 && m.kind === 'player' && !w.demo) { w.msg = 'full'; w.msgT = 3; }
  return true;
}

function takeBonus(w, m, b) {
  const me = m.kind === 'player' && !w.demo;
  b.active = false; b.t = BONUS_DEF[b.type].respawn;
  if (b.type === 'bonbonne') { m.water = Math.min(100, m.water + 55); float(w, b.x, b.y, '+55 % EAU', COL.cyan); }
  if (b.type === 'savon') { m.soap = m.soapDur; float(w, b.x, b.y, 'SAVON !', COL.rose); }
  if (b.type === 'fusee') { m.rocket = 4.5; float(w, b.x, b.y, 'FUSÉE !', COL.orange); }
  if (b.type === 'piece') { m.bonusPts += 1; float(w, b.x, b.y, '+1', COL.jaune); }
  sparkle(w, b.x, b.y, COL.jaune);
  if (me) sfx('pickup');
  if (b.once) w.bonuses.splice(w.bonuses.indexOf(b), 1);
}

function fireTorpedo(m) {
  const w = world;
  if (!w) return;
  if (m.torpLeft <= 0) { if (m === w.player && !w.demo) sfx('bump'); return; }
  m.torpLeft--;
  const n = m.torpSize, h0 = Math.floor((n - 1) / 2), h1 = n - 1 - h0;
  let c = 0;
  for (let y = m.y - h0; y <= m.y + h1; y++) for (let x = m.x - h0; x <= m.x + h1; x++) {
    if (!isFloor(x, y) || isStation(x, y)) continue;
    const s = w.st[y][x];
    if (s === DIRTY || s === NEST || s === WET || s === (m.owner === PLAYER ? LAYA : PLAYER)) {
      if (s === NEST || s === WET) w.wt[y][x] = 2; else if (s === DIRTY) w.wt[y][x] = 1;
      w.st[y][x] = m.owner; w.hp[y][x] = 0; c++; bubbles(w, x, y, 4);
    }
  }
  w.floorDirty = true;
  w.waves.push({ x: m.x, y: m.y, n, t: 0, owner: m.owner });
  w.shake = 0.35;
  float(w, m.x, m.y, 'TORPILLE +' + c, m.owner === PLAYER ? COL.bleuC : COL.vertC);
  if (!w.demo) sfx('torpedo');
}

// ---------- pollueurs : repos → déplacement → action → repos
function soilCell(x, y, kind = 'dirty') {
  const w = world;
  if (!w || !isFloor(x, y) || isStation(x, y)) return false;
  const s = w.st[y][x];
  if (s !== CLEAN && s !== PLAYER && s !== LAYA) return false; // ne salit qu'une case propre ou lavée
  if (kind === 'nest') { w.st[y][x] = NEST; w.hp[y][x] = 3; w.wt[y][x] = 2; } else { w.st[y][x] = DIRTY; w.hp[y][x] = 1; w.wt[y][x] = 1; }
  w.dirtyByPolluters++;
  w.floorDirty = true;
  puff(w, x, y);
  if (!w.demo) sfx('soil');
  return true;
}

function bfs(w, sx, sy, passable) {
  const dist = makeGrid(-1), prev = makeGrid(null);
  const q = [[sx, sy]]; dist[sy][sx] = 0;
  for (let i = 0; i < q.length; i++) {
    const [x, y] = q[i];
    for (const d of ['N', 'E', 'S', 'W']) {
      const nx = x + DV[d][0], ny = y + DV[d][1];
      if (!inGrid(nx, ny) || dist[ny][nx] >= 0 || !passable(nx, ny)) continue;
      dist[ny][nx] = dist[y][x] + 1; prev[ny][nx] = [x, y, d]; q.push([nx, ny]);
    }
  }
  return { dist, prev, order: q };
}
function firstStep(b, tx, ty) {
  let cur = [tx, ty], d = null;
  while (b.prev[cur[1]][cur[0]]) { const p = b.prev[cur[1]][cur[0]]; d = p[2]; cur = [p[0], p[1]]; }
  return d;
}
function pathTo(b, tx, ty) {
  const path = []; let cur = [tx, ty];
  while (b.prev[cur[1]][cur[0]]) { const p = b.prev[cur[1]][cur[0]]; path.unshift(p[2]); cur = [p[0], p[1]]; }
  return path;
}
function polluterPassable(w, x, y, self) {
  if (!isFloor(x, y)) return false;
  for (const m of [w.player, w.laya]) if (occupiedBy(machineCells(m), x, y)) return false;
  if (w.granny && occupiedBy(grannyCells(w.granny), x, y)) return false;
  for (const p of w.polluters) if (p !== self && p.x === x && p.y === y) return false;
  return true;
}
function scarePolluters(w, x, y) {
  for (const p of w.polluters.concat(w.ambient)) {
    if (p.x !== x || p.y !== y || p.kind === 'pigeon') continue;
    // la machine le fait fuir (sans points)
    const opts = ['N', 'E', 'S', 'W'].filter((d) => polluterPassable(w, p.x + DV[d][0], p.y + DV[d][1], p));
    p.state = 'move'; p.flee = 1.2; p.path = opts.length ? [pick(opts)] : [];
    if (p.kind === 'chien' && !w.demo) sfx('yap');
  }
}
function updatePolluter(w, p, dt) {
  if (p.flee > 0) p.flee -= dt;
  if (p.kind === 'pigeon') return updatePigeon(w, p, dt);
  if (p.moving) {
    const sp = p.flee > 0 ? 2 : 1;
    const step = dt * sp / p.moveTime; p.t += step; p.dist += step;
    if (p.t >= 1) { p.t = 1; p.moving = false; }
    else return;
  }
  const coef = LEVEL.coef;
  if (p.state === 'rest') {
    p.timer -= dt;
    if (p.timer <= 0) {
      // choisit une case cible propre ou lavée (de préférence lavée : c'est là que ça fait mal)
      const b = bfs(w, p.x, p.y, (x, y) => polluterPassable(w, x, y, p));
      const cands = [];
      for (const [x, y] of b.order) {
        const dd = b.dist[y][x];
        if (dd < 2 || dd > 9 || isStation(x, y)) continue;
        const s = w.st[y][x];
        if (p.kind === 'chat') { cands.push([x, y, 1]); continue; }
        if (s === PLAYER || s === LAYA) cands.push([x, y, 3]);
        else if (s === CLEAN) cands.push([x, y, 1]);
      }
      if (!cands.length) { p.timer = 1; return; }
      const tot = cands.reduce((a, c) => a + c[2], 0);
      let r = Math.random() * tot, sel = cands[0];
      for (const c of cands) { r -= c[2]; if (r <= 0) { sel = c; break; } }
      p.target = [sel[0], sel[1]];
      p.path = pathTo(b, sel[0], sel[1]);
      p.state = 'move';
    }
    return;
  }
  if (p.state === 'move') {
    if (!p.path.length) {
      if (p.flee > 0 || !p.target) { p.state = 'rest'; p.timer = rnd(0.8, 1.6); p.target = null; return; }
      p.state = 'act'; p.timer = p.kind === 'chien' ? 1.0 : 0.7; return;
    }
    const d = p.path[0];
    const nx = p.x + DV[d][0], ny = p.y + DV[d][1];
    if (!polluterPassable(w, nx, ny, p)) { p.path = []; p.state = 'rest'; p.timer = rnd(0.4, 1.0); p.target = null; return; } // il évite les machines
    p.path.shift();
    p.fx = p.x; p.fy = p.y; p.x = nx; p.y = ny; p.t = 0; p.moving = true; p.dir = d;
    if (d === 'E' || d === 'W') p.face = d;
    return;
  }
  if (p.state === 'act') {
    p.timer -= dt;
    if (p.timer <= 0) {
      if (p.kind === 'client') soilCell(p.x, p.y, 'dirty');
      if (p.kind === 'chien') soilCell(p.x, p.y, 'nest');
      p.state = 'rest';
      p.timer = Math.max(1.5, (p.restBase / coef) * rnd(0.6, 1.4));
      p.target = null;
    }
  }
}
// pigeon (ambiance, bonus d'atlas) : se pose, picore, s'envole
function updatePigeon(w, p, dt) {
  p.timer -= dt; p.dist += dt * 8;
  if (p.state === 'rest') {
    p.h = Math.max(0, p.h - dt * 40);
    if (p.timer <= 0 || occupiedBy(machineCells(w.player), p.x, p.y) || occupiedBy(machineCells(w.laya), p.x, p.y)) {
      const [x, y] = pick(WALKABLE); p.fx = p.x; p.fy = p.y; p.x = x; p.y = y; p.t = 0; p.state = 'fly';
      p.moveTime = 0.35 * (Math.abs(p.x - p.fx) + Math.abs(p.y - p.fy) + 1); p.face = p.x >= p.fx ? 'E' : 'W';
    }
  } else {
    p.h = Math.min(26, p.h + dt * 60);
    p.t += dt / p.moveTime;
    if (p.t >= 1) { p.t = 1; p.state = 'rest'; p.timer = rnd(4, 9); }
  }
}

// ---------- grand-mère : obstacle mobile ultra-lent (0,10 case/s)
function updateGranny(w, dt) {
  const g = w.granny;
  g.countT += dt; if (g.countT > 1.2) { g.countT = 0; g.count = (g.count % 3) + 1; }
  if (g.angry > 0) g.angry -= dt;
  g.hits = g.hits.filter((t) => w.elapsed - t < 15);
  g.coinT -= dt;
  if (g.coinT <= 0) {
    g.coinT = 20;
    const spots = [[g.x, g.y], [g.x + 1, g.y], [g.x - 1, g.y], [g.x, g.y + 1], [g.x, g.y - 1]].filter(([x, y]) => isFloor(x, y) && !isStation(x, y) && !w.bonuses.some((b) => b.x === x && b.y === y && b.active));
    if (spots.length) { const [x, y] = spots[spots.length > 1 ? 1 + rndi(spots.length - 1) : 0]; w.bonuses.push({ type: 'piece', x, y, active: true, t: 0, once: true }); if (!w.demo) sfx('coin'); }
  }
  if (g.moving) {
    g.t += dt / 10; // 10 s par case
    if (g.t >= 1) { g.t = 1; g.moving = false; g.wait = rnd(1, 3); }
    return;
  }
  g.wait -= dt;
  if (g.wait > 0) return;
  const opts = ['N', 'E', 'S', 'W'].filter((d) => {
    const nx = g.x + DV[d][0], ny = g.y + DV[d][1];
    return isFloor(nx, ny) && !isStation(nx, ny) && !occupiedBy(machineCells(w.player), nx, ny) && !occupiedBy(machineCells(w.laya), nx, ny);
  });
  if (!opts.length) { g.wait = 1; return; }
  const d = opts.includes(g.dir) && Math.random() < 0.6 ? g.dir : pick(opts);
  g.fx = g.x; g.fy = g.y; g.x += DV[d][0]; g.y += DV[d][1]; g.t = 0; g.moving = true; g.dir = d;
}
function hitGranny(w, m) {
  const g = w.granny;
  if (m.bump > 0.05 && m.lastGrannyHit && w.elapsed - m.lastGrannyHit < 0.4) return;
  m.lastGrannyHit = w.elapsed;
  g.hits.push(w.elapsed);
  if (!w.demo && m.kind === 'player') sfx('bump');
  if (g.hits.length >= 2) {
    g.angry = 3; g.hits = []; m.slow = 2;
    float(w, g.x, g.y, 'RALENTI !', COL.rouge);
    if (!w.demo) sfx('angry');
  }
}

// ---------- effets (particules, textes flottants)
function cellCenter(x, y) { return [GX + x * CELL + CELL / 2, GY + y * CELL + CELL / 2]; }
function bubbles(w, x, y, n) {
  const [cx, cy] = cellCenter(x, y);
  for (let i = 0; i < n; i++) w.particles.push({ x: cx + rnd(-12, 12), y: cy + rnd(-8, 10), vx: rnd(-6, 6), vy: rnd(-22, -8), life: rnd(0.4, 0.8), t: 0, kind: 'bubble', r: pick([1, 2, 2, 3]) });
}
function sparkle(w, x, y, col) {
  const [cx, cy] = cellCenter(x, y);
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; w.particles.push({ x: cx, y: cy - 8, vx: Math.cos(a) * 50, vy: Math.sin(a) * 50, life: 0.45, t: 0, kind: 'spark', col }); }
}
function puff(w, x, y) {
  const [cx, cy] = cellCenter(x, y);
  for (let i = 0; i < 8; i++) w.particles.push({ x: cx + rnd(-6, 6), y: cy + rnd(-2, 6), vx: rnd(-25, 25), vy: rnd(-20, -2), life: rnd(0.4, 0.7), t: 0, kind: 'puff', col: pick([COL.sale, COL.saleC, '#6E4628']) });
}
function float(w, x, y, str, col) { const [cx, cy] = cellCenter(x, y); w.floats.push({ x: cx, y: cy - 30, str, col, t: 0 }); }

// ---------- scores
function scores(w) {
  let p = 0, l = 0, dirty = 0, nests = 0, total = 0;
  for (const [x, y] of WALKABLE) {
    if (isStation(x, y)) continue;
    total++;
    const s = w.st[y][x];
    if (s === PLAYER) p += w.wt[y][x];
    else if (s === LAYA) l += w.wt[y][x];
    else if (s === DIRTY) dirty++;
    else if (s === NEST || s === WET) { dirty++; nests++; }
  }
  return { player: p, laya: l, dirty, nests, clean: Math.round(100 * (total - dirty) / total) };
}
function countCells(w, owner) { let n = 0; for (const [x, y] of WALKABLE) if (w.st[y][x] === owner) n++; return n; }

// ---------- mise à jour du monde
function updateWorld(w, dt) {
  w.elapsed += dt;
  if (w.shake > 0) w.shake = Math.max(0, w.shake - dt);
  if (w.msgT > 0) w.msgT -= dt;
  for (const b of w.bonuses) if (!b.active && !b.once) { b.t -= dt; if (b.t <= 0 && !occupiedBy(machineCells(w.player), b.x, b.y) && !occupiedBy(machineCells(w.laya), b.x, b.y)) b.active = true; }
  updateMachine(w, w.player, dt);
  updateMachine(w, w.laya, dt);
  for (const p of w.polluters) updatePolluter(w, p, dt);
  for (const p of w.ambient) updatePolluter(w, p, dt);
  updateGranny(w, dt);
  for (const p of w.particles) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.kind === 'puff') p.vy += 40 * dt; }
  w.particles = w.particles.filter((p) => p.t < p.life);
  for (const f of w.floats) f.t += dt;
  w.floats = w.floats.filter((f) => f.t < 1.2);
  for (const v of w.waves) v.t += dt;
  w.waves = w.waves.filter((v) => v.t < 0.6);
  if (w.player.water <= 0 && !w.demo && w.msgT <= 0) { w.msg = 'empty'; w.msgT = 0.5; }
  else if (w.player.grime >= 100 && !w.demo && w.msgT <= 0) { w.msg = 'full'; w.msgT = 0.5; }
}

// =====================================================================================================
// IA — LAYA (et le « joueur » de la démo de l'écran titre)
// =====================================================================================================
function aiThink(w, m, dt) {
  if (m.think > 0) { m.think -= dt; return; }
  const passable = (x, y) => !blockedForMachine(w, m, x, y);
  const b = bfs(w, m.x, m.y, passable);
  const { R, V } = MAP.stations;
  let goal = null;
  // 1. ressources
  if (m.water < 15 && b.dist[R[1]][R[0]] > 0) goal = R;
  else if (m.grime > 85 && b.dist[V[1]][V[0]] > 0) goal = V;
  // 4. torpille si >= 12 cases sales dans sa zone 5×5
  if (m.torpLeft > 0) {
    let n = 0;
    for (let y = m.y - 2; y <= m.y + 2; y++) for (let x = m.x - 2; x <= m.x + 2; x++) if (inGrid(x, y)) { const s = w.st[y][x]; if (s === DIRTY || s === NEST || s === WET) n++; }
    if (n >= 12) { const save = world; world = w; fireTorpedo(m); world = save; }
  }
  // 2. bonus à 4 cases ou moins
  if (!goal) {
    let best = null;
    for (const bo of w.bonuses) {
      if (!bo.active) continue;
      const d = b.dist[bo.y][bo.x];
      if (d > 0 && d <= 4 && (!best || d < best[0])) best = [d, bo.x, bo.y];
    }
    if (best) goal = [best[1], best[2]];
  }
  // 3. case sale la plus proche (BFS), à distance égale : nids puis cases de l'adversaire
  if (!goal && canWash(m)) {
    let bestD = Infinity, cands = [];
    const otherOwner = m.owner === PLAYER ? LAYA : PLAYER;
    for (const [x, y] of b.order) {
      const d = b.dist[y][x];
      if (d === 0 || d > bestD) continue;
      const s = w.st[y][x];
      let pr = 0;
      if (s === NEST || s === WET) pr = 3; else if (s === otherOwner) pr = 2; else if (s === DIRTY) pr = 1;
      if (!pr) continue;
      if (d < bestD) { bestD = d; cands = []; }
      cands.push([pr, x, y]);
    }
    if (cands.length) {
      const top = Math.max(...cands.map((c) => c[0]));
      const c = pick(cands.filter((cc) => cc[0] === top));
      goal = [c[1], c[2]];
    }
  }
  if (!goal && !canWash(m)) goal = m.water <= 0 ? R : V;
  let d = null;
  if (goal && b.dist[goal[1]][goal[0]] > 0) d = firstStep(b, goal[0], goal[1]);
  if (!d) { // rien d'atteignable : petit pas au hasard
    const opts = ['N', 'E', 'S', 'W'].filter((dd) => passable(m.x + DV[dd][0], m.y + DV[dd][1]));
    if (opts.length) d = pick(opts);
  }
  if (d) startMove(w, m, d);
  m.think = rnd(0, 0.15); // délai de « réflexion »
}

// =====================================================================================================
// RENDU — sol, décor, acteurs (tri par rangée)
// =====================================================================================================
const floorCanvas = document.createElement('canvas'); floorCanvas.width = COLS * CELL; floorCanvas.height = ROWS * CELL;
const fctx = floorCanvas.getContext('2d'); fctx.imageSmoothingEnabled = false;
const shadowCanvas = document.createElement('canvas'); shadowCanvas.width = COLS * CELL; shadowCanvas.height = ROWS * CELL;

function drawEl(g, name, cx, cy, frame = 0, src = null) {
  // règle d'ancrage Q : (case_x × 32 − ancre.x , (case_y + cases_h) × 32 − ancre.y)
  const e = EL[name];
  const [sx, sy, sw, sh] = e.fr ? e.fr[frame % e.fr.length] : [e.x, e.y, e.w, e.h];
  g.drawImage(src || IMG.decor, sx, sy, sw, sh, cx * CELL - e.ax, (cy + e.ch) * CELL - e.ay, sw, sh);
}
function buildShadows() {
  const g = shadowCanvas.getContext('2d');
  g.clearRect(0, 0, shadowCanvas.width, shadowCanvas.height);
  for (const p of MAP.props) drawEl(g, 'ombre_' + p.el, p.x, p.y, 0, decorNavy);
  for (const k of ['R', 'V']) { const [x, y] = MAP.stations[k]; drawEl(g, 'ombre_colonne_station', x, y, 0, decorNavy); }
  g.fillStyle = COL.nuit;
  g.fillRect(CELL, CELL, (COLS - 2) * CELL, 4);         // sous le mur nord
  g.fillRect(CELL, CELL, 4, (ROWS - 2) * CELL);         // le long du mur ouest
}
const SOL_VAR = (x, y) => { const h = (x * 7 + y * 13 + x * y) % 9; return h === 0 ? 'sol_creme_b' : h === 4 ? 'sol_creme_c' : 'sol_creme_a'; };
function redrawFloor(w) {
  const g = fctx;
  g.clearRect(0, 0, floorCanvas.width, floorCanvas.height);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (MAP.tile[y][x] === '#') continue;
    drawEl(g, SOL_VAR(x, y), x, y);
    if (MAP.tile[y][x] !== '.') continue;
    const { R, V } = MAP.stations;
    if (x === R[0] && y === R[1]) { drawEl(g, 'station_recharge_dalle', x, y); continue; }
    if (x === V[0] && y === V[1]) { drawEl(g, 'station_vidange_dalle', x, y); continue; }
    const s = w.st[y][x];
    if (s === DIRTY) drawEl(g, 'etat_sale', x, y);
    else if (s === NEST) drawEl(g, 'etat_nid', x, y);
    else if (s === WET) drawEl(g, 'etat_humide', x, y);
    else if (s === PLAYER) drawEl(g, 'etat_lave_joueur', x, y);
    else if (s === LAYA) drawEl(g, 'etat_lave_laya', x, y);
  }
  g.globalAlpha = 0.35; g.drawImage(shadowCanvas, 0, 0); g.globalAlpha = 1;
  w.floorDirty = false;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function entPos(e) { return [lerp(e.fx, e.x, e.t), lerp(e.fy, e.y, e.t)]; }
function drawRowOf(e) { return e.moving ? Math.max(e.fy, e.y) : e.y; }

function drawMachine(w, m) {
  const [ex, ey] = entPos(m);
  const meta = META[m.sheet];
  let dir = m.face;
  if (m.moving && m.turnDiag && m.t < 0.4) dir = m.turnDiag;
  const row = DIRS8.indexOf(dir);
  const piv = meta.pivot[dir];
  let bx = GX + ex * CELL + CELL / 2, by = GY + ey * CELL + CELL / 2;
  if (m.bump > 0) { const [dx, dy] = DV[m.dir]; bx += dx * 2 * Math.sin(m.bump * 40); by += dy * 2 * Math.sin(m.bump * 40); }
  // repère au sol (bleu = toi, vert = Laya)
  const col = m.owner === PLAYER ? COL.bleu : COL.vert;
  ctx.fillStyle = col;
  ringAt(Math.round(GX + ex * CELL + CELL / 2), Math.round(GY + ey * CELL + CELL / 2) + 6, col);
  let fr = 0;
  if (meta.frames === 8 && meta.fh === 72) fr = Math.floor(m.dist * 4) % 8; // l'image avance avec la distance (4 images par case)
  const bob = meta.fh === 56 ? (Math.floor(m.dist * 4) % 2) : 0;
  if (meta.fh === 72) ctx.drawImage(IMG[m.sheet], fr * meta.fw, row * meta.fh, meta.fw, meta.fh, Math.round(bx - piv[0]), Math.round(by - piv[1]), meta.fw, meta.fh);
  else ctx.drawImage(IMG[m.sheet], row * meta.fw, 0, meta.fw, meta.fh, Math.round(bx - piv[0]), Math.round(by - piv[1]) - bob, meta.fw, meta.fh);
  if (m.soap > 0 && Math.floor(w.elapsed * 10) % 2 === 0) { ctx.fillStyle = COL.blanc; ctx.fillRect(Math.round(bx) - 14 + rndi(28), Math.round(by) + 4 + rndi(6), 2, 2); }
  if (m.rocket > 0) { ctx.fillStyle = Math.floor(w.elapsed * 16) % 2 ? COL.orange : COL.jaune; const [dx, dy] = DV[m.dir]; ctx.fillRect(Math.round(bx - dx * 18) - 2, Math.round(by - dy * 14) - 2, 4, 4); }
  // étiquette au-dessus
  const ly = Math.round(by - piv[1]) - 2 + (meta.fh === 72 ? 8 : 0);
  if (m.kind === 'laya' || (w.demo && m.kind === 'player')) text(m.kind === 'laya' ? 'LAYA' : 'BOT', Math.round(bx), ly - 6, m.kind === 'laya' ? COL.vertC : COL.bleuC, 1, 'center', COL.nuit);
  if (m.slow > 0) text('…', Math.round(bx), ly - 14, COL.rouge, 1, 'center', COL.nuit);
}
function ringAt(cx, cy, col) {
  ctx.fillStyle = col;
  ctx.fillRect(cx - 9, cy - 3, 18, 1); ctx.fillRect(cx - 9, cy + 3, 18, 1);
  ctx.fillRect(cx - 12, cy - 2, 3, 5); ctx.fillRect(cx + 9, cy - 2, 3, 5);
}

function drawPolluter(w, p) {
  const [ex, ey] = entPos(p);
  const fx = Math.round(GX + ex * CELL + CELL / 2), fy = Math.round(GY + ey * CELL + CELL / 2 + 6);
  if (p.kind === 'client') {
    const meta = META[p.skin];
    let f = 0, flip = false;
    if (p.moving) {
      if (p.dir === 'N') f = 3;
      else if (p.dir === 'E' || p.dir === 'W') { f = Math.floor(p.dist * 2) % 2 ? 2 : 1; flip = p.dir === 'W'; }
    }
    const bob = p.moving && (p.dir === 'N' || p.dir === 'S') ? (Math.floor(p.dist * 4) % 2) : 0;
    drawSprite(IMG[p.skin], f * meta.fw, 0, meta.fw, meta.fh, fx - meta.fw / 2, fy - meta.sol - bob, flip);
    if (p.state === 'act') text('!', fx + 8, fy - 52, COL.jaune, 1, 'left', COL.nuit);
    return;
  }
  if (p.kind === 'pigeon') {
    const meta = META.pnj_pigeon;
    const h = Math.round(p.h);
    if (h > 2) { ctx.globalAlpha = 0.35; ctx.fillStyle = COL.nuit; ctx.fillRect(fx - 8, fy - 2, 16, 3); ctx.globalAlpha = 1; }
    const f = p.state === 'fly' ? Math.floor(p.dist) % 3 : (Math.floor(w.elapsed * 3) % 2 ? 0 : 2);

  '....obbo.bbo....',

const GRANNY_ROWS2 = GRANNY_ROWS.slice(0, 19).concat(['....osso..sso...', '...obbo...bbo...']);

function drawGranny(w) {

function renderArena(w) {

    text('INSERT COIN', W / 2, 220, COL.rose, 2, 'center', COL.prune);
    panel(W / 2 - 120, 250, 240, 60, COL.marine, COL.lilas);
    text('HIGH SCORE · SALLE 1', W / 2, 260, COL.perle, 1, 'center');
    text(String(app.record).padStart(3, '0') + ' CASES', W / 2, 278, COL.jaune, 2, 'center');
    panel(W / 2 - 140, 320, 280, 34, COL.marine, COL.lilas);
    text(IS_TOUCH ? 'COMMENT JOUER : TOUCHE A' : 'H : COMMENT JOUER', W / 2, 327, COL.lilasC, 1, 'center', COL.nuit);
    text('DÉMO : DEUX ROBOTS S\'AFFRONTENT', W / 2, 342, COL.ardoC, 1, 'center', COL.nuit);
  }
}

function card(x, y, w, h, sel) {
  const blink = sel && Math.floor(app.time * 4) % 2;
  ctx.fillStyle = sel ? (blink ? COL.jaune : COL.orange) : COL.lilasF; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = sel ? COL.prune : COL.nuit; ctx.fillRect(x + 3, y + 3, w - 6, h - 6);
}
function segGauge(x, y, label, v, max, col) {
  text(label, x, y, COL.perle);
  const n = 10, filled = Math.round(n * v / max);
  for (let i = 0; i < n; i++) { ctx.fillStyle = i < filled ? col : COL.ardo; ctx.fillRect(x + i * 12, y + 10, 10, 6); }
  text(String(v), x + n * 12 + 2, y + 10, COL.blanc);
}
function renderCharPick() {
  ctx.fillStyle = COL.nuit; ctx.fillRect(0, 0, W, H);
  stripes(0, 8);
  text('CHOISIS TON PERSONNAGE', W / 2, 20, COL.jaune, 2, 'center', COL.prune);
  const cw = 300, ch = 360, gap = 24, x0 = W / 2 - cw - gap / 2;
  CHARS.forEach((c, i) => {
    const x = x0 + i * (cw + gap), y = 46, sel = i === app.charIdx;
    card(x, y, cw, ch, sel);
    // portrait animé : marche de face puis de profil (pleine résolution)

    const im = IMG[(phase ? 'big_walkE_' : 'big_walk_') + c.id];

    wrap(c.desc, 28).forEach((l, k) => text(l, x + 116, y + 86 + k * 11, COL.perle));

    pl.forEach((l, k) => text(l, x + 16, y + 178 + k * 18, COL.vertC, 2));
    wrap(c.composite ? '4 MACHINES AVEC SPRITES DE POUSSÉE / CONDUITE' : 'MACHINES SEULES (PAS DE SPRITE AUX COMMANDES)', 44)
      .forEach((l, k) => text(l, x + 16, y + 186 + pl.length * 18 + k * 11, COL.ardoC));

  });
  text(IS_TOUCH ? '◄ ► : CHOISIR   B : VALIDER' : '← → : CHOISIR   ENTRÉE : VALIDER   ÉCHAP : RETOUR', W / 2, H - 18, COL.lilasC, 1, 'center');
}
function renderVehPick() {

  stripes(0, 8);
  const c = CHARS[app.charIdx];
  text('CHOISIS TA MACHINE', W / 2, 20, COL.jaune, 2, 'center', COL.prune);
  text(c.name + ' · ' + c.perk, W / 2, 40, COL.bleuC, 1, 'center');

}
function renderCountdown() {
  renderArena(world); renderHUD(world);
  const n = Math.ceil(app.countdown / 0.8) - 1;
  const str = n >= 1 ? String(n) : 'GO !';
  const cx = GX + COLS * CELL / 2;
  panel(cx - 150, 150, 300, 120, COL.prune, COL.jaune);
  text('SALLE 1 · ' + LEVEL.name, cx, 162, COL.blanc, 1, 'center');
  text('★ ' + LEVEL.diff + ' · 2 CLIENTS + 2 CHIENS', cx, 176, COL.lilasC, 1, 'center');
  text(str, cx, 196, n >= 1 ? COL.jaune : COL.vertC, 8, 'center', COL.nuit);
}
function renderPause() {
  renderArena(world); renderHUD(world);
  const cx = GX + COLS * CELL / 2;
  panel(cx - 120, 180, 240, 70, COL.prune, COL.lilas);
  text('PAUSE', cx, 194, COL.jaune, 3, 'center');
  text(IS_TOUCH ? 'B : REPRENDRE' : 'P / ÉCHAP / ENTRÉE : REPRENDRE', cx, 228, COL.blanc, 1, 'center');
}
function renderResults() {
  const r = app.results;
  renderArena(world);
  dim(0.85);
  const cx = W / 2;
  text('FIN DE MANCHE', cx, 24, COL.jaune, 3, 'center', COL.prune);
  const k = Math.min(1, r.t / 1.5);
  const pv = Math.round(r.player * k), lv = Math.round(r.laya * k);
  panel(cx - 230, 62, 220, 110, COL.marine, COL.bleu);
  panel(cx + 10, 62, 220, 110, COL.marine, COL.vert);
  text('TOI', cx - 120, 74, COL.bleuC, 2, 'center'); text(String(pv), cx - 120, 98, COL.bleu, 5, 'center', COL.nuit);
  text('BONUS ' + r.pBonus, cx - 120, 148, COL.perle, 1, 'center');
  text('LAYA', cx + 120, 74, COL.vertC, 2, 'center'); text(String(lv), cx + 120, 98, COL.vert, 5, 'center', COL.nuit);
  text('BONUS ' + r.lBonus, cx + 120, 148, COL.perle, 1, 'center');
  if (r.t > 1.5) {
    const col = r.winner === 'player' ? COL.bleu : r.winner === 'laya' ? COL.vert : COL.jaune;
    const str = r.winner === 'player' ? 'TU GAGNES !' : r.winner === 'laya' ? 'LAYA GAGNE !' : 'ÉGALITÉ PARFAITE';
    text(str, cx, 188, col, 4, 'center', COL.nuit);
    if (r.tieBreak) text('DÉPARTAGÉS PAR LES POINTS BONUS', cx, 222, COL.perle, 1, 'center');
  }
  text('CASES RESALIES PAR LES POLLUEURS : ' + r.resoiled, cx, 240, COL.saleC, 1, 'center');
  text('PROPRETÉ FINALE : ' + r.clean + ' %', cx, 254, COL.perle, 1, 'center');
  text('MEILLEUR SCORE DE LA SALLE : ' + r.record, cx, 272, COL.jaune, 1, 'center');
  if (r.newRecord && Math.floor(app.time * 3) % 2) text('NOUVEAU RECORD !', cx, 288, COL.rose, 2, 'center', COL.nuit);
  const labels = ['REJOUER', 'MENU'];
  labels.forEach((l, i) => {
    const bx = cx - 150 + i * 160, by = 330, sel = i === app.resSel;
    card(bx, by, 140, 40, sel);
    text(l, bx + 70, by + 13, sel ? COL.jaune : COL.blanc, 2, 'center');
  });
  text(IS_TOUCH ? '◄ ► : CHOISIR   B : VALIDER' : '← → : CHOISIR   ENTRÉE : VALIDER', cx, 392, COL.lilasC, 1, 'center');
  text(CHARS[world.cfg.charIdx].name + ' · ' + MACHINES[world.cfg.machIdx].name, cx, 410, COL.ardoC, 1, 'center');
}

// ---------- transitions
function startDemo() {
  app.demo = createWorld({ charIdx: 0, machIdx: 3, demo: true });
  app.demo.player.ai = true;
  world = app.demo;
}
function startRound() {
  world = createWorld({ charIdx: app.charIdx, machIdx: app.machIdx, demo: false });
  app.mode = 'countdown'; app.countdown = 3.2; app.results = null; app.resSel = 0;
  sfx('count');
}
function endRound() {
  const w = world, sc = scores(w);
  let winner = sc.player > sc.laya ? 'player' : sc.laya > sc.player ? 'laya' : null, tieBreak = false;
  if (!winner) {
    tieBreak = true;
    winner = w.player.bonusPts > w.laya.bonusPts ? 'player' : w.laya.bonusPts > w.player.bonusPts ? 'laya' : 'tie';
  }
  const newRecord = sc.player > app.record;
  if (newRecord) { app.record = sc.player; localStorage.setItem(STORE_KEY, String(sc.player)); }
  app.results = { t: 0, player: sc.player, laya: sc.laya, pBonus: w.player.bonusPts, lBonus: w.laya.bonusPts, winner, tieBreak,
    resoiled: w.dirtyByPolluters, clean: sc.clean, record: app.record, newRecord };
  app.mode = 'results'; app.resSel = 0;
  sfx(winner === 'player' ? 'win' : 'end');
}

// =====================================================================================================
// AUDIO — Web Audio, sons 8-bit synthétisés (touche M)
// =====================================================================================================
let AC = null, master = null;
function audioUnlock() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return;
  AC = new C(); master = AC.createGain(); master.connect(AC.destination); applyMute();
}
function applyMute() { if (master) master.gain.value = app.muted ? 0 : 0.18; }
function tone(freq, dur, type = 'square', vol = 1, slide = 0, delay = 0) {
  if (!AC || app.muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol = 0.6, delay = 0) {
  if (!AC || app.muted) return;
  const t0 = AC.currentTime + delay;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (((i * 1103515245 + 12345) >>> 16) & 1 ? 1 : -1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(master); s.start(t0);
}
function sfx(name) {
  switch (name) {
    case 'blip': tone(660, 0.05, 'square', 0.5); break;
    case 'ok': tone(523, 0.06); tone(784, 0.08, 'square', 1, 0, 0.06); break;
    case 'back': tone(392, 0.06); tone(262, 0.08, 'square', 1, 0, 0.06); break;
    case 'step': tone(180, 0.03, 'triangle', 0.5); break;
    case 'wash': tone(880, 0.05, 'square', 0.35, 300); noise(0.05, 0.15); break;
    case 'scrub': noise(0.08, 0.3); tone(220, 0.06, 'square', 0.3); break;
    case 'pickup': tone(988, 0.05); tone(1319, 0.09, 'square', 1, 0, 0.05); break;
    case 'coin': tone(1319, 0.05, 'square', 0.4); tone(1760, 0.08, 'square', 0.4, 0, 0.05); break;
    case 'refill': for (let i = 0; i < 5; i++) tone(400 + i * 120, 0.05, 'triangle', 0.7, 0, i * 0.04); break;
    case 'drain': for (let i = 0; i < 5; i++) tone(900 - i * 120, 0.05, 'square', 0.4, 0, i * 0.04); break;
    case 'alarm': tone(880, 0.12, 'square', 0.6); tone(660, 0.12, 'square', 0.6, 0, 0.14); break;
    case 'bump': tone(110, 0.08, 'square', 0.5, -40); break;
    case 'angry': tone(200, 0.1, 'sawtooth', 0.6); tone(150, 0.15, 'sawtooth', 0.6, 0, 0.1); break;
    case 'soil': noise(0.06, 0.2); tone(150, 0.06, 'triangle', 0.3, -60); break;
    case 'yap': tone(700, 0.04, 'square', 0.4, 200); tone(700, 0.04, 'square', 0.4, 200, 0.08); break;
    case 'torpedo': noise(0.4, 0.8); tone(120, 0.4, 'sawtooth', 0.7, -80); break;
    case 'count': tone(440, 0.12, 'square', 0.6); break;
    case 'go': tone(880, 0.25, 'square', 0.7); break;
    case 'end': [523, 392, 330, 262].forEach((f, i) => tone(f, 0.16, 'square', 0.6, 0, i * 0.16)); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.6, 0, i * 0.12)); break;
    default: break;
  }
}

// =====================================================================================================
// BOUCLE PRINCIPALE + MISE À L'ÉCHELLE ENTIÈRE
// =====================================================================================================
const IS_TOUCH = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window) || QS.get('touch') === '1';
function layout() {
  document.body.classList.toggle('touch', IS_TOUCH);
  const land = innerWidth >= innerHeight;
  document.body.classList.toggle('portrait', IS_TOUCH && !land);
  const dpr = window.devicePixelRatio || 1;
  let aw = innerWidth, ah = innerHeight;
  if (IS_TOUCH) { if (land) aw -= 2 * 188; else ah -= 230; }
  aw = Math.max(aw, 100); ah = Math.max(ah, 100);
  // échelle entière en pixels physiques ; si même ×1 ne tient pas, on réduit (cas des très petits écrans)
  const k = Math.floor(Math.min(aw * dpr / W, ah * dpr / H));
  const css = k >= 1 ? k / dpr : Math.min(aw / W, ah / H);
  canvas.style.width = (W * css) + 'px';
  canvas.style.height = (H * css) + 'px';
  app.scale = k >= 1 ? k : +(css * dpr).toFixed(3);
}
let last = 0;
function frame(ts) {
  const now = ts / 1000;
  let dt = last ? now - last : 1 / 60;
  last = now;
  if (dt > 0) { app.fpsAcc += dt; app.fpsN++; if (app.fpsAcc >= 0.5) { app.fps = Math.round(app.fpsN / app.fpsAcc); app.fpsAcc = 0; app.fpsN = 0; } }
  dt = Math.min(dt, 0.05) * app.timeScale;
  app.time += dt;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
function update(dt) {
  switch (app.mode) {
    case 'title': case 'charPick': case 'vehPick':
      if (app.demo) { world = app.demo; updateWorld(app.demo, dt); app.demo.timeLeft -= dt; if (app.demo.timeLeft <= 0) startDemo(); }
      break;
    case 'countdown': {
      const before = Math.ceil(app.countdown / 0.8);
      app.countdown -= dt;
      const after = Math.ceil(app.countdown / 0.8);
      if (after !== before && after >= 2) sfx('count');
      if (after === 1 && before !== 1) sfx('go');
      if (app.countdown <= 0) app.mode = 'play';
      break;
    }
    case 'play':
      updateWorld(world, dt);
      world.timeLeft -= dt;
      if (world.timeLeft <= 0) { world.timeLeft = 0; endRound(); }
      break;
    case 'results':
      if (app.results) app.results.t += dt;
      updateWorld(world, 0);
      break;
    default: break;
  }
}
function render() {
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = COL.nuit; ctx.fillRect(0, 0, W, H);
  switch (app.mode) {
    case 'boot': text('CHARGEMENT…', W / 2, H / 2, COL.blanc, 2, 'center'); break;
    case 'title': renderTitle(); break;
    case 'charPick': renderCharPick(); break;
    case 'vehPick': renderVehPick(); break;
    case 'countdown': renderCountdown(); break;
    case 'play': renderArena(world); renderHUD(world); break;
    case 'pause': renderPause(); break;
    case 'results': renderResults(); break;
    default: break;
  }
}

// =====================================================================================================
// OUTILS DE TEST — window.__state(), window.__dbg, window.__test
// =====================================================================================================
function stateSnapshot() {
  const w = world && !world.demo ? world : null;
  const sc = w ? scores(w) : null;
  return {
    mode: app.mode, seed: SEED, scale: app.scale, fps: app.fps, touch: IS_TOUCH, muted: app.muted,
    timeLeft: w ? +w.timeLeft.toFixed(2) : null, time: w ? +w.elapsed.toFixed(2) : null,
    level: LEVEL.num,
    playerCells: w ? countCells(w, PLAYER) : 0, layaCells: w ? countCells(w, LAYA) : 0,
    playerScore: sc ? sc.player : 0, layaScore: sc ? sc.laya : 0, dirtyCells: sc ? sc.dirty : 0, clean: sc ? sc.clean : 0,
    dirtyByPolluters: w ? w.dirtyByPolluters : 0,
    water: w ? +w.player.water.toFixed(1) : null, grime: w ? +w.player.grime.toFixed(1) : null,
    layaWater: w ? +w.laya.water.toFixed(1) : null, layaGrime: w ? +w.laya.grime.toFixed(1) : null,
    player: w ? { x: w.player.x, y: w.player.y, moving: w.player.moving, soap: +w.player.soap.toFixed(2), rocket: +w.player.rocket.toFixed(2), torpLeft: w.player.torpLeft, bonus: w.player.bonusPts } : null,
    laya: w ? { x: w.laya.x, y: w.laya.y, torpLeft: w.laya.torpLeft, bonus: w.laya.bonusPts } : null,
    granny: w ? { x: w.granny.x, y: w.granny.y, angry: w.granny.angry > 0 } : null,
    polluters: w ? w.polluters.map((p) => ({ kind: p.kind, x: p.x, y: p.y, state: p.state })) : [],
    loadout: w ? w.loadout : { personnage: CHARS[app.charIdx].name, machine: MACHINES[app.machIdx].name },
    results: app.results ? { player: app.results.player, laya: app.results.laya, winner: app.results.winner, record: app.results.record } : null,
  };
}
window.__state = stateSnapshot;
Object.defineProperty(window, '__dbg', { get: stateSnapshot });
window.__test = {
  setTimeLeft(s) { if (world && !world.demo) world.timeLeft = s; },
  setTimeScale(k) { app.timeScale = k; },
  setWater(v) { if (world && !world.demo) world.player.water = v; },
  setGrime(v) { if (world && !world.demo) world.player.grime = v; },
  cell(x, y) { return world ? world.st[y][x] : null; },
  soilCell: (x, y, k) => soilCell(x, y, k),
  bfsPath(tx, ty) { // chemin de cases (directions) du joueur vers une case, pour les scripts de test
    const w = world; const b = bfs(w, w.player.x, w.player.y, (x, y) => !blockedForMachine(w, w.player, x, y));
    return b.dist[ty][tx] >= 0 ? pathTo(b, tx, ty) : null;
  },
};

// =====================================================================================================
// DÉMARRAGE
// =====================================================================================================
buildFont(); // la police doit exister avant le premier rendu (écran de chargement)
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
layout();
bindTouchButtons();
requestAnimationFrame(frame);
loadImages().then(() => {
  buildNavy(); buildShadows(); buildGranny();
  startDemo();
  app.mode = 'title';
}).catch((e) => { app.mode = 'boot'; app.bootError = String(e); });
</script>
