<script>
"use strict";
/* ================================================================
   MOB RACER — PHASE 1 : proto jouable · v0.3 (2 modes · juice & Nilfisk)
   1 machine humaine + 1 IA simple + 2 loutres câlines.
   Boucle requestAnimationFrame, logique à pas fixe (60 Hz).
   ================================================================ */

/* ---------------------- 1. CONSTANTES ---------------------- */
const COLONNES = 15, LIGNES = 13;      // grille Bomberman 15×13
const TUILE = 44;                      // taille pixel d'une tuile
const MARGE_X = (720 - COLONNES*TUILE)/2;   // centrage horizontal
const MARGE_Y = 26;                          // espace HUD en haut

const CHRONO_MANCHE = 75;              // chrono 75 secondes
const RECHARGE_FONTAINE = 3.0;         // recharge : 3 s sur la borne
const DUREE_CALIN = 2.0;               // câlin de loutre : 2 s
const COEURS_MAX = 3;                  // Cœur de Loutre cumulable ×3
const COUT_EAU = 0.07;                 // perte d'eau par case nettoyée
const RESERVOIR_MAX = 1.0;
const VITESSE_JOUEUR = 110;            // px/s
const VITESSE_IA = 84;                 // px/s
const VITESSE_LOUTRE = 26;             // les loutres flânent
const CADRE = 1/60;
const ACCEL_AUTO = 80/1000;            // v0.2 : inertie auto-tracée ~80 ms pour atteindre la pleine vitesse
const TRACE_PUSHED = 3;                // v0.2 : trace 3 cases de large (mode poussé)
const TRACE_AUTO = 1;                  // v0.2 : trace fine (auto-tracée)
const PIVOT_COULOIR = 0.35;            // v0.2 : demi-tour en couloir étroit ≈ le temps de
                                       // franchir 1 case — l'inertie auto-tracée tourne mal

/* tuiles */
const T_SOL = 0, T_FONTAINE = 1, T_MUR = 2;
/* sols */
const SOL_LINO = 0, SOL_CARRELAGE = 1;

/* v0.2 — les 2 familles de machines (décisions José 17/10) */
const MODE_PUSHED = "pushed", MODE_AUTO = "autotracked";
const MODES = [
  {
    id: MODE_PUSHED, nom: "POUSSÉE", desc: "Lente mais large — 3 cases au passage",
    vitesseMul: 0.7, hud: "MODE POUSSÉE — trace large",
  },
  {
    id: MODE_AUTO, nom: "AUTO-TRACÉE", desc: "Rapide et précise — 1 case, drift",
    vitesseMul: 1.3, hud: "MODE AUTO-TRACÉE — vitesse",
  },
];
const DEFAUT_MODE = MODE_AUTO;    // v0.1 ≈ auto-tracée : choix par défaut

/* ================================================================
   v0.3-§1 · PIXEL FONT 5×5 (HUD + titres, dessinée par code)
   Chaque glyphe = 5 mots de 5 bits (bit 4 = colonne gauche).
   Les accents français sont rendus sans accent volontairement.
   ================================================================ */
const PF = {
  A:[14,17,31,17,17], B:[30,17,30,17,30], C:[31,1,1,1,31],
  D:[30,17,17,17,30], E:[31,1,30,1,31], F:[31,1,30,1,1],
  G:[31,1,13,17,31], H:[17,17,31,17,17], I:[31,4,4,4,31],
  J:[15,2,2,2,30], K:[17,18,28,18,17], L:[17,17,17,17,31],
  M:[17,27,21,17,17], N:[17,25,21,19,17], O:[14,17,17,17,14],
  P:[30,17,30,1,1], Q:[14,17,21,18,13], R:[30,17,30,18,17],
  S:[29,1,14,16,29], T:[31,4,4,4,4], U:[17,17,17,17,14],
  V:[17,17,17,10,4], W:[17,17,21,27,17], X:[17,10,4,10,17],
  Y:[17,10,4,4,4], Z:[31,2,4,8,31],
  "0":[14,17,21,19,14], "1":[4,12,4,4,14], "2":[30,1,14,16,31],
  "3":[30,1,14,1,30], "4":[17,17,31,1,1], "5":[31,16,30,1,30],
  "6":[14,16,30,17,14], "7":[31,2,4,8,8], "8":[14,17,14,17,14],
  "9":[14,17,15,1,14],
  "?":[14,17,2,0,4], "!":[4,4,4,0,4], ".":[0,0,0,0,4],
  ",":[0,0,0,4,8], ":":[0,4,0,4,0], "-":[0,0,31,0,0],
  "%":[19,9,6,25,19], "/":[1,2,4,8,16], "·":[0,0,4,0,0],
  /* % lisible : rond O-O diagonale */
  "★":[4,31,27,27,10], "©":[14,17,23,21,14],
  "È":[14,17,31,1,30], "É":[2,4,30,1,31], "Ê":[4,10,31,1,30],
  "À":[2,4,0,31,17], "Ç":[16,8,31,1,31], "Ô":[4,10,14,17,14],
  "Û":[4,10,17,17,14], "Î":[31,4,4,4,4], "ÔÙ":[0,0,0,0,0],
  "Ù":[4,10,17,17,14], "Œ":[14,21,21,21,14], "'":[4,4,0,0,0],
  "(":[2,4,4,4,2], ")":[8,4,4,4,8], "+":[0,4,14,4,0],
};
const PF_W = 5, PF_H = 5, PF_SP = 1;
/* normalise : accentué → lettre de base (les digrammes type OE restent) */
function pfNorm(ch){
  if (PF[ch]) return ch;
  const base = ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
  return PF[base] ? base : null;
}
/* largeur/hauteur en UNITÉS (1 unité = 1 px à k=1) d'un texte */
function pfSize(s, k){
  k = k || 2;
  let maxCols = 0, nLines = 1, cur = 0;
  for (const ch of String(s)){
    if (ch === "\n"){ maxCols = Math.max(maxCols, cur); cur = 0; nLines++; }
    else if (ch === " ") cur += 3;          /* espace = largeur 3 unités */
    else cur += PF_W + PF_SP;               /* glyphe + interlettre : 6 unités */
  }
  maxCols = Math.max(maxCols, cur);
  return { w: Math.max(0, maxCols - PF_SP), h: nLines*(PF_H+PF_SP) - PF_SP, k };
}
/* dessine le texte pixel ; anchor : 0 = centré, 1 = aligné gauche ;
   outline : contour noir dessiné derrière (offsets 8 directions) ;
   alpha optionnel. Retourne {w,h} en pixels. */
function pfDraw(x, y, s, coul, k, anchor, outline, alpha){
  k = k || 2;
  const dim = pfSize(s, k);
  /* ancre : 1 = aligné gauche (x = début), 0 = centré, 2 = aligné droite (x = fin) */
  let sx = anchor === 0 ? x - dim.w*k/2 : anchor === 2 ? x - dim.w*k : x;
  sx = Math.round(sx);
  const sy = Math.round(y - dim.h*k/2);
  const oldA = ctx.globalAlpha;
  if (alpha !== undefined) ctx.globalAlpha = oldA * alpha;
  const lignes = String(s).split("\n");
  const pass = outline ? ["#000", coul] : [coul];
  for (let pi=0; pi<pass.length; pi++){
    ctx.fillStyle = pass[pi];
    const offs = outline && pi === 0
      ? [[-k,0],[k,0],[0,-k],[0,k],[-k,-k],[k,k],[-k,k],[k,-k]] : [[0,0]];
    for (const off of offs){
      let li = 0;
      for (const ln of lignes){
        let col = 0;
        for (const ch of ln){
          if (ch === " "){ col += 3; continue; }
          const g = PF[pfNorm(ch)];   // caractère inconnu → espace de la largeur glyphe
          if (g){
            for (let r=0; r<5; r++) for (let b=0; b<5; b++)
              if (g[r] & (1<<(4-b)))
                ctx.fillRect(sx + off[0] + (col+b)*k, sy + off[1] + (li*(PF_H+PF_SP)+r)*k, k, k);
          }
          col += PF_W + PF_SP;
        }
        li++;
      }
    }
  }
  ctx.globalAlpha = oldA;
  return { w: dim.w*k, h: dim.h*k };
}

/* ---------------------- 2. CANVAS + AUDIO ---------------------- */
const cv = document.getElementById("jeu");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* Web Audio : créé au premier geste utilisateur (autoplay policy) */
let AC = null, sonActif = true;
function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch(e) { AC = null; }
}
document.addEventListener("keydown", initAudio, { once:true });
document.addEventListener("mousedown", initAudio, { once:true });

/* bleep 8-bit générique : waveform, glissando f0→f1, durée, volume */
function bip(type, f0, f1, dur, vol){
  if (!AC || !sonActif) return;
  const t0 = AC.currentTime;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(g); g.connect(AC.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sonTick(){ bip("square", 200, 170, 0.04, 0.03); }        // déplacement
function sonPlop(){ bip("sine", 300, 640, 0.1, 0.15);             // case nettoyée
                    bip("square", 180, 110, 0.07, 0.05); }
let dernierGlou = 0;
function sonGlou(){                                               // recharge glouglou
  const t = performance.now();
  if (t - dernierGlou < 200) return;
  dernierGlou = t;
  bip("sine", 150, 520, 0.12, 0.09);
}
function sonCalin(){                                              // jingle câlin loutre
  if (!AC || !sonActif) return;
  [523, 659, 784, 1046].forEach((f,i)=> setTimeout(()=>bip("triangle", f, f*1.01, 0.15, 0.12), i*100));
}
function sonBuzzer(){                                             // buzzer fin de manche
  if (!AC || !sonActif) return;
  for (let i=0;i<3;i++) setTimeout(()=>bip("sawtooth", 150, 110, 0.3, 0.15), i*220);
}
function sonKlaxon(){ bip("square", 440, 660, 0.18, 0.13); }      // compte à rebours

/* v0.3 : jingle "case nettoyée" (distinct du jingle loutre) */
function sonJingleCase(){
  if (!AC || !sonActif) return;
  bip("square", 660, 880, 0.07, 0.08);
}
/* v0.3 : jingle écran de fin (4 notes descendantes) */
function sonJingleFin(){
  if (!AC || !sonActif) return;
  [784, 659, 523, 392].forEach((f, i) => setTimeout(() => bip("triangle", f, f*0.99, 0.22, 0.12), i*140));
}
/* v0.3 : bruit de dérapage (zone glissante) */
function sonDrift(){
  if (!AC || !sonActif) return;
  bip("sawtooth", 300, 120, 0.5, 0.10);
}

/* v0.2 : jingle différent à la sélection de chaque mode */
function sonJingleSelection(modeId){
  if (!AC || !sonActif) return;
  const notes = (modeId === MODE_PUSHED)
    ? [[262, 0.12], [196, 0.12], [165, 0.22], [262, 0.30]]        // grave, sérieux, "gros moteur"
    : [[392, 0.10], [523, 0.10], [659, 0.12], [880, 0.30]];       // aigu, vif, "autolaveuse"
  let t = 0;
  for (const [f, d] of notes){
    setTimeout(()=>bip("square", f, f*0.99, d, 0.12), t*1000);
    t += d*0.9;
  }
}

/* ---------------------- 3. ENTRÉES CLAVIER ---------------------- */
const touches = {};
/* v0.2 : machine à états d'entrée */
//  "titre"        : n'importe quelle touche → écran de choix de mode
//  "choixMode"    : flèches gauche/droite = sélection, Entrée = valider
//  "course"/"compte"/"fin" : touches de jeu (v0.1)
let etatEntrees = "titre";
let modeJoueur = DEFAUT_MODE;          // mode de la machine HUMAINE (choix à l'écran)
let selMode = 0;                       // 0 = POUSSÉE, 1 = AUTO-TRACÉE
window.addEventListener("keydown", e => {
  touches[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyM") sonActif = !sonActif;
  if (etatEntrees === "titre"){
    if (!e.repeat){ etatEntrees = "choixMode"; }
    return;
  }
  if (etatEntrees === "choixMode"){
    if (e.code === "ArrowLeft" && !e.repeat){
      selMode = (selMode + MODES.length - 1) % MODES.length;
      sonJingleSelection(MODES[selMode].id);
    } else if (e.code === "ArrowRight" && !e.repeat){
      selMode = (selMode + 1) % MODES.length;
      sonJingleSelection(MODES[selMode].id);
    } else if (e.code === "Enter" || e.code === "NumpadEnter"){
      modeJoueur = MODES[selMode].id;
      etatEntrees = "course";
      demarrerManche();
    }
    return;
  }
});
/* v0.2 : les 2 boutons de fin de manche —
   Entrée = rejouer le MÊME mode · R = retour à l'écran de choix de mode
   (l'écran de choix est réactivé : etatEntrees redevient « choixMode ») */
window.addEventListener("keydown", e => {
  if (etat === "fin" && !e.repeat){
    if (e.code === "KeyR"){
      const i = MODES.findIndex(m => m.id === modeJoueur);
      selMode = i >= 0 ? i : 0;               // carte du mode courant pré-sélectionnée
      etat = "choixMode";
      etatEntrees = "choixMode";
    }
    if (e.code === "Enter" || e.code === "NumpadEnter") demarrerManche();   // même mode
  }
});
window.addEventListener("keyup", e => { touches[e.code] = false; });

/* ================================================================
   v0.3-§6.5 · PARTICULES 8-BIT + SHAKE + juice
   ================================================================ */
const PARTS = [];        // particules actives
let shake = { t:0, mag:0, x:0, y:0 };        // screen shake global
let flashBlanc = 0;      // flash blanc plein écran (collision)
const gouttes = [];      // {x,y,vy,vie}   fontaine
const bulles = [];       // {x,y,vy,vie,t} bulles de savon
const etoiles = [];      // {x,y,vx,vy,vie} câlin loutre
const splashDrops = [];  // {x,y,vx,vy,vie} éclaboussures
const confetti = [];     // {x,y,vx,vy,coul,rot,vr,vie} écran de fin

function addShake(mag, dur){
  shake.t = Math.max(shake.t, dur || 0.14);
  shake.mag = Math.max(shake.mag, mag);
}
function upShake(dt){
  if (shake.t > 0){
    shake.t -= dt;
    const decay = Math.max(0, shake.t/0.14);
    shake.x = (Math.random()*2-1) * shake.mag * decay;
    shake.y = (Math.random()*2-1) * shake.mag * decay;
    if (shake.t <= 0){ shake.x = 0; shake.y = 0; shake.mag = 0; }
  } else { shake.x = 0; shake.y = 0; }
}
function ajouterParticule(x, y, vx, vy, vie, coul, taille){
  PARTS.push({x, y, vx, vy, vie, vie0: vie, coul, taille: taille||3});
}
/* éclat de savon : petites particules blanches/cyan */
function eclat(x, y, n, baseCoul){
  for (let i=0; i<n; i++){
    const a = Math.random()*Math.PI*2, sp = 30+Math.random()*70;
    ajouterParticule(x, y, Math.cos(a)*sp, Math.sin(a)*sp, 0.3+Math.random()*0.25,
      baseCoul || "#bfe9ff", 2+((Math.random()*2)|0)*2);
  }
}
function eclatCase(c, l, coul){
  eclat(MARGE_X + c*TUILE + TUILE/2, MARGE_Y + l*TUILE + TUILE/2, 5, coul);
}
function upParticules(dt){
  for (let i=PARTS.length-1; i>=0; i--){
    const p = PARTS[i];
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += 60*dt;
    p.vie -= dt;
    if (p.vie <= 0) PARTS.splice(i,1);
  }
  /* gouttes de fontaine : tombent puis disparaissent */
  for (let i=gouttes.length-1; i>=0; i--){
    const g = gouttes[i];
    g.y += g.vy*dt; g.vie -= dt;
    if (g.vie <= 0) gouttes.splice(i,1);
  }
  /* bulles de savon : montent doucement, clignotent avant de pop */
  for (let i=bulles.length-1; i>=0; i--){
    const b = bulles[i];
    b.x += Math.sin((b.t += dt)*3)*8*dt;
    b.y -= 10*dt;
    b.vie -= dt;
    if (b.vie <= 0) bulles.splice(i,1);
  }
  /* étoiles de câlin : s'éloignent du point d'origine */
  for (let i=etoiles.length-1; i>=0; i--){
    const e = etoiles[i];
    e.x += e.vx*dt; e.y += e.vy*dt;
    e.vie -= dt;
    if (e.vie <= 0) etoiles.splice(i,1);
  }
  for (let i=splashDrops.length-1; i>=0; i--){
    const d = splashDrops[i];
    d.x += d.vx*dt; d.y += d.vy*dt;
    d.vy += 180*dt;           // gravité forte : arc vite retombé
    d.vie -= dt;
    if (d.vie <= 0) splashDrops.splice(i,1);
  }
  if (flashBlanc > 0) flashBlanc = Math.max(0, flashBlanc - dt*8);
}
function drParticules(){
  for (const p of PARTS){
    const a = p.vie/p.vie0;
    ctx.globalAlpha = a < 0.3 ? 0.25 : 1;
    ctx.fillStyle = p.coul;
    ctx.fillRect(p.x|0, p.y|0, p.taille, p.taille);
  }
  ctx.globalAlpha = 1;
  for (const g of gouttes){
    ctx.globalAlpha = Math.max(0, Math.min(1, g.vie*4));
    ctx.fillStyle = "#9fd8ff";
    ctx.fillRect(g.x|0, g.y|0, 2, 4);
  }
  for (const b of bulles){
    const clignote = b.vie < 0.25 && ((b.vie*20)|0)%2 === 0;   // clignote avant disparaître
    if (clignote) continue;
    ctx.globalAlpha = Math.max(0.25, Math.min(1, b.vie*2));
    ctx.fillStyle = "#e8f7ff";
    ctx.fillRect(b.x|0, b.y|0, 3, 3);
    ctx.fillStyle = "#9fd8ff";
    ctx.fillRect((b.x+2)|0, b.y|0, 1, 1);
    ctx.fillRect(b.x|0, (b.y+2)|0, 1, 1);
  }
  ctx.globalAlpha = 1;
  for (const e of etoiles){
    ctx.globalAlpha = Math.max(0, Math.min(1, e.vie*2));
    pfDraw(e.x, e.y, "★", "#ffd45a", 2);
  }
  ctx.globalAlpha = 1;
  for (const d of splashDrops){
    ctx.globalAlpha = Math.max(0, Math.min(1, d.vie*3));
    ctx.fillStyle = "#8fd0f5";
    ctx.fillRect(d.x|0, d.y|0, 2, 2);
  }
  ctx.globalAlpha = 1;
  if (flashBlanc > 0){
    ctx.fillStyle = "rgba(255,255,255," + Math.min(0.55, flashBlanc) + ")";
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
}
/* confetti 8-bit pour l'écran de fin */
function lancerConfetti(){
  confetti.length = 0;
  const couls = ["#ffd45a","#4fc3f7","#7dffa0","#e255a1","#ff7043","#ffffff"];
  for (let i=0; i<70; i++){
    confetti.push({
      x: Math.random()*cv.width, y: -20 - Math.random()*300,
      vx: (Math.random()*2-1)*30, vy: 60+Math.random()*90,
      coul: couls[(Math.random()*couls.length)|0],
      rot: Math.random()*Math.PI*2, vr: (Math.random()*2-1)*6,
      vie: 6 + Math.random()*6,
      forme: (Math.random()*3)|0,     // 0 carré, 1 rectangle, 2 barre
    });
  }
}
function upConfetti(dt){
  for (const c of confetti){
    c.x += c.vx*dt; c.y += c.vy*dt;
    c.rot += c.vr*dt;
    if (c.y > cv.height + 20) c.y = -20;
  }
}
function dessinerConfetti(){
  for (const c of confetti){
    ctx.save();
    ctx.translate(c.x|0, c.y|0);
    ctx.rotate(Math.round(c.rot / (Math.PI/4)) * (Math.PI/4));     // rotation snap 45° : 8-bit
    ctx.fillStyle = c.coul;
    if (c.forme === 0) ctx.fillRect(-3, -3, 6, 6);
    else if (c.forme === 1) ctx.fillRect(-2, -5, 4, 10);
    else ctx.fillRect(-6, -1, 12, 2);
    ctx.restore();
  }
}

/* ---------------------- 4. ARÈNE 15×13 ---------------------- */
/* Grille façon Bomberman : murs indestructibles en bordure + quelques
   empilements de chaises. Borne fontaine = 3 cases au centre. */
let grille, solType, propre, fontaines = [];
let panneaux = [], loutres = [];
let joueur = null, ia = null, bot2 = null;
const BOTS = [];                            // machines 2 et 3 (décisions LAYA)
let tempsRestant = CHRONO_MANCHE, etat = "titre";
let compte = 3.99;

function creerArene(){
  grille = []; solType = []; propre = []; fontaines = [];
  for (let l=0; l<LIGNES; l++){
    grille[l]=[]; solType[l]=[]; propre[l]=[];
    for (let c=0; c<COLONNES; c++){
      const bord = (l===0 || c===0 || l===LIGNES-1 || c===COLONNES-1);
      grille[l][c] = bord ? T_MUR : T_SOL;
      /* carrelage en colonnes près des murs gauche/droit (la "cantinière"),
         lino (terrain neutre) partout ailleurs */
      solType[l][c] = (c>=1 && c<=3 || c>=11 && c<=13) && !bord ? SOL_CARRELAGE : SOL_LINO;
      propre[l][c] = 0;      // 0 = sale
    }
  }
  /* quelques murs indestructibles (empilements de chaises) —
     v0.2 (équilibrage José) : l'arène contient des couloirs étroits et des
     recoins où la poussée est mécaniquement meilleure :
     - COULOIR ÉTROIT horizontal au-dessus de la fontaine : passage d'1 case
       (l=5, c=4..10), plafonné par des rangées de murs (l=4 et l=6) ;
     - 2e COULOIR ÉTROIT vertical bas-centre : passage d'1 case (c=9, l=9..11)
       entre la poche et la colonne de murs c=10 (dead-end : demi-tour !) ;
     - RECOIN poche 3×3 bas-gauche (c=5..7, l=9..11) : la poussée la raclare
       en UN seul passage de 3 cases de large, l'auto-tracée doit y revenir ;
     - RECOIN poche 3×2 haut-droit (c=10..12, l=2..3), plafonnée au nord. */
  const murs = [
    /* couloir étroit au-dessus de la fontaine */
    [4,4],[5,4],[6,4],[7,4],[8,4],[9,4],[10,4],
    [4,6],[5,6],[6,6],[8,6],[9,6],[10,6],
    /* 2e couloir étroit vertical (dead-end) + est de la poche */
    [10,9],[10,10],[10,11],
    /* poche 3×3 bas-gauche */
    [4,9],[4,10],[4,11],[8,9],[8,10],[8,11],
    /* poche 3×2 haut-droit */
    [9,2],[10,1],[11,1],[12,1],
    /* obstacles isolés d'origine conservés */
    [3,3],[9,3],[3,6],[11,6],[11,9],
  ];
  for (const [c,l] of murs) grille[l][c] = T_MUR;
  /* la borne fontaine : 3 cases au centre */
  grille[6][7] = T_FONTAINE;
  fontaines.push({c:7, l:6});
}

/* panneaux « attention ça glisse » : derrière eux, on dérape */
function creerPanneaux(){
  panneaux = [];
  const spots = [[5,2],[9,10],[2,8]];
  for (const [c,l] of spots){
    if (grille[l][c] === T_SOL) panneaux.push({c, l, renverse:false, timer:0});
  }
}

/* ---------------------- 5. ENTITÉS ---------------------- */
function creerMachine(col, ligne, couleur, nom, estIA, mode){
  return {
    x: col*TUILE + TUILE/2 + MARGE_X,
    y: ligne*TUILE + TUILE/2 + MARGE_Y,
    couleur, nom, estIA, mode,          // mode : "pushed" | "autotracked"
    traceLargeur: mode === MODE_PUSHED ? TRACE_PUSHED : TRACE_AUTO,  // v0.2
    accelTimer: 0,                      // v0.2 : inertie auto-tracée (progression 0→1)
    vitesseActuelle: 0,                 // v0.2
    reservoir: RESERVOIR_MAX,
    rechargeTimer: 0,          // progression de la recharge (0..3 s)
    coeurs: 0,                 // Cœurs de Loutre
    calin: 0,                  // Immobilisé : en plein câlin
    dansCouloir: false,        // v0.2 : présent dans un couloir étroit (auto-tracée)
    maneuvreCouloir: 0,        // v0.2 : malus de manœuvre visible (deuxième-tour coûteux)
    nettoyees: 0,
    dir: {x:0, y:1},           // direction de la serpillière
    drift: 0,                  // dérive restante sur zone glissante (s)
    dx: 0, dy: 0,              // direction voulue cette frame (IA)
    cible: null,               // cible IA
  };
}

/* la loutre : lentement déambulante, tout mignonne */
function creerLoutre(col, ligne){
  return {
    x: col*TUILE + TUILE/2 + MARGE_X,
    y: ligne*TUILE + TUILE/2 + MARGE_Y,
    dirX: 1, dirY: 0,
    tempsDir: 1.5,
    calin: 0,
  };
}

function placerLoutres(){
  loutres = [creerLoutre(2,10), creerLoutre(12,2)];
}

function demarrerManche(){
  creerArene();
  creerPanneaux();
  placerLoutres();
  /* Machine 1 : le joueur humain (mode choisi à l'écran de sélection).
     Machines 2 et 3 : bots LAYA, un par mode pour comparer en course. */
  joueur = creerMachine(1, 1, "#4fc3f7", "TOI", false, modeJoueur);
  ia     = creerMachine(13, 11, "#ff7043", "MOPZILLA", true, MODE_PUSHED);   // bot poussé
  bot2   = creerMachine(13, 1, "#66bb6a", "PROPRETAIN", true, MODE_AUTO);    // bot auto-tracé
  BOTS.length = 0;
  BOTS.push(ia, bot2);
  if (!laya) laya = new BotBrain();     // (ré)initialise le cerveau LAYA à chaque manche
  tempsRestant = CHRONO_MANCHE;
  etat = "compte"; compte = 3.99;
  /* v0.3 : reset juice (particules, shake, flash, score affiché) */
  PARTS.length = 0; gouttes.length = 0; bulles.length = 0;
  etoiles.length = 0; splashDrops.length = 0; confetti.length = 0;
  shake.t = 0; shake.x = 0; shake.y = 0; shake.mag = 0;
  flashBlanc = 0; scoreAff = 0;
  dernierGlou = 0;
  console.log("[v0.2] manche démarrée — joueur : " + modeJoueur + " · bot1 : " + MODE_PUSHED + " · bot2 : " + MODE_AUTO);
}

/* ---------------------- 6. PHYSIQUE + NETTOYAGE ---------------------- */
function caseDe(px, py){
  return {
    c: Math.floor((px - MARGE_X)/TUILE),
    l: Math.floor((py - MARGE_Y)/TUILE),
  };
}
/* collision : position dans un mur / fontaine ? */
function dansMur(px, py){
  const {c,l} = caseDe(px,py);
  if (c<0||l<0||c>=COLONNES||l>=LIGNES) return true;
  return grille[l][c] !== T_SOL;
}

/* déplacement fluide avec collisions 4 côtés (séparation des axes)
   v0.2 : vitesse multipliée par le mode (poussé ×0.7, auto ×1.3)
   v0.2 : auto-tracée = inertie ~80 ms (accélération progressive)          */
function bougerMachine(m, dx, dy, dt){
  if (m.calin > 0){ m.calin -= dt; return; }         // câlin en cours : immobile
  const v = (m.estIA ? VITESSE_IA : VITESSE_JOUEUR);
  const modedef = MODES.find(x => x.id === m.mode) || { vitesseMul: 1 };
  const vCible = v * modedef.vitesseMul;
  const roule = (dx||dy) ? 1 : 0;
  if (m.mode === MODE_AUTO && roule){
    /* inertie : ~80 ms pour monter en vitesse (accélération progressive) */
    m.accelTimer = Math.min(1, m.accelTimer + dt/ACCEL_AUTO);
  } else {
    m.accelTimer = roule ? m.accelTimer : 0;         // arrêt : remise à zéro
  }
  const facteur = (m.mode === MODE_AUTO) ? (0.25 + 0.75*m.accelTimer) : 1;
  m.vitesseActuelle = vCible * facteur * roule;
  const sp = m.vitesseActuelle;
  if (dx||dy){
    const n = Math.hypot(dx,dy)||1;
    if (m.mode === MODE_PUSHED){
      /* rotation par pas de 90° : pas de diagonale, axes cardinaux seulement */
      if (Math.abs(dx) >= Math.abs(dy)){
        m.dir = {x: Math.sign(dx), y: 0};
      } else {
        m.dir = {x: 0, y: Math.sign(dy)};
      }
    } else {
      m.dir = {x:dx/n, y:dy/n};
    }
  }
  const px = m.x + m.dir.x*sp*dt;
  const py = m.y + m.dir.y*sp*dt;
  const R = 13;                                       // rayon de collision
  if (sp){
    if (!dansMur(px - R, m.y - R) && !dansMur(px + R, m.y - R) &&
        !dansMur(px - R, m.y + R) && !dansMur(px + R, m.y + R)) m.x = px;
    if (!dansMur(m.x - R, py - R) && !dansMur(m.x + R, py - R) &&
        !dansMur(m.x - R, py + R) && !dansMur(m.x + R, py + R)) m.y = py;
  }
}

/* v0.2 : trace large du mode POUSSÉ — 3 cases de large, perpendiculaire au
   déplacement (case centrale + 1 de chaque côté). La case centrale nettoie
   normalement ; les 2 latérales nettoient si sol franchissable et pas déjà
   propre. Chaque case nettoyée rapporte 1 pt. */
function nettoyerCase(m){
  const {c,l} = caseDe(m.x, m.y);
  if (c<1||l<1||c>=COLONNES-1||l>=LIGNES-1) return;
  if (grille[l][c] !== T_SOL) return;
  if (m.mode === MODE_PUSHED){
    /* les 3 cases du passage : la centrale + les 2 perpendiculaires */
    const perpendiculaire = Math.abs(m.dir.x) > 0.5
      ? [{dc:0,dl:-1},{dc:0,dl:1}]                    // déplacement horizont. → voisines verticales
      : [{dc:-1,dl:0},{dc:1,dl:0}];                   // déplacement vertical → voisines horizont.
    for (const off of [{dc:0,dl:0}, ...perpendiculaire]){
      const cc = c + off.dc, ll = l + off.dl;
      if (cc<1||ll<1||cc>=COLONNES-1||ll>=LIGNES-1) continue;
      if (grille[ll][cc] !== T_SOL || propre[ll][cc] !== 0) continue;
      if (m.reservoir <= 0) return;
      propre[ll][cc] = 1;
      m.nettoyees++;
      m.reservoir = Math.max(0, m.reservoir - COUT_EAU);
      eclatCase(cc, ll, "#bfe9ff"); flashBlanc = Math.max(flashBlanc, 0.18);
      if (off.dc === 0 && off.dl === 0){ sonPlop(); sonJingleCase(); }
      if (m === joueur) addShake(2, 0.10);
    }
    return;
  }
  /* AUTO-TRACÉE : trace fine, 1 case (case courante + règle carrelage DUO) */
  if (propre[l][c] !== 0) return;
  if (m.reservoir <= 0) return;                    // plus d'eau : plus de savon
  propre[l][c] = 1;
  m.nettoyees++;
  m.reservoir = Math.max(0, m.reservoir - COUT_EAU);
  eclatCase(c, l, "#bfe9ff"); flashBlanc = Math.max(flashBlanc, 0.18);
  sonPlop(); sonJingleCase();
  if (m === joueur) addShake(2, 0.10);
  /* traînée large sur carrelage : la case juste derrière la machine */
  if (solType[l][c] === SOL_CARRELAGE){
    const c2 = c - Math.round(m.dir.x), l2 = l - Math.round(m.dir.y);
    if (c2>=1 && l2>=1 && c2<COLONNES-1 && l2<LIGNES-1 &&
        grille[l2][c2] === T_SOL && propre[l2][c2] === 0){
      propre[l2][c2] = 1; m.nettoyees++;
      m.reservoir = Math.max(0, m.reservoir - COUT_EAU);
      eclatCase(c2, l2, "#a4d8f0");
    }
  }
}

/* détecte si la machine est dans un couloir d'1 case de large
   (mur des deux côtés, perpendiculairement à sa direction) */
function dansCouloirEtroit(m){
  const {c,l} = caseDe(m.x, m.y);
  if (m.dir.x !== 0){        // se déplace horizontalement : murs au N et au S ?
    return l>0 && l<LIGNES-1 && grille[l-1][c] === T_MUR && grille[l+1][c] === T_MUR;
  }
  if (m.dir.y !== 0){        // verticalement : murs à l'E et à l'O ?
    return c>0 && c<COLONNES-1 && grille[l][c-1] === T_MUR && grille[l][c+1] === T_MUR;
  }
  return false;
}

/* ---------------------- 7. FONTAINE + LOUTRES + IA ---------------------- */
function updateFontaine(m, dt){
  const {c,l} = caseDe(m.x, m.y);
  let surFontaine = false;
  for (const f of fontaines){
    if (c===f.c && l===f.l){ surFontaine = true; break; }
    /* le halo de la fontaine : les 4 cases adjacentes déclenchent aussi la recharge
       (le mur central bloque, on tolère le contact) */
    if (Math.abs(c - f.c) + Math.abs(l - f.l) === 1){ surFontaine = true; break; }
  }
  if (surFontaine && m.reservoir < RESERVOIR_MAX && m.calin <= 0){
    const avant = m.rechargeTimer;
    m.rechargeTimer += dt;
    /* v0.3 : particules d'eau quand la borne coule (glouglou VISUEL) */
    if (Math.random() < 0.25){
      const fx = MARGE_X + fontaines[0].c*TUILE + TUILE/2 + (Math.random()*16-8);
      const fy = MARGE_Y + fontaines[0].l*TUILE + 26;
      gouttes.push({x: fx, y: fy, vy: 60 + Math.random()*30, vie: 0.45});
    }
    if ((avant|0) !== (m.rechargeTimer|0) || (avant === 0)) sonGlou();
    if (m.rechargeTimer >= RECHARGE_FONTAINE){
      m.reservoir = RESERVOIR_MAX;
      m.rechargeTimer = 0;
      bip("sine", 700, 900, 0.2, 0.12);         // "plein !"
      if (m === joueur){ flashBlanc = Math.max(flashBlanc, 0.3); addShake(2, 0.12); eclat(m.x, m.y-10, 8, "#7ac0ea"); }
    }
  } else {
    m.rechargeTimer = 0;
  }
}

/* les loutres déambulent lentement ; collision = câlin 2 s ; +1 Cœur */
function updateLoutre(o, dt){
  if (o.calin > 0){
    o.calin -= dt;
    /* pendant le câlin, la loutre reste près du joueur */
    if (o.calin <= 0){ o.calin = 0; o.tempsDir = 0; }
    return;
  }
  o.tempsDir -= dt;
  if (o.tempsDir <= 0){
    if (Math.random() < 0.65){
      const d = [[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0];
      o.dirX = d[0]; o.dirY = d[1];
    }
    o.tempsDir = 1.5 + Math.random()*2.5;
  }
  const nx = o.x + o.dirX*VITESSE_LOUTRE*dt;
  const ny = o.y + o.dirY*VITESSE_LOUTRE*dt;
  if (!dansMur(nx + o.dirX*10, o.y + o.dirY*10)) o.x = nx; else o.tempsDir = 0;
  if (!dansMur(o.x + o.dirX*10, ny + o.dirY*10)) o.y = ny; else o.tempsDir = 0;

  /* câlin : collision proche du joueur */
  if (joueur && joueur.calin <= 0){
    const d = Math.hypot(joueur.x - o.x, joueur.y - o.y);
    if (d < 26){
      joueur.calin = DUREE_CALIN;
      o.calin = DUREE_CALIN;
      if (joueur.coeurs < COEURS_MAX) joueur.coeurs++;
      sonCalin();
      addShake(4, 0.22); flashBlanc = Math.max(flashBlanc, 0.35);
      for (let i=0;i<6;i++){
        const a = Math.random()*Math.PI*2;
        etoiles.push({x: o.x + Math.cos(a)*8, y: o.y + Math.sin(a)*6,
          vx: Math.cos(a)*35, vy: Math.sin(a)*30 - 15, vie: 0.9});
      }
    }
  }
}

/* dérive sur la case du panneau « attention ça glisse » : glisse ~1,5 s
   v0.2 : le mode POUSSÉE ne dérape PAS (serpillière à plat, bien appuyée) */
function appliquerDrift(m, dt){
  if (m.mode === MODE_PUSHED){
    if (m.drift > 0) m.drift = 0;
    return;
  }
  const {c,l} = caseDe(m.x, m.y);
  for (const p of panneaux){
    if (p.c === c && p.l === l && !p.renverse){
      /* le panneau se fait renverser : la zone reste glissante 5 s */
      p.renverse = true; p.timer = 5.0;
      m.drift = 1.5;          // 1,5 s de drift non maîtrisable
      if (m === joueur){ addShake(3, 0.2); sonDrift(); }
      for (let i=0;i<8;i++) splashDrops.push({x: m.x, y: m.y,
        vx: (Math.random()*2-1)*60, vy: (Math.random()*2-1)*60, vie: 0.6});
    }
  }
  if (m.drift > 0) m.drift -= dt;
  /* v0.2 (équilibrage José) : dans un couloir d'1 case, l'inertie de
     l'auto-tracée tourne MAL — le demi-tour coûte une case de manœuvre.
     Visible via m.maneuvreCouloir (s) qui sert au HUD et au sprite. */
  if (m.mode === MODE_AUTO && dansCouloirEtroit(m)){
    if (!m.dansCouloir){                       // on vient d'entrer dans le couloir
      m.dansCouloir = true;
      m.maneuvreCouloir = PIVOT_COULOIR;       // malus de manœuvre (demi-tour coûteux)
      console.log("[v0.2] " + m.nom + " entre dans un couloir étroit — manœuvre visible");
    }
  } else {
    m.dansCouloir = false;
  }
}

/* ================================================================
   // LAYA BOT BRAIN — moteur de décision type System-1
   Toutes les ~1,5 s chaque bot interroge le service LAYA hébergé
   sur le NAS (http://192.168.1.60:8765/bot). Contrat FIGÉ :
     envoi  : {"water_low":bool,"nearest_dirty_dist":int,"near_otters":int,"rank":int,"in_drift_zone":bool}
     retour : {"choice":"go_fountain"|"chase_dirty"|"contest"|"grab_otter"}
   Timeout 400 ms (AbortController). À l'échec → FALLBACK local
   (heuristique if/else, mêmes 4 actions) + badge « Laya hors ligne ».
   ================================================================ */
const LAYA_URL  = "http://192.168.1.60:8765/bot";
const LAYA_TIMEOUT = 400;        // ms
let layaHorsLigne = false;       // false → LAYA répond ; true → fallback actif

class BotBrain {
  constructor(){
    this.botTimer = 0;           // fenêtre de 1,5 s entre deux décisions
    this.decisionPending = false;
    this.fenetre = {};           // direction/choix courant appliqué par bot
    for (const b of BOTS) this.fenetre[b.nom] = null;
    this.dejaLog = false;
  }
  /* ---- état au format du contrat LAYA ---- */
  etatPourBot(bot){
    return {
      water_low: bot.reservoir < 0.15,
      nearest_dirty_dist: plusProcheCaseSale(bot),
      near_otters: nbLoutresProches(bot),
      rank: rangBot(bot),
      in_drift_zone: this.zoneDrift(bot),
      mode: bot.mode,           // v0.2 : "pushed" | "autotracked" — le serveur l'ignore,
                                // le champ est prévu pour l'équilibrage futur
    };
  }
  zoneDrift(bot){
    const {c,l} = caseDe(bot.x, bot.y);
    return panneaux.some(p => p.c===c && p.l===l);
  }
  /* ---- décision : LAYA (distant) ou heuristique (fallback) ---- */
  decider(bot){
    const etatBot = this.etatPourBot(bot);
    /* --- FALLBACK local (serveur absent ou échec précédent) --- */
    if (layaHorsLigne){
      this.appliquer(bot, this.heuristique(etatBot));
      return;
    }
    /* On applique D'ABORD l'heuristique : si LAYA répond à temps, elle
       ÉCRASE cette décision dans la même fenêtre (aucune frame perdue).
       Un serveur absent → aucun trou de gameplay. */
    this.appliquer(bot, this.heuristique(etatBot));
    /* --- Appel LAYA, timeout 400 ms, jamais bloquant --- */
    this.decisionPending = true;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), LAYA_TIMEOUT);
    fetch(LAYA_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(etatBot),
      signal: ctrl.signal,
    })
      .then(r => r.ok ? r.json() : Promise.reject("http " + r.status))
      .then(data => {
        clearTimeout(to);
        /* LAYA a répondu : sa décision remplace l'heuristique de la fenêtre */
        layaHorsLigne = false;
        this.appliquer(bot, this.valider(data));
      })
      .catch(() => {
        clearTimeout(to);
        /* bascule automatique : les décisions suivantes iront en heuristique pure */
        layaHorsLigne = true;
        /* l'heuristique déjà appliquée ce tick reste valable : rien à refaire */
      })
      .finally(() => { this.decisionPending = false; });
  }
  /* le contrat est strict : un choice hors des 4 verbes tombe en fallback */
  valider(data){
    const CHOIX = ["go_fountain","chase_dirty","contest","grab_otter"];
    if (data && CHOIX.includes(data.choice)) return data.choice;
    return null;
  }
  /* heuristique locale = miroir simplifié de LAYA (les 4 mêmes actions) */
  heuristique(s){
    if (s.water_low)                  return "go_fountain";
    if (s.near_otters > 0 && s.rank <= 2) return "grab_otter";
    if (s.nearest_dirty_dist <= 3)    return "chase_dirty";
    return s.rank === 1 ? "chase_dirty" : "contest";
  }
  /* la décision est APPLIQUÉE pendant toute la fenêtre suivante (1,5 s) */
  appliquer(bot, choice){
    if (!choice) return;
    this.fenetre[bot.nom] = { choice, expire: 1.5 };
  }
  /* toutes les 1,5 s : nouvelle décision pour chaque bot */
  update(dt){
    this.botTimer -= dt;
    if (this.botTimer <= 0 && !this.decisionPending){
      this.botTimer = 1.5;
      for (const b of BOTS) this.decider(b);
    }
    /* les fenêtres expirent */
    for (const b of BOTS){
      const f = this.fenetre[b.nom];
      if (f){ f.expire -= dt; if (f.expire <= 0) this.fenetre[b.nom] = null; }
    }
  }
}

/* ---- helpers d'état utilisés par le contrat LAYA ---- */
function plusProcheCaseSale(bot){
  const {c:l0, l} = caseDe(bot.x, bot.y);
  let best = Infinity;
  for (let i=0;i<26;i++){
    const c = 1 + ((Math.random()*(COLONNES-2))|0);
    const ll = 1 + ((Math.random()*(LIGNES-2))|0);
    if (grille[ll][c] !== T_SOL || propre[ll][c] !== 0) continue;
    const d = Math.abs(c-l0) + Math.abs(ll-l);
    if (d < best) best = d;
  }
  return best === Infinity ? 99 : best;
}
function nbLoutresProches(bot){
  return loutres.filter(o => Math.hypot(o.x-bot.x, o.y-bot.y) < 3*TUILE).length;
}
function rangBot(bot){
  /* rang du bot dans la course (1 = plus de cases nettoyées) */
  let scores = [];
  for (const m of [joueur, ...BOTS]){
    const cases = m.nettoyees;
    const nom = m.nom;
    scores.push({nom, cases});
  }
  scores.sort((a,b)=>b.cases-a.cases);
  return scores.findIndex(s => s.nom === bot.nom) + 1;
}

let laya = null;   // instance unique du cerveau, créée à demarrerManche()

/* l'IA vise son objectif selon la décision LAYA (ou fallback) en cours
   v0.3.1 FIX BOTS : cible STABLE pendant la fenêtre de décision (1,5 s)
   + BFS complet (grille 15x13) → le chemin est suivi case par case,
   plus de zigzag ni de bot collé à un mur. Les cases VISEES :
   échantillonnées au MOMENT de la décision seulement, scan complet
   (la grille est petite : random banni pour le choix de cible).     */
function cheminBFS(sc, sl, tc, tl){
  if (sc===tc && sl===tl) return null;
  const vu = Array.from({length:LIGNES}, () => Array(COLONNES).fill(false));
  const parent = Array.from({length:LIGNES}, () => Array(COLONNES).fill(null));
  const q = [[sc, sl]]; vu[sl][sc] = true;
  while (q.length){
    const [c,l] = q.shift();
    if (c===tc && l===tl){
      const chemin=[]; let cur=[c,l];
      while (!(cur[0]===sc && cur[1]===sl)){ chemin.unshift(cur); cur = parent[cur[1]][cur[0]]; }
      return chemin.length ? {c: chemin[0][0], l: chemin[0][1]} : null;
    }
    for (const [dc,dl] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const cc=c+dc, ll=l+dl;
      if (cc<0||ll<0||cc>=COLONNES||ll>=LIGNES) continue;
      if (vu[ll][cc] || grille[ll][cc]===T_MUR) continue;
      vu[ll][cc]=true; parent[ll][cc]=[c,l]; q.push([cc,ll]);
    }
  }
  return null;
}
function updateIA(m, dt){
  m.dx = 0; m.dy = 0;
  if (m.calin > 0) return;
  if (m.drift > 0){
    m.dx = m.dir.x >= 0.5 ? 1 : m.dir.x <= -0.5 ? -1 : 0;
    m.dy = m.dir.y >= 0.5 ? 1 : m.dir.y <= -0.5 ? -1 : 0;
    return;
  }
  /* choisir une cible (SCAN COMPLET, la case courante est EXCLUE) */
  function choisirCible(choice){
    if (choice === "go_fountain") return {c: fontaines[0].c, l: fontaines[0].l};
    if (choice === "grab_otter"){
      let best = null, bd = Infinity;
      for (const o of loutres){
        const d = Math.hypot(o.x - m.x, o.y - m.y);
        if (d < bd){ bd = d; best = o; }
      }
      if (best){
        const oc = Math.round((best.x - MARGE_X - TUILE/2)/TUILE);
        const ol = Math.round((best.y - MARGE_Y - TUILE/2)/TUILE);
        return {c: Math.max(1, Math.min(COLONNES-2, oc)), l: Math.max(1, Math.min(LIGNES-2, ol))};
      }
      return null;
    }
    if (choice === "contest"){
      const {c: jc, l: jl} = caseDe(joueur.x, joueur.y);
      let best = null, bd = Infinity;
      for (let l=1;l<LIGNES-1;l++) for (let c=1;c<COLONNES-1;c++){
        if (grille[l][c] !== T_SOL || propre[l][c] === 0) continue;
        const d = Math.abs(c-jc) + Math.abs(l-jl);
        if (d < bd){ bd = d; best = {c, l}; }
      }
      return best || {c: 7, l: 6};
    }
    /* chase_dirty : case SALE la plus proche, SA PROPRE CASE EXCLUE */
    const ici = caseDe(m.x, m.y);
    let best = null, bd = Infinity;
    for (let l=1;l<LIGNES-1;l++) for (let c=1;c<COLONNES-1;c++){
      if (grille[l][c] !== T_SOL || propre[l][c] !== 0) continue;
      if (c===ici.c && l===ici.l) continue;
      const d = Math.abs(c*TUILE + MARGE_X - m.x) + Math.abs(l*TUILE + MARGE_Y - m.y);
      if (d < bd){ bd = d; best = {c, l}; }
    }
    return best;
  }
  let choice = laya && laya.fenetre[m.nom] ? laya.fenetre[m.nom].choice : null;
  if (!choice){ choice = laya ? laya.heuristique(laya.etatPourBot(m)) : "chase_dirty"; }
  /* NOUVELLE décision OU cible atteinte => re-decider IMMÉDIATEMENT */
  const besoinCible = !m.cibleCourante || m.cibleChoice !== choice;
  if (besoinCible){
    m.cibleChoice = choice;
    m.cibleCourante = choisirCible(choice);
    /* réservoir vide → fontaine PRIORITAIRE */
    if (m.reservoir <= 0) m.cibleCourante = {c: fontaines[0].c, l: fontaines[0].l};
    m.cheminCase = null;
  } else if (m.cibleCourante){
    const {c: cc2, l: ll2} = caseDe(m.x, m.y);
    if (cc2===m.cibleCourante.c && ll2===m.cibleCourante.l){
      /* cible atteinte pendant la fenêtre → re-décider SANS ATTENTE */
      const re = choisirCible(choice);
      m.cibleCourante = (re && !(re.c===cc2 && re.l===ll2)) ? re : null;
      if (m.cibleCourante === null && laya && laya.fenetre[m.nom]){
        laya.fenetre[m.nom].expire = 0;   /* force une nouvelle décision au prochain tick */
      }
      m.cheminCase = null;
      if (!m.cibleCourante) return;
    }
  }
  if (!m.cibleCourante) return;
  /* chemin : BFS une fois par cible, on suit la prochaine case */
  if (!m.cheminCase){
    const {c: sc, l: sl} = caseDe(m.x, m.y);
    const nx = cheminBFS(sc, sl, m.cibleCourante.c, m.cibleCourante.l);
    m.cheminCase = nx || null;
    if (!m.cheminCase) return; /* déjà sur la cible ? garde-fou */
  }
  const tx = m.cheminCase.c*TUILE + TUILE/2 + MARGE_X;
  const ty = m.cheminCase.l*TUILE + TUILE/2 + MARGE_Y;
  let dx = 0, dy = 0;
  if (Math.abs(tx - m.x) > 3) dx = Math.sign(tx - m.x);
  else if (Math.abs(ty - m.y) > 3) dy = Math.sign(ty - m.y);
  else { m.cheminCase = null; return; }   /* case suivante au prochain update */
  /* anti-blocage : si un mur bloque l'axe, tenter l'autre (rare avec BFS) */
  if (dx && dansMur(m.x + dx*16, m.y)){ dx = 0; dy = Math.sign(ty - m.y) || 1; }
  if (dy && dansMur(m.x, m.y + dy*16)){ dy = 0; dx = -(dx || Math.sign(tx - m.x) || 1); }
  m.dx = dx; m.dy = dy;
}
/* ---------------------- 8. MISE À JOUR ---------------------- */
function updateMach(m, dx, dy, dt){
  appliquerDrift(m, dt);
  /* v0.2 : le malus de manœuvre (couloir étroit) se résorbe avec le temps */
  if (m.maneuvreCouloir > 0) m.maneuvreCouloir = Math.max(0, m.maneuvreCouloir - dt);
  /* pendant le drift (1,5 s), zone « non maîtrisable » : l'input est ignoré,
     la machine garde son élan dans la direction où elle filait */
  if (m.drift > 0){
    dx = m.dir.x >= 0.5 ? 1 : m.dir.x <= -0.5 ? -1 : 0;
    dy = m.dir.y >= 0.5 ? 1 : m.dir.y <= -0.5 ? -1 : 0;
  }
  bougerMachine(m, dx, dy, dt);
  nettoyerCase(m);
  updateFontaine(m, dt);
}

function update(dt){
  /* machines */
  let dx=0, dy=0;
  if (touches.ArrowLeft  || touches.KeyA) dx = -1;
  if (touches.ArrowRight || touches.KeyD) dx =  1;
  if (touches.ArrowUp    || touches.KeyW) dy = -1;
  if (touches.ArrowDown  || touches.KeyS) dy =  1;
  if (dx && dy){ dy = 0; }            // pas de diagonale : esprit Bomberman
  const roulait = dx||dy;
  updateMach(joueur, dx, dy, dt);
  /* tick de déplacement : léger bleep périodique quand on roule */
  if (roulait){
    joueur.tick = (joueur.tick || 0) + dt;
    if (joueur.tick > 0.16){ sonTick(); joueur.tick = 0; }
  }
  /* — LAYA BOT BRAIN : ticking du cerveau (décisions toutes les 1,5 s) — */
  if (laya) laya.update(dt);

  /* bots 2 et 3 : décision puis mouvement via updateMach (comme le joueur) */
  updateIA(ia, dt);
  updateMach(ia, ia.dx, ia.dy, dt);
  if (bot2){
    updateIA(bot2, dt);
    updateMach(bot2, bot2.dx, bot2.dy, dt);
  }
  /* loutres */
  for (const o of loutres) updateLoutre(o, dt);
  /* panneaux renversés : se remettent debout après 5 s */
  for (const p of panneaux){
    if (p.renverse){ p.timer -= dt; if (p.timer <= 0) p.renverse = false; }
  }
  /* chrono */
  tempsRestant -= dt;
  if (tempsRestant <= 0){
    tempsRestant = 0;
    etat = "fin";
    sonBuzzer(); sonJingleFin();
    finT0 = performance.now(); finPct = pctNettoye();
    lancerConfetti();
  }
}

/* ================================================================
   v0.3-§9a · SOL, SALETÉ, TRACE D'EAU RICHE, LUEURS
   Palette Nilfisk-esque : le sol compte, la trace scintille.
   ================================================================ */

/* sol : lino / carrelage, 2 teintes alternées (damier subtil) + joints fins */
function dessinerSol(x, y, c, l){
  const dam = (c + l) % 2 === 0;
  const type = solType[l][c];
  let base;
  if (type === SOL_CARRELAGE) base = dam ? "#7d8ba0" : "#8b99ad";
  else                        base = dam ? "#c8a878" : "#bd9c6e";
  ctx.fillStyle = base;
  ctx.fillRect(x, y, TUILE, TUILE);
  /* joints fins (lignes 1 px) */
  ctx.fillStyle = type === SOL_CARRELAGE ? "rgba(20,26,40,.25)" : "rgba(70,50,30,.18)";
  ctx.fillRect(x, y, TUILE, 1);
  ctx.fillRect(x, y, 1, TUILE);
  /* variation déterministe subtile (2-3 reflets/pores) */
  let h = (c*73856093 ^ l*19349663) >>> 0;
  const rnd = n => { h = (h*1664525 + 1013904223) >>> 0; return (h % n)/n; };
  ctx.fillStyle = "rgba(255,255,255,.045)";
  for (let i=0; i<3; i++) ctx.fillRect(x + 3 + ((rnd(38)|0)), y + 3 + ((rnd(38)|0)), 4, 4);
  ctx.fillStyle = "rgba(0,0,0,.05)";
  for (let i=0; i<2; i++) ctx.fillRect(x + 2 + ((rnd(38)|0)), y + 2 + ((rnd(38)|0)), 4, 4);
}
/* tache de saleté pseudo-aléatoire (déterministe par case) */
function tacheSale(c, l, x, y){
  let h = (c*73856093 ^ l*19349663) >>> 0;
  const rnd = n => { h = (h*1664525 + 1013904223) >>> 0; return (h % n)/n; };
  ctx.fillStyle = "rgba(80,52,28,.5)";
  ctx.fillRect(x + 6 + rnd(20), y + 8 + rnd(22), 7, 5);
  ctx.fillRect(x + 22 + rnd(12), y + 24 + rnd(10), 6, 4);
  ctx.fillStyle = "rgba(60,38,20,.4)";
  ctx.fillRect(x + 12 + rnd(18), y + 26 + rnd(8), 5, 4);
  /* coulure sombre au centre */
  ctx.fillStyle = "rgba(50,30,12,.35)";
  ctx.fillRect(x + 16 + rnd(8), y + 12 + rnd(14), 3, 3);
}

/* trace d'eau riche : voile dégradé bleu clair → transparent vers le bord,
   reflets scintillants 2 tons NES (alternance 250 ms), bord sombre fin */
function dessinerTrainee(c, l, x, y, coulJoueur){
  const t2 = (performance.now()/250)|0;
  /* voile humide : dégradé radial simulé (carré central + anneau clair) */
  ctx.fillStyle = "rgba(40,90,150,.30)";        // liseré de transition (bord sombre)
  ctx.fillRect(x, y, TUILE, TUILE);
  ctx.fillStyle = "rgba(80,150,220,.30)";       // bord humide
  ctx.fillRect(x+1, y+1, TUILE-2, TUILE-2);
  ctx.fillStyle = "rgba(110,180,235,.38)";      // zone centrale mouillée
  ctx.fillRect(x+2, y+2, TUILE-4, TUILE-4);
  ctx.fillStyle = "rgba(150,205,245,.30)";      // noyau
  ctx.fillRect(x+6, y+6, TUILE-12, TUILE-12);
  /* reflet scintillant : alternance de 2 tons façon palette NES */
  let hh = (c*40503 + l*73856093) >>> 0;
  const phase = ((t2 + c*2 + l*3) % 4), v1 = hh % 22, v2 = (hh>>3) % 22;
  ctx.fillStyle = phase < 2 ? "rgba(235,250,255,.85)" : "rgba(190,225,250,.85)";
  if (phase < 2){
    ctx.fillRect(x+6 + v1, y+6 + v2, 12, 2);
    ctx.fillRect(x+26 - v1/2, y+30 - v2/2, 8, 2);
  } else {
    ctx.fillRect(x+8 - v2/2, y+28, 10, 2);
    ctx.fillRect(x+28 + v1/2, y+8 + v2, 8, 2);
  }
  /* reflet secondaire, ton opposé */
  ctx.fillStyle = phase < 2 ? "rgba(190,225,250,.5)" : "rgba(235,250,255,.5)";
  ctx.fillRect(x+30, y+22, 5, 2);
  /* bulles résiduelles sur la case : 1-2 pixels qui clignotent */
  let h = (c*2654435761 ^ l*40503) >>> 0;
  const rnd = n => { h = (h*1664525 + 1013904223) >>> 0; return (h % n)/n; };
  for (let i=0; i<2; i++){
    const bx = x + 4 + rnd(TUILE-8), by = y + 4 + rnd(TUILE-8);
    if (((t2/2 + i + c + l)|0) % 3 !== 0) continue;   // 1 frame sur 3 environ
    ctx.fillStyle = "rgba(255,255,255,.8)";
    ctx.fillRect(bx|0, by|0, 2, 2);
  }
}

/* zone propre = reflet de lumière animé 2 frames (brillance du sol cire) */
function dessinerBrillanceSol(x, y, c, l){
  const t2 = (performance.now()/500)|0;
  const f = (t2 + c) % 2;
  ctx.fillStyle = "rgba(255,255,255," + (f ? ".10" : ".18") + ")";
  /* reflet en forme d'éclair (2 rects en diagonale) */
  ctx.fillRect(x+8 + f*3, y+10, 5, 3);
  ctx.fillRect(x+11 + f*3, y+13, 4, 2);
  ctx.fillRect(x+24, y+28 - f*2, 6, 3);
}

/* mur : empilement de chaises / distributeur, relief 3D pixel :
   bord supérieur clair, face avant sombre (effet hauteur) */
function dessinerMur(x, y){
  /* relief : la bande basse est la "face" verticale du mur (plus sombre) */
  ctx.fillStyle = "#3d4456";
  ctx.fillRect(x, y+9, TUILE, TUILE-9);            // face avant (ombre)
  ctx.fillStyle = "#5b6377";
  ctx.fillRect(x, y, TUILE, TUILE-9);              // dessus
  ctx.fillStyle = "#6d7790";
  ctx.fillRect(x+2, y+2, TUILE-4, 6);              // liseré éclairé
  /* deux chaises empilées sur le dessus */
  for (let i=0;i<2;i++){
    const cx = x+6, cy = y+5+i*15;
    ctx.fillStyle = "#8a7a54";
    ctx.fillRect(cx, cy, 18, 10);
    ctx.fillStyle = "#6e6042";
    ctx.fillRect(cx, cy+10, 18, 2);
    ctx.fillStyle = "#a3956b";
    ctx.fillRect(cx+2, cy+2, 14, 4);
  }
  /* ombre portée au pied du mur (sur la case en dessous, dessinée ici : bas) */
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.fillRect(x+4, y+TUILE-3, TUILE-8, 3);
}

/* borne fontaine : robinet + bassin, eau animée, gouttes quand recharge */
function dessinerFontaine(x, y){
  const t2 = performance.now()/300;
  /* socle pierre */
  ctx.fillStyle = "#29304a";
  ctx.fillRect(x, y, TUILE, TUILE);
  ctx.fillStyle = "#39415f";
  ctx.fillRect(x+3, y+3, TUILE-6, TUILE-6);
  /* bassin (anneau + eau qui ondule légèrement) */
  ctx.fillStyle = "#5d6880";
  ctx.fillRect(x+7, y+22, TUILE-14, 16);
  ctx.fillStyle = "#2c6c9e";
  ctx.fillRect(x+9, y+24 + ((t2|0)%2), TUILE-18, 10);
  ctx.fillStyle = "#4fa3d8";
  ctx.fillRect(x+11, y+25 + ((t2|0)%2), TUILE-22, 6);
  /* borne (colonne centrale) avec face claire */
  ctx.fillStyle = "#c0392b";
  ctx.fillRect(x+14, y+8, 16, 16);
  ctx.fillStyle = "#e74c3c";
  ctx.fillRect(x+15, y+9, 14, 6);
  /* robinet + jet */
  ctx.fillStyle = "#3498db";
  ctx.fillRect(x+19, y+20, 6, 5);
  ctx.fillStyle = "#bfe3ff";
  ctx.fillRect(x+20 + ((t2|0)%3 === 0 ? 1 : 0), y+25, 3, 4);
  /* halo pulsant (aiguille vers la recharge) */
  const p = 0.22 + 0.14*Math.sin(performance.now()/400);
  ctx.strokeStyle = "rgba(80,180,255," + p + ")";
  ctx.lineWidth = 2;
  ctx.strokeRect(x+2, y+2, TUILE-4, TUILE-4);
}

/* panneau « attention ça glisse » : poteau + triangle jaune,
   bonhomme qui glisse, légère oscillation ; se renverse */
function dessinerPanneau(p){
  const x = MARGE_X + p.c*TUILE, y = MARGE_Y + p.l*TUILE;
  const cx = x+TUILE/2, cy = y+TUILE/2;
  ctx.save();
  /* oscillation subtile quand debout (le vent du nettoyage) */
  if (!p.renverse){
    const ang = Math.sin(performance.now()/600)*0.06;
    ctx.translate(cx, y+TUILE-6);
    ctx.rotate(ang);
    ctx.translate(-cx, -(y+TUILE-6));
  } else {
    ctx.translate(cx, cy);
    ctx.rotate(-Math.PI/2.2);
    ctx.translate(-cx, -cy);
  }
  /* ombre du poteau */
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.fillRect(cx+2, y+TUILE-9, 12, 3);
  /* poteau */
  ctx.fillStyle = "#8a8f98";
  ctx.fillRect(cx-2, y+TUILE-12, 4, 12);
  ctx.fillStyle = "#a9aeb8";
  ctx.fillRect(cx-2, y+TUILE-12, 2, 12);
  /* panneau triangulaire jaune, bord rouge */
  ctx.fillStyle = "#f1c40f";
  ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, y+5);
  ctx.lineTo(x+TUILE-5, y+TUILE-11);
  ctx.lineTo(x+5, y+TUILE-11);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  /* bonhomme qui glisse (pixel) */
  ctx.fillStyle = "#2c3e50";
  ctx.fillRect(cx-9, y+14, 5, 5);            // tête
  ctx.fillRect(cx-6, y+19, 12, 3);           // corps penché
  ctx.fillRect(cx+6, y+21, 5, 2);            // bras tendu
  ctx.fillRect(cx-12, y+23, 6, 2);           // jambes glissantes
  /* petites « lignes de glisse » derrière lui */
  ctx.fillStyle = "#2c3e50";
  ctx.fillRect(cx-16, y+24, 3, 1);
  ctx.fillRect(cx-15, y+26, 2, 1);
  ctx.restore();
}

/* ombre portée elliptique semi-transparente sous une entité */
function ombreEntite(x, y, rx, ry){
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath();
  ctx.ellipse(x, y + (ry||8), rx, (ry||8)/2, 0, 0, Math.PI*2);
  ctx.fill();
}

/* pré-rend 4 orientations pour une teinte ; renvoie [canvas bas, gauche, haut, droite] */
function prerenderMachine(teinte, pushed){
  const base = document.createElement("canvas");
  base.width = 92; base.height = 92;
  spriteMachineBase(base.getContext("2d"), teinte, pushed);
  const out = [];
  /* dir (0,1)=S/bas → angle 0 · (−1,0)=O/gauche · (0,−1)=N/haut · (1,0)=E/droite */
  const angles = [0, -Math.PI/2, Math.PI, Math.PI/2];
  for (const a of angles){
    const c2 = document.createElement("canvas");
    c2.width = 92; c2.height = 92;
    const g2 = c2.getContext("2d");
    g2.imageSmoothingEnabled = false;
    g2.translate(46, 46);
    g2.rotate(a);
    g2.drawImage(base, -46, -46);
    out.push(c2);
  }
  return out;
}
function spriteMachine(m){
  const clef = clefSprite(m);
  if (!SPR_MACHINE[clef]) SPR_MACHINE[clef] = prerenderMachine(m.couleur, m.mode === MODE_PUSHED);
  const idx = m.dir.y > 0.5 ? 0 : m.dir.x < -0.5 ? 1 : m.dir.y < -0.5 ? 2 : 3;
  return SPR_MACHINE[clef][idx];
}

/* ── DESSIN COMPLET DE LA MACHINE (ombre, brosse vue de dessus, sprite,
      niveau d'eau dans le bac, cœurs, recharges, câlin, drift) ── */
function dessinerMachine(m){
  const x = Math.round(m.x), y = Math.round(m.y);
  const pushing = m.vitesseActuelle > 1;
  /* squish & stretch : scaleY quand on accélère, scaleX quand on démarre */
  let sx = 1, sy = 1;
  if (pushing && m.mode === MODE_AUTO){ sy = 1.06; sx = 0.96; }
  else if (pushing){ sy = 0.95; sx = 1.05; }
  /* ombre portée */
  ombreEntite(x, y, 15, 9);
  /* ── trace d'eau en arc derrière la machine (particules continues) ── */
  if (pushing && m.reservoir > 0 && Math.random() < 0.35){
    const bx = x - m.dir.x*18 + (Math.random()*10-5);
    const by = y - m.dir.y*18 + (Math.random()*10-5);
    bulles.push({x: bx, y: by, vie: 0.6 + Math.random()*0.4, t: 0});
  }
  /* ── BROSSE ROTATIVE : 3 frames d'ombre rotative sur les bords ── */
  const fr = (performance.now()/90)|0;
  const bx0 = x - m.dir.x*14, by0 = y - m.dir.y*14;   /* centre brosse (avant?) —
     en fait la brosse est SOUS le châssis : on la dessine comme une bande
     qui dépasse de part et d'autre, animée de gauche à droite */
  ctx.fillStyle = "rgba(0,0,0,.28)";
  if (m.dir.x !== 0){       /* déplacement horizontal : brosse verticale sous châssis */
    const oy = (fr%3) - 1;
    ctx.fillRect(bx0-2, y-13+oy, 3, 4);
    ctx.fillRect(bx0-1, y-4, 3, 8);
    ctx.fillRect(bx0-2, y+5-oy, 3, 4);
  } else {                  /* déplacement vertical : brosse horizontale */
    const ox = (fr%3) - 1;
    ctx.fillRect(x-14+ox, by0-2, 4, 3);
    ctx.fillRect(x-6, by0-1, 8, 3);
    ctx.fillRect(x+6-ox, by0-2, 4, 3);
  }
  /* poils clairs de la brosse qui scintillent (frame sur 2) */
  if (fr % 2 === 0){
    ctx.fillStyle = "rgba(255,220,140,.7)";
    ctx.fillRect(bx0-1, by0-1, 2, 2);
  }
  /* ── SPRITE ── */
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sx, sy);
  ctx.drawImage(spriteMachine(m), -46, -46 - (m.mode === MODE_PUSHED ? 0 : 0));
  ctx.restore();
  /* ── NIVEAU D'EAU IN-GAME : le liquide du bac solution BAISSANT ── */
  const lvl = m.reservoir / RESERVOIR_MAX;
  /* jauge IN-GAME : le liquide du bac solution BAISSANT — dessinée quand le
     sprite pointe vers le bas ; la barre sous la machine reste la jauge
     gameplay fiable toutes orientations. */
  if (lvl < 0.999 && m.dir.y > 0.5){
    const bacY = y - 4;
    const hMax = 11, hL = hMax * lvl;
    ctx.fillStyle = "rgba(20,25,32,.75)";
    ctx.fillRect(x - 10, bacY + hL, 9, hMax - hL + 1);
    ctx.fillStyle = lvl < 0.15 ? NILFISK_COULS.jauneFoncé : NILFISK_COULS.eau;
    ctx.fillRect(x - 10, bacY, 9, Math.max(1, hL)|0);
    ctx.fillStyle = "rgba(255,255,255,.5)";
    ctx.fillRect(x - 10, bacY, 9, 1);
  }
  /* barre fine d'état sous la machine (complète le bac) */
  ctx.fillStyle = "#10202c";
  ctx.fillRect(x-11, y+19, 22, 3);
  ctx.fillStyle = m.reservoir < 0.15 ? "#e74c3c" : "#3fa9f5";
  ctx.fillRect(x-11, y+19, (22*lvl)|0, 3);
  /* LED d'état clignotante si réservoir bas */
  if (lvl < 0.15 && ((performance.now()/250)|0)%2 === 0){
    ctx.fillStyle = "#ff4444";
    ctx.fillRect(x+10, y-7, 3, 3);
  }
  /* ── nom de la machine au-dessus (identité lisible) ── */
  pfDraw(x, y-32, m.nom, m.couleur, 2, 0, 1);
  /* ── cœurs de loutre au-dessus ── */
  for (let i=0;i<m.coeurs;i++) dessinerCoeur(x-11+i*9, y-24, 3);
  /* barre de recharge au-dessus */
  if (m.rechargeTimer > 0){
    ctx.fillStyle = "#10202c";
    ctx.fillRect(x-12, y-18, 24, 5);
    ctx.fillStyle = "#3fa9f5";
    ctx.fillRect(x-11, y-17, (22*(m.rechargeTimer/RECHARGE_FONTAINE))|0, 3);
    /* gouttes au-dessus (recharge = la fontaine coule) */
    if (Math.random() < 0.3) gouttes.push({x: x + Math.random()*20 - 10, y: y-22, vy: 40, vie: 0.5});
  }
  /* indicateur de malus couloir étroit (pictogramme alerte) */
  if (m.maneuvreCouloir > 0 && ((performance.now()/180)|0)%2 === 0){
    pfDraw(x, y-30, "!", "#e8a33d", 2);
  }
  /* ── CÂLIN : halo + gros cœur + particules ── */
  if (m.calin > 0){
    const b = Math.sin(performance.now()/110)*3;
    ctx.fillStyle = "rgba(255,120,180,.12)";
    ctx.fillRect(x-18, y-16, 36, 32);
    dessinerCoeur(x-6, y-32+b, 6);
    if (Math.random() < 0.25){
      const a = Math.random()*Math.PI*2;
      etoiles.push({x: x+Math.cos(a)*10, y: y-10+Math.sin(a)*8, vx: Math.cos(a)*25, vy: Math.sin(a)*25-10, vie: 0.7});
    }
  }
  /* flèches d'orientation du déplacement quand drift (glisse) */
  if (m.drift > 0 && ((performance.now()/120)|0)%2 === 0){
    ctx.fillStyle = "rgba(255,255,255,.7)";
    const ax = x + m.dir.x*20, ay = y + m.dir.y*20;
    pfDraw(ax, ay, ">", "#ffffff", 1);
  }
  /* badge du mode sous la machine (humain : "P" poussé / "A" auto) */
  if (m === joueur && etat === "course"){
    pfDraw(x, y+30, m.mode === MODE_PUSHED ? "P" : "A", "#ffffff", 1, 0, 1);
  }
}

/* ── loutre top-down améliorée : corps brun, tête, pattes, queue 2 frames ── */
function dessinerLoutre(o){
  const x = Math.round(o.x), y = Math.round(o.y);
  const g = o.dirX < 0;                    /* regarde à gauche ? */
  const t2 = (performance.now()/280)|0;
  ombreEntite(x, y, 11, 7);
  /* queue qui remue : 2 frames */
  ctx.fillStyle = "#5d4028";
  if (t2 % 2 === 0) ctx.fillRect(g ? x+10 : x-14, y+4, 4, 3);
  else ctx.fillRect(g ? x+10 : x-14, y+3, 4, 4);
  /* pattes (derrière le corps, visibles sur les côtés) */
  ctx.fillStyle = "#4e351f";
  ctx.fillRect(x-9, y+5, 3, 4);
  ctx.fillRect(x+6, y+5, 3, 4);
  /* corps */
  ctx.fillStyle = "#6d4c2f";
  ctx.fillRect(x-11, y-3, 22, 11);
  /* ventre beige */
  ctx.fillStyle = "#c9a86b";
  ctx.fillRect(g ? x-8 : x-4, y+2, 10, 5);
  /* tête */
  ctx.fillStyle = "#6d4c2f";
  ctx.fillRect(x-6, y-10, 12, 8);
  /* oreilles minuscules */
  ctx.fillStyle = "#5d4028";
  ctx.fillRect(x-6, y-11, 2, 2);
  ctx.fillRect(x+4, y-11, 2, 2);
  /* museau + moustaches */
  ctx.fillStyle = "#c9a86b";
  ctx.fillRect(g ? x-6 : x+2, y-6, 4, 4);
  ctx.strokeStyle = "#3a2a18"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(g ? x-2 : x+2, y-4); ctx.lineTo(g ? x+4 : x-4, y-4+1); ctx.stroke();
  /* yeux + truffe */
  ctx.fillStyle = "#1a1208";
  ctx.fillRect(g ? x-5 : x+2, y-9, 2, 2);
  ctx.fillRect(x, y-7, 2, 2);
  /* petit reflet dos */
  ctx.fillStyle = "#7d5a39";
  ctx.fillRect(x-9, y-2, 18, 1);
  /* câlin en cours : cœur + étoiles */
  if (o.calin > 0){
    const b = Math.sin(performance.now()/120)*3;
    dessinerCoeur(x-4, y-22+b, 4);
    if (Math.random() < 0.3){
      const a = Math.random()*Math.PI*2;
      etoiles.push({x: x+Math.cos(a)*12, y: y-8+Math.sin(a)*8, vx: Math.cos(a)*30, vy: Math.sin(a)*30-15, vie: 0.8});
    }
  }
}

/* cœur pixel 8-bit (contour noir pour ressortir sur fond sombre) */
function dessinerCoeur(x, y, s){
  ctx.fillStyle = "#171a20";
  ctx.fillRect(x - s - 1, y - 1, s*4 + 2, s*2 + 2);
  ctx.fillRect(x - 1, y + s*2 - 1, s*2 + 2, s + 2);
  ctx.fillStyle = "#e255a1";
  ctx.fillRect(x, y, s*2, s);
  ctx.fillRect(x - s, y + s, s*4, s);
  ctx.fillRect(x, y + s*2, s*2, s);
  ctx.fillRect(x + s - s/2, y + s*3, s, s);
  ctx.fillStyle = "#ffd0ea";
  ctx.fillRect(x, y, s, s - s/2);
}

/* surface nettoyable / % nettoyé (logique v0.2 inchangée) */
function compterSolNettoyable(){
  let n = 0;
  for (let l=1;l<LIGNES-1;l++) for (let c=1;c<COLONNES-1;c++)
    if (grille[l][c] === T_SOL) n++;
  return n;
}
function pctNettoye(){
  let n = 0;
  for (let l=1;l<LIGNES-1;l++) for (let c=1;c<COLONNES-1;c++)
    if (grille[l][c] === T_SOL && propre[l][c] === 1) n++;
  const tot = compterSolNettoyable();
  return tot ? Math.round(100*n/tot) : 0;
}
let scoreAff = 0;        /* compteur ease-out pour le % nettoyé affiché */
function dessinerHUD(){
  /* fond de bandeau HUD opaque pour lisibilité, avec liseré inférieur */
  ctx.fillStyle = "rgba(10,14,26,.85)";

  /* ── TOI : % nettoyé avec compteur qui défile (ease-out) ── */
  const pct = pctNettoye();
  scoreAff += (pct - scoreAff) * 0.12;
  if (Math.abs(pct - scoreAff) < 0.6) scoreAff = pct;
  const aff = Math.round(scoreAff);
  pfDraw(MARGE_X, 13, "TOI", "#8fa0b8", 2, 1);
  pfDraw(MARGE_X + 46, 13, aff + " %", "#4fc3f7", 2, 1);

  ctx.fillStyle = "#3d5878";

    const malus = Math.max(joueur.maneuvreCouloir || 0, joueur.dansCouloir ? PIVOT_COULOIR : 0);
    if (malus > 0){

  /* mode sans score (titre) : rien */

  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textAlign = "center";
  pfDraw(cv.width/2, 70, "CHOISIS TON MODE", "#ffd45a", 3, 0, 1);
  pfDraw(cv.width/2, 106, "DEUX FAMILLES - DEUX STYLES DE JEU", "#8fa0b8", 1, 0);
  const cxG = cv.width/2, ecart = 240;
  MODES.forEach((mm, i)=>{
    const sel = (i === selMode);
    const cx = cxG + (i===0 ? -ecart/2 : ecart/2);
    const cy = 272, w = 210, h = 260;
    /* carte : fond + bord ; sélection = bord cyan animé */
    ctx.fillStyle = sel ? "rgba(80,150,255,.25)" : "rgba(40,52,80,.45)";
    ctx.fillRect(cx-w/2, cy-h/2, w, h);
    ctx.strokeStyle = sel ? ( ((performance.now()/300)|0)%2 ? "#4fc3f7" : "#9fdcff" ) : "#3a4a6c";
    ctx.lineWidth = sel ? 3 : 1;
    ctx.strokeRect(cx-w/2, cy-h/2, w, h);
    if (sel){
      pfDraw(cx, cy-112, "> SELECTIONNE <", "#7dffa0", 1, 0);
    } else {
      pfDraw(cx, cy-112, mm.nom, "#8fa0b8", 1, 0);
    }
    /* MINI ILLUSTRATION = vraie machine Nilfisk pré-rendue (orientation S) */
    ctx.save();
    ctx.translate(cx, cy-40);
    ctx.scale(1.15, 1.15);
    const teinteI = i === 0 ? "#ff7043" : "#4fc3f7";
    const clefCache = teinteI + "|" + (mm.id === MODE_PUSHED ? "P" : "A");
    if (!SPR_MACHINE[clefCache]) SPR_MACHINE[clefCache] = prerenderMachine(teinteI, mm.id === MODE_PUSHED);
    ctx.drawImage(SPR_MACHINE[clefCache][0], -46, -46);
    ctx.restore();
    /* reflet d'eau sous l'illustration */
    ctx.fillStyle = "rgba(63,169,245,.35)";
    ctx.fillRect(cx-30, cy+16, 60, 5);
    /* nom + description */
    pfDraw(cx, cy+46, mm.nom, sel ? "#ffd45a" : "#8fa0b8", 2, 0);
    const dLines = mm.desc.toUpperCase().split("—");
    dLines.forEach((d, k)=> pfDraw(cx, cy+74 + k*16, d.trim(), sel ? "#cfe3ff" : "#5d6f8c", 1, 0));
    /* stats mini-pixels : vitesse (3 carrés) / largeur */
    const nbV = mm.id === MODE_PUSHED ? 2 : 4;
    const nbL = mm.id === MODE_PUSHED ? 3 : 1;
    for (let s2=0; s2<4; s2++){
      ctx.fillStyle = s2 < nbV ? "#7dffa0" : "#2e3a52";
      ctx.fillRect(cx-32 + s2*10, cy+108, 8, 4);
    }
    for (let s2=0; s2<3; s2++){
      ctx.fillStyle = s2 < nbL ? (nbL === 3 ? "#ffd45a" : "#4fc3f7") : "#2e3a52";
      ctx.fillRect(cx+4 + s2*10, cy+108, 8, 4);
    }
    pfDraw(cx-36, cy+124, "VITESSE", "#5d6f8c", 1, 1);
    pfDraw(cx+2, cy+124, "LARGEUR", "#5d6f8c", 1, 1);
  });
  pfDraw(cv.width/2, 454, "FLECHES : CHANGER - ENTREE : VALIDER", "#8fa0b8", 2, 0);
  pfDraw(cv.width/2, 480, "LA SALLE COMPTE DES COULOIRS ETROITS : LA POUSSÉE Y EST REINE", "#e8a33d", 1, 0);
  pfDraw(cv.width/2, 502, "2 BOTS TE REJOIGNENT : UN POUSSÉ ET UN AUTO-TRACÉ", "#6d7a99", 1, 0);
  ctx.textAlign = "left";
}

/* ── écran COMPTE À REBOURS : chiffres pixel qui pulsent ── */
function dessinerCompte(){
  ctx.fillStyle = "rgba(6,9,20,.5)";
  ctx.fillRect(0, 0, cv.width, cv.height);
  const n = Math.ceil(compte);
  const k = 12;
  pfDraw(cv.width/2, 280, String(n), "#ffffff", k, 0, 1);
  pfDraw(cv.width/2, 360, "PREPARE TON RESERVOIR !", "#ffd45a", 1, 0);
}

/* ── écran FIN : podium + confetti + résultats pixel ── */
function dessinerFin(){
  const fade = Math.min(1, (performance.now() - finT0)/600);
  ctx.fillStyle = "rgba(6,9,20," + (0.9*fade) + ")";
  ctx.fillRect(0, 0, cv.width, cv.height);
  dessinerConfetti();
  pfDraw(cv.width/2, 90, "MANCHE TERMINEE !", "#ffd45a", 3, 0, 1);
  /* PODIUM : classement par cases nettoyées (TOI + bots) */
  const scores = [
    { nom: "TOI",        cases: joueur.nettoyees, coul: "#4fc3f7", mode: joueur.mode },
    { nom: "MOPZILLA",   cases: ia.nettoyees,     coul: "#ff7043", mode: ia.mode },
    { nom: "PROPRETAIN", cases: bot2.nettoyees,   coul: "#66bb6a", mode: bot2.mode },
  ];
  scores.sort((a,b)=> b.cases - a.cases);
  const podium = [
    { h: 56, x: cv.width/2,      c: "#ffd45a" },
    { h: 38, x: cv.width/2-130,  c: "#8fa0b8" },
    { h: 22, x: cv.width/2+130,  c: "#c77b3f" },
  ];
  const baseY = 300;
  podium.forEach((p, i)=>{
    /* marche du podium en 3D pixel : face claire + face sombre */
    const w = 96;
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - w/2, baseY - p.h, w, p.h);
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(p.x - w/2, baseY - p.h, w, 4);
    ctx.fillStyle = "rgba(0,0,0,.30)";
    ctx.fillRect(p.x - w/2, baseY - 6, w, 6);
    /* numéro (1/2/3) sur le bloc */
    pfDraw(p.x, baseY - p.h/2, String(i+1), "#1a1e2c", 2, 0);
    /* machine gagnante miniature sur la 1re marche, danse (rotation) */
    const sc = scores[i];
    ctx.save();
    ctx.translate(p.x, baseY - p.h - 30);
    const teinte = sc.coul;
    const clefC = teinte + "|" + (sc.mode === MODE_PUSHED ? "P" : "A");
    if (!SPR_MACHINE[clefC]) SPR_MACHINE[clefC] = prerenderMachine(teinte, sc.mode === MODE_PUSHED);
    const t2 = performance.now()/1000;
    if (i === 0){ ctx.rotate(Math.sin(t2*6)*0.12); ctx.scale(0.6 + Math.sin(t2*3)*0.05, 0.6); }
    else ctx.scale(0.5, 0.5);
    ctx.drawImage(SPR_MACHINE[clefC][0], -46, -46);
    ctx.restore();
    /* nom + score */
    pfDraw(p.x, baseY - p.h - 66, sc.nom, sc.coul, 1, 0);
    pfDraw(p.x, baseY - p.h - 52, sc.cases + " CASES", "#cfe3ff", 1, 0);
  });
  /* ligne du sol du podium */
  ctx.fillStyle = "#2a3550";
  ctx.fillRect(podium[1].x - 96/2 - 40, baseY + 2, 2*(96+130), 3);
  /* SURFACE + cœurs, avec compteur ease-out */
  const lignes = [
    "SURFACE NETTOYEE : " + finPct + " %",
    "COEURS DE LOUTRE : " + (joueur ? joueur.coeurs : 0) + " / " + COEURS_MAX,
    "LES SPECS VIVENT, LES LOUTRES AUSSI.",
  ];
  lignes.forEach((t,i)=> pfDraw(cv.width/2, 338 + i*26, t, "#cfe3ff", 2, 0));
  const pulse = ((performance.now()/450)|0)%2;
  pfDraw(cv.width/2, 448, "ENTREE : REJOUER - R : CHOISIR UN AUTRE MODE",
    pulse ? "#7dffa0" : "#3fa95c", 2, 0);
}
let finT0 = 0, finPct = 0;

/* écran générique (fallback éventuel) */
function ecranTexte(titre, lignes, sousTitre, couleur){
  ctx.fillStyle = "rgba(6,9,20,.88)";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textAlign = "center";
  ctx.fillStyle = couleur || "#ffd45a";
  ctx.font = "bold 36px monospace";
  ctx.fillText(titre, cv.width/2, 210);
  ctx.font = "15px monospace";
  ctx.fillStyle = "#cfe3ff";
  lignes.forEach((t,i)=>ctx.fillText(t, cv.width/2, 265 + i*24));
  if (sousTitre){
    ctx.fillStyle = "#7dffa0";
    ctx.font = "bold 16px monospace";
    ctx.fillText(sousTitre, cv.width/2, 265 + lignes.length*24 + 14);
  }
  ctx.textAlign = "left";
}

/* ---------------------- 12. RENDU PRINCIPAL ---------------------- */
function dessiner(){
  ctx.fillStyle = "#0b0d16";
  ctx.fillRect(0, 0, cv.width, cv.height);

  /* v0.3 : screen shake — le monde tremble, pas le HUD (ctx.save/restore) */
  ctx.save();
  ctx.translate(Math.round(shake.x), Math.round(shake.y));

  /* tuiles : sol, saleté, traînée, murs, fontaine */
  for (let l=0;l<LIGNES;l++){
    for (let c=0;c<COLONNES;c++){
      const x = MARGE_X + c*TUILE, y = MARGE_Y + l*TUILE;
      const t = grille[l][c];
      if (t === T_MUR){ dessinerMur(x, y); continue; }
      dessinerSol(x, y, c, l);
      if (t === T_FONTAINE){ dessinerFontaine(x, y); continue; }
      if (propre[l][c] === 1) dessinerTrainee(c, l, x, y);
      else tacheSale(c, l, x, y);
      if (propre[l][c] === 1) dessinerBrillanceSol(x, y, c, l);
    }
  }
  for (const p of panneaux) dessinerPanneau(p);

  /* entités triées par y */
  const ents = [...loutres, joueur, ia, ...(bot2?[bot2]:[])].sort((a,b)=>a.y-b.y);
  for (const e of ents){
    if (e === joueur || e === ia) dessinerMachine(e);
    else dessinerLoutre(e);
  }

  /* v0.3 : particules de juice (savon, gouttes, étoiles, flash) */
  drParticules();

  /* fin du monde secoué */
  ctx.restore();

  dessinerHUD();

  if (etat === "titre"){
    ecranTitre();
  } else if (etat === "choixMode"){
    dessinerChoixMode();
  } else if (etat === "compte"){
    dessinerCompte();
  } else if (etat === "fin"){
    dessinerFin();
  }
}

/* ---------------------- 13. BOUCLE requestAnimationFrame ---------------------- */
/* Logique à pas fixe 60 Hz, affichage vsync : le proto tourne à 60 fps. */
let dernierT = performance.now(), accum = 0;
/* le screen shake et les particules vivent à l'affichage, hors logique fixe */

function boucle(temps){
  requestAnimationFrame(boucle);
  let dt = (temps - dernierT)/1000;
  dernierT = temps;
  if (dt > 0.25) dt = 0.25;          // onglet en arrière-plan

  if (etat === "course"){
    accum += dt;
    while (accum >= CADRE){
      update(CADRE);
      accum -= CADRE;
      if (etat !== "course") { accum = 0; break; }
    }
  } else if (etat === "compte"){
    const avant = Math.ceil(compte);
    compte -= dt;
    if (Math.ceil(compte) !== avant && compte > 0) sonKlaxon();
    if (compte <= 0){ etat = "course"; compte = 0; dernierT = performance.now(); }
  } else if (etat === "titre"){
    /* v0.2 : n'importe quelle touche → écran de choix de mode (via etatEntrees) */
    if (etatEntrees === "choixMode") etat = "choixMode";
  } else if (etat === "choixMode"){
    if (etatEntrees === "course"){
      demarrerManche();                        // Entrée : mode validé → on lance
      dernierT = performance.now();
      accum = 0;
    }
  } else if (etat === "fin"){
    /* v0.2 : R = retour à l'écran de choix de mode (nouveau choix avant rejouer) */
    if (etatEntrees === "choixMode") etat = "choixMode";
  }

  /* v0.3 : maj des particules/shake/confetti à chaque frame affichée */
  upShake(dt);
  upParticules(dt);
  upConfetti(dt);
  dessiner();
}

/* ---------------------- 14. DÉMARRAGE ---------------------- */
creerArene();
creerPanneaux();
placerLoutres();
/* v0.2 : les machines ne sont créées qu'au lancement de la manche (le mode
   du joueur est choisi à l'écran de sélection). On crée des stubs pour que
   dessiner() fonctionne avant la première manche. */
joueur = creerMachine(1, 1, "#4fc3f7", "TOI", false, DEFAUT_MODE);
ia     = creerMachine(13, 11, "#ff7043", "MOPZILLA", true, MODE_PUSHED);
bot2   = creerMachine(13, 1, "#66bb6a", "PROPRETAIN", true, MODE_AUTO);
BOTS.push(ia, bot2);
laya = new BotBrain();
requestAnimationFrame(boucle);
