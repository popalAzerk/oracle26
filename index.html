<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta http-equiv="Cache-Control" content="no-cache">
<title>popalazerk — nouveau projet bientôt</title>
<style>
  :root{--bg:#f5f5f7;--tx:#1d1d1f;--tx2:#6e6e73;--ac:#0071e3}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--tx:#f5f5f7;--tx2:#a1a1a6;--ac:#2997ff}}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{display:grid;place-items:center;min-height:100svh;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));
    background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-align:center}
  main{max-width:640px}
  .marque{font-size:clamp(15px,2.2vw,17px);font-weight:600;letter-spacing:.02em;color:var(--tx2)}
  h1{margin-top:14px;font-size:clamp(40px,8vw,72px);line-height:1.05;font-weight:700;letter-spacing:-.025em}
  p{margin-top:18px;font-size:clamp(17px,2.4vw,21px);line-height:1.45;color:var(--tx2)}
  .point{display:inline-block;width:.18em;height:.18em;border-radius:50%;background:var(--ac);margin-left:.06em;vertical-align:.08em;
    animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.point{animation:none}}
</style>
</head>
<body>
<main>
  <div class="marque">popalazerk</div>
  <h1>Nouveau projet bientôt<span class="point" aria-hidden="true"></span></h1>
  <p>Un nouveau chantier est en préparation. Revenez dans quelques jours.</p>
</main>
</body>
</html>
