<!DOCTYPE html>
<!-- ============================================================
     MOB RACER — PROTO v0.1 (Phase 1)
     Jeu 8-bit : des machines à laver le sol s'affrontent.
     Fichier unique, zéro dépendance, tout inline (CSS + JS).
     Canvas 2D · arène 15×13 vue du dessus façon Bomberman.
     SONS : Web Audio pur (synthèse, zéro fichier externe).
     ============================================================ -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>🐴 MOB RACER — Proto v0.1</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #0b0d16;
    color: #cfe3ff; font-family: monospace;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh;
  }
  body { overflow: hidden; }
  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #2a3550;
    box-shadow: 0 0 40px rgba(80,150,255,.15);
  }
  #aide { color: #6d7a99; font-size: 12px; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<canvas id="jeu" width="720" height="668"></canvas>
<div id="aide">
  <b>Flèches / WASD</b> : bouger · <b>R</b> rejouer · <b>M</b> son on/off
</div>

<script>
"use strict";
/* ================================================================
   MOB RACER — PHASE 1 : proto jouable
   1 machine humaine + 1 IA simple + 2 loutres câlines.
   Boucle requestAnimationFrame, logique à pas fixe (60 Hz).
   ================================================================ */

/* ---------------------- 1. CONSTANTES ---------------------- */
const COLONNES = 15, LIGNES = 13;      // grille Bomberman 15×13
const TUILE = 44;                      // taille pixel d'une tuile
const MARGE_X = (720 - COLONNES*TUILE)/2;   // centrage horizontal
const MARGE_Y = 26;                          // espace HUD en haut

const CHRONO_MANCHE = 75;              // chrono 75 secondes
const RECHARGE_FONTAINE = 3.0;         // recharge : 3 s sur la borne
const DUREE_CALIN = 2.0;               // câlin de loutre : 2 s
const COEURS_MAX = 3;                  // Cœur de Loutre cumulable ×3
const COUT_EAU = 0.07;                 // perte d'eau par case nettoyée
const RESERVOIR_MAX = 1.0;
const VITESSE_JOUEUR = 110;            // px/s
const VITESSE_IA = 84;                 // px/s
const VITESSE_LOUTRE = 26;             // les loutres flânent
const CADRE = 1/60;                    // pas logique fixe

/* tuiles */
const T_SOL = 0, T_FONTAINE = 1, T_MUR = 2;
/* sols */
const SOL_LINO = 0, SOL_CARRELAGE = 1;

/* ---------------------- 2. CANVAS + AUDIO ---------------------- */
const cv = document.getElementById("jeu");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

/* Web Audio : créé au premier geste utilisateur (autoplay policy) */
let AC = null, sonActif = true;
function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch(e) { AC = null; }
}
document.addEventListener("keydown", initAudio, { once:true });
document.addEventListener("mousedown", initAudio, { once:true });

/* bleep 8-bit générique : waveform, glissando f0→f1, durée, volume */
function bip(type, f0, f1, dur, vol){
  if (!AC || !sonActif) return;
  const t0 = AC.currentTime;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(f1,1), t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(g); g.connect(AC.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sonTick(){ bip("square", 200, 170, 0.04, 0.03); }        // déplacement
function sonPlop(){ bip("sine", 300, 640, 0.1, 0.15);             // case nettoyée
                    bip("square", 180, 110, 0.07, 0.05); }
let dernierGlou = 0;
function sonGlou(){                                               // recharge glouglou
  const t = performance.now();
  if (t - dernierGlou < 200) return;
  dernierGlou = t;
  bip("sine", 150, 520, 0.12, 0.09);
}
function sonCalin(){                                              // jingle câlin loutre
  if (!AC || !sonActif) return;
  [523, 659, 784, 1046].forEach((f,i)=> setTimeout(()=>bip("triangle", f, f*1.01, 0.15, 0.12), i*100));
}
function sonBuzzer(){                                             // buzzer fin de manche
  if (!AC || !sonActif) return;
  for (let i=0;i<3;i++) setTimeout(()=>bip("sawtooth", 150, 110, 0.3, 0.15), i*220);
}
function sonKlaxon(){ bip("square", 440, 660, 0.18, 0.13); }      // compte à rebours

/* ---------------------- 3. ENTRÉES CLAVIER ---------------------- */
const touches = {};
window.addEventListener("keydown", e => {
  touches[e.code] = true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyM") sonActif = !sonActif;
});
window.addEventListener("keyup", e => { touches[e.code] = false; });

/* ---------------------- 4. ARÈNE 15×13 ---------------------- */
/* Grille façon Bomberman : murs indestructibles en bordure + quelques
   empilements de chaises. Borne fontaine = 3 cases au centre. */
let grille, solType, propre, fontaines = [];
let panneaux = [], loutres = [];
let joueur = null, ia = null, bot2 = null;
const BOTS = [];                            // machines 2 et 3 (décisions LAYA)
let tempsRestant = CHRONO_MANCHE, etat = "titre";
let compte = 3.99;

function creerArene(){
  grille = []; solType = []; propre = []; fontaines = [];
  for (let l=0; l<LIGNES; l++){
    grille[l]=[]; solType[l]=[]; propre[l]=[];
    for (let c=0; c<COLONNES; c++){
      const bord = (l===0 || c===0 || l===LIGNES-1 || c===COLONNES-1);
      grille[l][c] = bord ? T_MUR : T_SOL;
      /* carrelage en colonnes près des murs gauche/droit (la "cantinière"),
         lino (terrain neutre) partout ailleurs */
      solType[l][c] = (c>=1 && c<=3 || c>=11 && c<=13) && !bord ? SOL_CARRELAGE : SOL_LINO;
      propre[l][c] = 0;      // 0 = sale
    }
  }
  /* quelques murs indestructibles (empilements de chaises) */
  const murs = [[3,3],[6,3],[9,3],[3,6],[11,6],[4,9],[8,9],[11,9],[7,5]];
  for (const [c,l] of murs) grille[l][c] = T_MUR;
  /* la borne fontaine : 3 cases au centre */
  grille[6][7] = T_FONTAINE;
  fontaines.push({c:7, l:6});
}

/* panneaux « attention ça glisse » : derrière eux, on dérape */
function creerPanneaux(){
  panneaux = [];
  const spots = [[5,2],[9,10],[2,8]];
  for (const [c,l] of spots){
    if (grille[l][c] === T_SOL) panneaux.push({c, l, renverse:false, timer:0});
  }
}

/* ---------------------- 5. ENTITÉS ---------------------- */
function creerMachine(col, ligne, couleur, nom, estIA){
  return {
    x: col*TUILE + TUILE/2 + MARGE_X,
    y: ligne*TUILE + TUILE/2 + MARGE_Y,
    couleur, nom, estIA,
    reservoir: RESERVOIR_MAX,
    rechargeTimer: 0,          // progression de la recharge (0..3 s)
    coeurs: 0,                 // Cœurs de Loutre
    calin: 0,                  // Immobilisé : en plein câlin
    nettoyees: 0,
    dir: {x:0, y:1},           // direction de la serpillière
    drift: 0,                  // dérive restante sur zone glissante (s)
    dx: 0, dy: 0,              // direction voulue cette frame (IA)
    cible: null,               // cible IA
  };
}

/* la loutre : lentement déambulante, tout mignonne */
function creerLoutre(col, ligne){
  return {
    x: col*TUILE + TUILE/2 + MARGE_X,
    y: ligne*TUILE + TUILE/2 + MARGE_Y,
    dirX: 1, dirY: 0,
    tempsDir: 1.5,
    calin: 0,
  };
}

function placerLoutres(){
  loutres = [creerLoutre(2,10), creerLoutre(12,2)];
}

function demarrerManche(){
  creerArene();
  creerPanneaux();
  placerLoutres();
  /* Machine 1 : le joueur humain. Machines 2 et 3 : bots pilotés par LAYA. */
  joueur = creerMachine(1, 1, "#4fc3f7", "TOI", false);
  ia     = creerMachine(13, 11, "#ff7043", "MOPZILLA", true);
  bot2   = creerMachine(13, 1, "#66bb6a", "PROPRETAIN", true);
  BOTS.length = 0;
  BOTS.push(ia, bot2);
  if (!laya) laya = new BotBrain();     // (ré)initialise le cerveau LAYA à chaque manche
  tempsRestant = CHRONO_MANCHE;
  etat = "compte"; compte = 3.99;
  dernierGlou = 0;
}

/* ---------------------- 6. PHYSIQUE + NETTOYAGE ---------------------- */
function caseDe(px, py){
  return {
    c: Math.floor((px - MARGE_X)/TUILE),
    l: Math.floor((py - MARGE_Y)/TUILE),
  };
}
/* collision : position dans un mur / fontaine ? */
function dansMur(px, py){
  const {c,l} = caseDe(px,py);
  if (c<0||l<0||c>=COLONNES||l>=LIGNES) return true;
  return grille[l][c] !== T_SOL;
}

/* déplacement fluide avec collisions 4 côtés (séparation des axes) */
function bougerMachine(m, dx, dy, dt){
  if (m.calin > 0){ m.calin -= dt; return; }         // câlin en cours : immobile
  const v = (m.estIA ? VITESSE_IA : VITESSE_JOUEUR);
  const sp = (dx||dy) ? v : 0;
  if (dx||dy){
    const n = Math.hypot(dx,dy)||1;
    m.dir = {x:dx/n, y:dy/n};
  }
  const px = m.x + m.dir.x*sp*dt;
  const py = m.y + m.dir.y*sp*dt;
  const R = 13;                                       // rayon de collision
  if (sp){
    if (!dansMur(px - R, m.y - R) && !dansMur(px + R, m.y - R) &&
        !dansMur(px - R, m.y + R) && !dansMur(px + R, m.y + R)) m.x = px;
    if (!dansMur(m.x - R, py - R) && !dansMur(m.x + R, py - R) &&
        !dansMur(m.x - R, py + R) && !dansMur(m.x + R, py + R)) m.y = py;
  }
}

function nettoyerCase(m){
  const {c,l} = caseDe(m.x, m.y);
  if (c<1||l<1||c>=COLONNES-1||l>=LIGNES-1) return;
  if (grille[l][c] !== T_SOL || propre[l][c] !== 0) return;
  if (m.reservoir <= 0) return;                    // plus d'eau : plus de savon
  /* le carrelage (sol glissant) nettoie DUO : la case + la voisine derrière */
  propre[l][c] = 1;
  m.nettoyees++;
  m.reservoir = Math.max(0, m.reservoir - COUT_EAU);
  sonPlop();
  /* traînée large sur carrelage : la case juste derrière la machine */
  if (solType[l][c] === SOL_CARRELAGE){
    const c2 = c - Math.round(m.dir.x), l2 = l - Math.round(m.dir.y);
    if (c2>=1 && l2>=1 && c2<COLONNES-1 && l2<LIGNES-1 &&
        grille[l2][c2] === T_SOL && propre[l2][c2] === 0){
      propre[l2][c2] = 1; m.nettoyees++;
      m.reservoir = Math.max(0, m.reservoir - COUT_EAU);
    }
  }
}

/* ---------------------- 7. FONTAINE + LOUTRES + IA ---------------------- */
function updateFontaine(m, dt){
  const {c,l} = caseDe(m.x, m.y);
  let surFontaine = false;
  for (const f of fontaines){
    if (c===f.c && l===f.l){ surFontaine = true; break; }
    /* le halo de la fontaine : les 4 cases adjacentes déclenchent aussi la recharge
       (le mur central bloque, on tolère le contact) */
    if (Math.abs(c - f.c) + Math.abs(l - f.l) === 1){ surFontaine = true; break; }
  }
  if (surFontaine && m.reservoir < RESERVOIR_MAX && m.calin <= 0){
    const avant = m.rechargeTimer;
    m.rechargeTimer += dt;
    if ((avant|0) !== (m.rechargeTimer|0) || (avant === 0)) sonGlou();
    if (m.rechargeTimer >= RECHARGE_FONTAINE){
      m.reservoir = RESERVOIR_MAX;
      m.rechargeTimer = 0;
      bip("sine", 700, 900, 0.2, 0.12);         // "plein !"
    }
  } else {
    m.rechargeTimer = 0;
  }
}

/* les loutres déambulent lentement ; collision = câlin 2 s ; +1 Cœur */
function updateLoutre(o, dt){
  if (o.calin > 0){
    o.calin -= dt;
    /* pendant le câlin, la loutre reste près du joueur */
    if (o.calin <= 0){ o.calin = 0; o.tempsDir = 0; }
    return;
  }
  o.tempsDir -= dt;
  if (o.tempsDir <= 0){
    if (Math.random() < 0.65){
      const d = [[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0];
      o.dirX = d[0]; o.dirY = d[1];
    }
    o.tempsDir = 1.5 + Math.random()*2.5;
  }
  const nx = o.x + o.dirX*VITESSE_LOUTRE*dt;
  const ny = o.y + o.dirY*VITESSE_LOUTRE*dt;
  if (!dansMur(nx + o.dirX*10, o.y + o.dirY*10)) o.x = nx; else o.tempsDir = 0;
  if (!dansMur(o.x + o.dirX*10, ny + o.dirY*10)) o.y = ny; else o.tempsDir = 0;

  /* câlin : collision proche du joueur */
  if (joueur && joueur.calin <= 0){
    const d = Math.hypot(joueur.x - o.x, joueur.y - o.y);
    if (d < 26){
      joueur.calin = DUREE_CALIN;
      o.calin = DUREE_CALIN;
      if (joueur.coeurs < COEURS_MAX) joueur.coeurs++;
      sonCalin();
    }
  }
}

/* dérive sur la case du panneau « attention ça glisse » : glisse ~1,5 s */
function appliquerDrift(m, dt){
  const {c,l} = caseDe(m.x, m.y);
  for (const p of panneaux){
    if (p.c === c && p.l === l && !p.renverse){
      /* le panneau se fait renverser : la zone reste glissante 5 s */
      p.renverse = true; p.timer = 5.0;
      m.drift = 1.5;          // 1,5 s de drift non maîtrisable
    }
  }
  if (m.drift > 0) m.drift -= dt;
}

/* ================================================================
   // LAYA BOT BRAIN — moteur de décision type System-1
   Toutes les ~1,5 s chaque bot interroge le service LAYA hébergé
   sur le NAS (http://192.168.1.60:8765/bot). Contrat FIGÉ :
     envoi  : {"water_low":bool,"nearest_dirty_dist":int,"near_otters":int,"rank":int,"in_drift_zone":bool}
     retour : {"choice":"go_fountain"|"chase_dirty"|"contest"|"grab_otter"}
   Timeout 400 ms (AbortController). À l'échec → FALLBACK local
   (heuristique if/else, mêmes 4 actions) + badge « Laya hors ligne ».
   ================================================================ */
const LAYA_URL  = "http://192.168.1.60:8765/bot";
const LAYA_TIMEOUT = 400;        // ms
let layaHorsLigne = false;       // false → LAYA répond ; true → fallback actif

class BotBrain {
  constructor(){
    this.botTimer = 0;           // fenêtre de 1,5 s entre deux décisions
    this.decisionPending = false;
    this.fenetre = {};           // direction/choix courant appliqué par bot
    for (const b of BOTS) this.fenetre[b.nom] = null;
    this.dejaLog = false;
  }
  /* ---- état au format du contrat LAYA ---- */
  etatPourBot(bot){
    return {
      water_low: bot.reservoir < 0.15,
      nearest_dirty_dist: plusProcheCaseSale(bot),
      near_otters: nbLoutresProches(bot),
      rank: rangBot(bot),
      in_drift_zone: this.zoneDrift(bot),
    };
  }
  zoneDrift(bot){
    const {c,l} = caseDe(bot.x, bot.y);
    return panneaux.some(p => p.c===c && p.l===l);
  }
  /* ---- décision : LAYA (distant) ou heuristique (fallback) ---- */
  decider(bot){
    const etatBot = this.etatPourBot(bot);
    /* --- FALLBACK local (serveur absent ou échec précédent) --- */
    if (layaHorsLigne){
      this.appliquer(bot, this.heuristique(etatBot));
      return;
    }
    /* On applique D'ABORD l'heuristique : si LAYA répond à temps, elle
       ÉCRASE cette décision dans la même fenêtre (aucune frame perdue).
       Un serveur absent → aucun trou de gameplay. */
    this.appliquer(bot, this.heuristique(etatBot));
    /* --- Appel LAYA, timeout 400 ms, jamais bloquant --- */
    this.decisionPending = true;
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), LAYA_TIMEOUT);
    fetch(LAYA_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(etatBot),
      signal: ctrl.signal,
    })
      .then(r => r.ok ? r.json() : Promise.reject("http " + r.status))
      .then(data => {
        clearTimeout(to);
        /* LAYA a répondu : sa décision remplace l'heuristique de la fenêtre */
        layaHorsLigne = false;
        this.appliquer(bot, this.valider(data));
      })
      .catch(() => {
        clearTimeout(to);
        /* bascule automatique : les décisions suivantes iront en heuristique pure */
        layaHorsLigne = true;
        /* l'heuristique déjà appliquée ce tick reste valable : rien à refaire */
      })
      .finally(() => { this.decisionPending = false; });
  }
  /* le contrat est strict : un choice hors des 4 verbes tombe en fallback */
  valider(data){
    const CHOIX = ["go_fountain","chase_dirty","contest","grab_otter"];
    if (data && CHOIX.includes(data.choice)) return data.choice;
    return null;
  }
  /* heuristique locale = miroir simplifié de LAYA (les 4 mêmes actions) */
  heuristique(s){
    if (s.water_low)                  return "go_fountain";
    if (s.near_otters > 0 && s.rank <= 2) return "grab_otter";
    if (s.nearest_dirty_dist <= 3)    return "chase_dirty";
    return s.rank === 1 ? "chase_dirty" : "contest";
  }
  /* la décision est APPLIQUÉE pendant toute la fenêtre suivante (1,5 s) */
  appliquer(bot, choice){
    if (!choice) return;
    this.fenetre[bot.nom] = { choice, expire: 1.5 };
  }
  /* toutes les 1,5 s : nouvelle décision pour chaque bot */
  update(dt){
    this.botTimer -= dt;
    if (this.botTimer <= 0 && !this.decisionPending){
      this.botTimer = 1.5;
      for (const b of BOTS) this.decider(b);
    }
    /* les fenêtres expirent */
    for (const b of BOTS){
      const f = this.fenetre[b.nom];
      if (f){ f.expire -= dt; if (f.expire <= 0) this.fenetre[b.nom] = null; }
    }
  }
}

/* ---- helpers d'état utilisés par le contrat LAYA ---- */
function plusProcheCaseSale(bot){
  const {c:l0, l} = caseDe(bot.x, bot.y);
  let best = Infinity;
  for (let i=0;i<26;i++){
    const c = 1 + ((Math.random()*(COLONNES-2))|0);
    const ll = 1 + ((Math.random()*(LIGNES-2))|0);
    if (grille[ll][c] !== T_SOL || propre[ll][c] !== 0) continue;
    const d = Math.abs(c-l0) + Math.abs(ll-l);
    if (d < best) best = d;
  }
  return best === Infinity ? 99 : best;
}
function nbLoutresProches(bot){
  return loutres.filter(o => Math.hypot(o.x-bot.x, o.y-bot.y) < 3*TUILE).length;
}
function rangBot(bot){
  /* rang du bot dans la course (1 = plus de cases nettoyées) */
  let scores = [];
  for (const m of [joueur, ...BOTS]){
    const cases = m.nettoyees;
    const nom = m.nom;
    scores.push({nom, cases});
  }
  scores.sort((a,b)=>b.cases-a.cases);
  return scores.findIndex(s => s.nom === bot.nom) + 1;
}

let laya = null;   // instance unique du cerveau, créée à demarrerManche()

/* l'IA vise son objectif selon la décision LAYA (ou fallback) en cours */
function updateIA(m, dt){
  m.dx = 0; m.dy = 0;          // delta de la frame, appliqué par updateMach
  if (m.calin > 0) return;
  if (m.drift > 0){
    m.dx = m.dir.x >= 0.5 ? 1 : m.dir.x <= -0.5 ? -1 : 0;
    m.dy = m.dir.y >= 0.5 ? 1 : m.dir.y <= -0.5 ? -1 : 0;
    return;
  }
  /* décision LAYA active pour cette fenêtre ? sinon heuristique immédiate */
  let choice = laya && laya.fenetre[m.nom] ? laya.fenetre[m.nom].choice : null;
  if (!choice){
    /* pas encore de décision (démarrage) → heuristique locale instantanée */
    choice = laya ? laya.heuristique(laya.etatPourBot(m)) : "chase_dirty";
  }
  switch (choice){
    case "go_fountain": {
      /* foncer vers la borne fontaine centrale */
      m.cible = {c: fontaines[0].c, l: fontaines[0].l};
      break;
    }
    case "grab_otter": {
      /* foncer vers la loutre la plus proche (câlin volontaire !) */
      let best = null, bd = Infinity;
      for (const o of loutres){
        const d = Math.hypot(o.x - m.x, o.y - m.y);
        if (d < bd){ bd = d; best = o; }
      }
      if (best){
        const oc = Math.round((best.x - MARGE_X - TUILE/2)/TUILE);
        const ol = Math.round((best.y - MARGE_Y - TUILE/2)/TUILE);
        m.cible = {c: Math.max(1, Math.min(COLONNES-2, oc)), l: Math.max(1, Math.min(LIGNES-2, ol))};
      }
      break;
    }
    case "contest": {
      /* couper la trace du joueur : viser la case propre la plus proche DE LUI */
      const {c: jc, l: jl} = caseDe(joueur.x, joueur.y);
      let best = null, bd = Infinity;
      for (let i=0; i<24; i++){
        const c = 1 + ((Math.random()*(COLONNES-2))|0);
        const l = 1 + ((Math.random()*(LIGNES-2))|0);
        if (grille[l][c] === T_MUR) continue;
        const d = Math.abs(c - jc) + Math.abs(l - jl);
        if (d < bd){ bd = d; best = {c, l}; }
      }
      m.cible = best || {c: 7, l: 6};
      break;
    }
    case "chase_dirty":
    default: {
      /* cible la case sale la plus proche */
      let best = null, bd = Infinity;
      for (let i=0; i<28; i++){
        const c = 1 + ((Math.random()*(COLONNES-2))|0);
        const l = 1 + ((Math.random()*(LIGNES-2))|0);
        if (grille[l][c] !== T_SOL || propre[l][c] !== 0) continue;
        const d = Math.abs(c*TUILE + MARGE_X - m.x) + Math.abs(l*TUILE + MARGE_Y - m.y);
        if (d < bd){ bd = d; best = {c, l}; }
      }
      /* rien trouvé de proche → échantillonner plus large (sinon la case courante) */
      if (!best){
        for (let l=1; l<LIGNES-1; l++) for (let c=1; c<COLONNES-1; c++){
          if (grille[l][c] !== T_SOL || propre[l][c] !== 0) continue;
          const d = Math.abs(c*TUILE + MARGE_X - m.x) + Math.abs(l*TUILE + MARGE_Y - m.y);
          if (d < bd){ bd = d; best = {c, l}; }
        }
      }
      m.cible = best || {c: 7, l: 6};
      break;
    }
  }
  /* reservoir bas FORCÉ pour go_fountain même si pas l'action LAYA */
  if (m.reservoir <= 0) m.cible = {c: fontaines[0].c, l: fontaines[0].l};

  if (!m.cible) return;
  /* chemin simple : axe le plus long d'abord ; si mur devant, essayer l'autre axe */
  const tx = m.cible.c*TUILE + TUILE/2 + MARGE_X;
  const ty = m.cible.l*TUILE + TUILE/2 + MARGE_Y;
  let dx = 0, dy = 0;
  if (Math.abs(tx - m.x) > 3) dx = Math.sign(tx - m.x);
  else if (Math.abs(ty - m.y) > 3) dy = Math.sign(ty - m.y);
  /* anti-blocage : si l'axe choisi est un mur, essayer l'autre axe */
  if (dx && dansMur(m.x + dx*16, m.y)){ dx = 0; dy = Math.sign(ty - m.y) || 1; }
  if (dy && dansMur(m.x, m.y + dy*16)){ dy = 0; dx = -(dx||Math.sign(tx-m.x)||1); }
  /* la direction est stockée : update() l'applique via updateMach */
  m.dx = dx; m.dy = dy;
}

/* ---------------------- 8. MISE À JOUR ---------------------- */
function updateMach(m, dx, dy, dt){
  appliquerDrift(m, dt);
  /* pendant le drift (1,5 s), zone « non maîtrisable » : l'input est ignoré,
     la machine garde son élan dans la direction où elle filait */
  if (m.drift > 0){
    dx = m.dir.x >= 0.5 ? 1 : m.dir.x <= -0.5 ? -1 : 0;
    dy = m.dir.y >= 0.5 ? 1 : m.dir.y <= -0.5 ? -1 : 0;
  }
  bougerMachine(m, dx, dy, dt);
  nettoyerCase(m);
  updateFontaine(m, dt);
}

function update(dt){
  /* machines */
  let dx=0, dy=0;
  if (touches.ArrowLeft  || touches.KeyA) dx = -1;
  if (touches.ArrowRight || touches.KeyD) dx =  1;
  if (touches.ArrowUp    || touches.KeyW) dy = -1;
  if (touches.ArrowDown  || touches.KeyS) dy =  1;
  if (dx && dy){ dy = 0; }            // pas de diagonale : esprit Bomberman
  const roulait = dx||dy;
  updateMach(joueur, dx, dy, dt);
  /* tick de déplacement : léger bleep périodique quand on roule */
  if (roulait){
    joueur.tick = (joueur.tick || 0) + dt;
    if (joueur.tick > 0.16){ sonTick(); joueur.tick = 0; }
  }
  /* — LAYA BOT BRAIN : ticking du cerveau (décisions toutes les 1,5 s) — */
  if (laya) laya.update(dt);

  /* bots 2 et 3 : décision puis mouvement via updateMach (comme le joueur) */
  updateIA(ia, dt);
  updateMach(ia, ia.dx, ia.dy, dt);
  if (bot2){
    updateIA(bot2, dt);
    updateMach(bot2, bot2.dx, bot2.dy, dt);
  }
  /* loutres */
  for (const o of loutres) updateLoutre(o, dt);
  /* panneaux renversés : se remettent debout après 5 s */
  for (const p of panneaux){
    if (p.renverse){ p.timer -= dt; if (p.timer <= 0) p.renverse = false; }
  }
  /* chrono */
  tempsRestant -= dt;
  if (tempsRestant <= 0){
    tempsRestant = 0;
    etat = "fin";
    sonBuzzer();
  }
}

/* ---------------------- 9. SPRITES PIXEL (dessinés par code) ---------------------- */
function dessinerSol(x, y, c, l){
  const dam = (c + l) % 2 === 0;
  const type = solType[l][c];
  if (type === SOL_CARRELAGE){
    ctx.fillStyle = dam ? "#7d8ba0" : "#8b99ad";
  } else {
    ctx.fillStyle = dam ? "#c8a878" : "#bd9c6e";
  }
  ctx.fillRect(x, y, TUILE, TUILE);
  ctx.strokeStyle = "rgba(0,0,0,.07)";
  ctx.strokeRect(x+.5, y+.5, TUILE-1, TUILE-1);
}

/* tache de saleté pseudo-aléatoire (déterministe par case) */
function tacheSale(c, l, x, y){
  let h = (c*73856093 ^ l*19349663) >>> 0;
  const rnd = n => { h = (h*1664525 + 1013904223) >>> 0; return (h % n)/n; };
  ctx.fillStyle = "rgba(80,52,28,.5)";
  ctx.fillRect(x + 6 + rnd(20), y + 8 + rnd(22), 7, 5);
  ctx.fillRect(x + 22 + rnd(12), y + 24 + rnd(10), 6, 4);
  ctx.fillStyle = "rgba(60,38,20,.4)";
  ctx.fillRect(x + 12 + rnd(18), y + 26 + rnd(8), 5, 4);
}

/* traînée propre : voile clair + reflet scintillant */
function dessinerTrainee(c, l, x, y){
  ctx.fillStyle = "rgba(245,252,255,.55)";
  ctx.fillRect(x, y, TUILE, TUILE);
  const sc = 0.5 + 0.5*Math.sin(performance.now()/300 + (c*13+l*7));
  ctx.fillStyle = "rgba(255,255,255," + (0.3 + sc*0.4) + ")";
  ctx.fillRect(x+6, y+6, 10, 3);
  ctx.fillRect(x+24, y+28, 8, 3);
}

/* mur : empilement de chaises / distributeur, style Bomberman */
function dessinerMur(x, y){
  ctx.fillStyle = "#5b6377";
  ctx.fillRect(x, y, TUILE, TUILE);
  ctx.fillStyle = "#4a5164";
  ctx.fillRect(x+2, y+2, TUILE-4, TUILE-4);
  /* deux chaises empilées */
  for (let i=0;i<2;i++){
    const cx = x+6, cy = y+5+i*18;
    ctx.fillStyle = "#8a7a54";
    ctx.fillRect(cx, cy, 18, 12);           // assise/dossier
    ctx.fillStyle = "#6e6042";
    ctx.fillRect(cx, cy+12, 18, 3);         // pied
    ctx.fillStyle = "#a3956b";
    ctx.fillRect(cx+2, cy+2, 14, 5);        // reflet
  }
}

/* borne fontaine : case rouge au robinet bleu */
function dessinerFontaine(x, y){
  ctx.fillStyle = "#29304a";
  ctx.fillRect(x, y, TUILE, TUILE);
  ctx.fillStyle = "#c0392b";
  ctx.fillRect(x+4, y+4, TUILE-8, TUILE-8);
  ctx.fillStyle = "#e74c3c";
  ctx.fillRect(x+7, y+7, TUILE-14, TUILE-14);
  /* robinet + goutte */
  ctx.fillStyle = "#3498db";
  ctx.fillRect(x+TUILE/2-3, y+10, 6, 10);
  ctx.fillStyle = "#bfe3ff";
  ctx.fillRect(x+TUILE/2-2, y+21, 4, 5);
  /* pulsation : halo quand la recharge est utile */
  const p = 0.25 + 0.15*Math.sin(performance.now()/400);
  ctx.strokeStyle = "rgba(80,180,255," + p + ")";
  ctx.lineWidth = 2;
  ctx.strokeRect(x+2, y+2, TUILE-4, TUILE-4);
}

/* panneau « ATTENTION ÇA GLISSE » : triangle rouge/blanc, se renverse */
function dessinerPanneau(p){
  const x = MARGE_X + p.c*TUILE, y = MARGE_Y + p.l*TUILE;
  ctx.save();
  if (p.renverse){
    ctx.translate(x+TUILE/2, y+TUILE/2); ctx.rotate(-Math.PI/2.2);
    ctx.translate(-(x+TUILE/2), -(y+TUILE/2));
  }
  ctx.fillStyle = "#f1c40f";
  ctx.strokeStyle = "#c0392b"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x+TUILE/2, y+6);
  ctx.lineTo(x+TUILE-5, y+TUILE-9);
  ctx.lineTo(x+5, y+TUILE-9);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  /* bonhomme qui glisse */
  ctx.fillStyle = "#2c3e50";
  ctx.fillRect(x+TUILE/2-9, y+14, 5, 5);            // tête
  ctx.fillRect(x+TUILE/2-6, y+19, 12, 3);           // corps penché
  ctx.fillRect(x+TUILE/2+6, y+21, 5, 2);            // bras tendu
  ctx.fillRect(x+TUILE/2-12, y+23, 6, 2);           // jambes glissantes
  ctx.restore();
}

/* la machine à laver : sprite pixel, serpillière derrière, jauge d'eau */
function dessinerMachine(m){
  const x = m.x, y = m.y;
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.fillRect(x-13, y+11, 26, 5);
  /* serpillière qui traîne derrière */
  const mx = x - m.dir.x*17, my = y - m.dir.y*17;
  ctx.strokeStyle = "#bfa77a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(mx, my); ctx.stroke();
  ctx.fillStyle = "#e8dcc0";
  ctx.fillRect(mx-4, my-3, 8, 6);
  /* corps */
  ctx.fillStyle = "#37474f";
  ctx.fillRect(x-13, y-11, 26, 22);
  ctx.fillStyle = m.couleur;
  ctx.fillRect(x-11, y-9, 22, 18);
  ctx.fillStyle = "#0d1117";                 // écran de contrôle
  ctx.fillRect(x-9, y-7, 10, 8);
  ctx.fillStyle = "#7dff9a";                 // LED
  if (m.reservoir > 0) ctx.fillRect(x-8+((performance.now()/300|0)%4)*2, y-6, 2, 2);
  /* roues */
  ctx.fillStyle = "#15181f";
  ctx.fillRect(x-13, y+8, 7, 6);
  ctx.fillRect(x+6, y+8, 7, 6);
  /* jauge d'eau */
  ctx.fillStyle = "#10202c";
  ctx.fillRect(x-11, y+3, 22, 4);
  ctx.fillStyle = m.reservoir < 0.15 ? "#e74c3c" : "#3fa9f5";
  ctx.fillRect(x-11, y+3, 22*m.reservoir/RESERVOIR_MAX, 4);
  /* cœurs de loutre au-dessus */
  for (let i=0;i<m.coeurs;i++) dessinerCoeur(x-11+i*9, y-21, 3);
  /* barre de recharge au-dessus de la machine */
  if (m.rechargeTimer > 0){
    ctx.fillStyle = "#10202c";
    ctx.fillRect(x-12, y-16, 24, 5);
    ctx.fillStyle = "#3fa9f5";
    ctx.fillRect(x-11, y-15, 22*(m.rechargeTimer/RECHARGE_FONTAINE), 3);
  }
  /* bulles de câlin */
  if (m.calin > 0){
    const b = Math.sin(performance.now()/110)*3;
    dessinerCoeur(x-5, y-30+b, 5);
    ctx.fillStyle = "rgba(255,255,255,.1)";
    ctx.fillRect(x-16, y-14, 32, 28);
  }
}

/* cœur pixel 8-bit */
function dessinerCoeur(x, y, s){
  ctx.fillStyle = "#e255a1";
  ctx.fillRect(x, y, s*2, s);
  ctx.fillRect(x - s, y + s, s*4, s);
  ctx.fillRect(x, y + s*2, s*2, s);
  ctx.fillRect(x + s - s/2, y + s*3, s, s);
  ctx.fillStyle = "#ffd0ea";               // reflet
  ctx.fillRect(x, y, s, s - s/2);
}

/* la loutre : corps brun, ventre beige, museau, queue */
function dessinerLoutre(o){
  const x = Math.round(o.x), y = Math.round(o.y);
  const g = o.dirX < 0;                    // regarde à gauche ?
  ctx.fillStyle = "rgba(0,0,0,.2)";
  ctx.fillRect(x-11, y+9, 22, 4);
  /* queue */
  ctx.fillStyle = "#5d4028";
  ctx.fillRect(g ? x+10 : x-14, y+4, 4, 3);
  /* corps */
  ctx.fillStyle = "#6d4c2f";
  ctx.fillRect(x-11, y-3, 22, 11);
  /* ventre */
  ctx.fillStyle = "#c9a86b";
  ctx.fillRect(g ? x-8 : x-4, y+2, 10, 5);
  /* tête */
  ctx.fillStyle = "#6d4c2f";
  ctx.fillRect(x-6, y-10, 12, 8);
  /* museau + moustaches */
  ctx.fillStyle = "#c9a86b";
  ctx.fillRect(g ? x-6 : x+2, y-6, 4, 4);
  ctx.strokeStyle = "#3a2a18"; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(g ? x-2 : x+2, y-4); ctx.lineTo(g ? x+4 : x-4, y-4+1); ctx.stroke();
  /* yeux + truffe */
  ctx.fillStyle = "#1a1208";
  ctx.fillRect(g ? x-5 : x+2, y-9, 2, 2);
  ctx.fillRect(x, y-7, 2, 2);
  /* petites pattes */
  ctx.fillStyle = "#5d4028";
  ctx.fillRect(x-8, y+7, 4, 3);
  ctx.fillRect(x+4, y+7, 4, 3);
  /* cœur quand elle a fini un câlin tout frais */
  if (o.calin > 0){
    const b = Math.sin(performance.now()/120)*3;
    dessinerCoeur(x-4, y-22+b, 4);
  }
}

/* ---------------------- 10. HUD ---------------------- */
function compterSolNettoyable(){
  let n = 0;
  for (let l=1;l<LIGNES-1;l++) for (let c=1;c<COLONNES-1;c++)
    if (grille[l][c] === T_SOL) n++;
  return n;
}
function pctNettoye(){
  let n = 0;
  for (let l=1;l<LIGNES-1;l++) for (let c=1;c<COLONNES-1;c++)
    if (grille[l][c] === T_SOL && propre[l][c] === 1) n++;
  const tot = compterSolNettoyable();
  return tot ? Math.round(100*n/tot) : 0;
}

function dessinerHUD(){
  ctx.textBaseline = "top";
  ctx.font = "bold 15px monospace";
  /* % nettoyé (joueur) */
  const pct = pctNettoye();
  ctx.fillStyle = "#8fa0b8";
  ctx.fillText("TOI", MARGE_X, 6);
  ctx.fillStyle = "#4fc3f7";
  ctx.fillText(pct + " %", MARGE_X + 40, 6);
  /* IA */
  /* IA (proto : score IA estimé sur ses cases frottées) */
  ctx.fillStyle = "#8fa0b8";
  ctx.fillText("MOPZILLA", 120, 6);
  ctx.fillStyle = "#ff7043";
  ctx.fillText(Math.round(100 * ia.nettoyees / Math.max(1, compterSolNettoyable())) + " %", 196, 6);
  /* chrono (gros, au centre) */
  ctx.fillStyle = tempsRestant < 10 ? "#e74c3c" : "#ffd45a";
  ctx.font = "bold 22px monospace";
  ctx.textAlign = "center";
  ctx.fillText(Math.ceil(tempsRestant) + " s", cv.width/2, 4);
  ctx.textAlign = "left";
  /* réservoir */
  ctx.font = "bold 15px monospace";
  ctx.fillStyle = "#8fa0b8";
  ctx.fillText("EAU", 470, 6);
  ctx.fillStyle = "#10202c";
  ctx.fillRect(502, 9, 80, 11);
  ctx.fillStyle = joueur.reservoir < 0.15 ? "#e74c3c" : "#3fa9f5";
  ctx.fillRect(503, 10, 78*joueur.reservoir/RESERVOIR_MAX, 9);
  /* cœurs de loutre */
  for (let i=0;i<COEURS_MAX;i++){
    const plein = i < joueur.coeurs;
    ctx.globalAlpha = plein ? 1 : 0.2;
    dessinerCoeur(600 + i*18, 8, 3);
    ctx.globalAlpha = 1;
  }
  /* badge discret si le service LAYA est injoignable */
  if (layaHorsLigne){
    ctx.font = "11px monospace";
    ctx.fillStyle = "#e8a33d";
    ctx.fillText("Laya hors ligne — IA locale", 645, 12);
    ctx.font = "bold 15px monospace";
  }
}

/* ---------------------- 11. ÉCRANS ---------------------- */
function ecranTexte(titre, lignes, sousTitre, couleur){
  ctx.fillStyle = "rgba(6,9,20,.88)";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.textAlign = "center";
  ctx.fillStyle = couleur || "#ffd45a";
  ctx.font = "bold 36px monospace";
  ctx.fillText(titre, cv.width/2, 210);
  ctx.font = "15px monospace";
  ctx.fillStyle = "#cfe3ff";
  lignes.forEach((t,i)=>ctx.fillText(t, cv.width/2, 265 + i*24));
  if (sousTitre){
    ctx.fillStyle = "#7dffa0";
    ctx.font = "bold 16px monospace";
    ctx.fillText(sousTitre, cv.width/2, 265 + lignes.length*24 + 14);
  }
  ctx.textAlign = "left";
}

/* ---------------------- 12. RENDU PRINCIPAL ---------------------- */
function dessiner(){
  ctx.fillStyle = "#0b0d16";
  ctx.fillRect(0, 0, cv.width, cv.height);

  /* tuiles : sol, saleté, traînée, murs, fontaine */
  for (let l=0;l<LIGNES;l++){
    for (let c=0;c<COLONNES;c++){
      const x = MARGE_X + c*TUILE, y = MARGE_Y + l*TUILE;
      const t = grille[l][c];
      if (t === T_MUR){ dessinerMur(x, y); continue; }
      dessinerSol(x, y, c, l);
      if (t === T_FONTAINE){ dessinerFontaine(x, y); continue; }
      if (propre[l][c] === 1) dessinerTrainee(c, l, x, y);
      else tacheSale(c, l, x, y);
    }
  }
  for (const p of panneaux) dessinerPanneau(p);

  /* entités triées par y */
  const ents = [...loutres, joueur, ia, ...(bot2?[bot2]:[])].sort((a,b)=>a.y-b.y);
  for (const e of ents){
    if (e === joueur || e === ia) dessinerMachine(e);
    else dessinerLoutre(e);
  }

  dessinerHUD();

  if (etat === "titre"){
    ecranTexte("🐴 MOB RACER — PROTO v0.1", [
      "Trace propre, recharge l'eau, câline les loutres.",
      "Une case ne se nettoie qu'UNE seule fois.",
      "Chrono 75 s. Le carrelage glisse : traînée double !",
      "Flèches / WASD : bouger · M : son"
    ], "APPUYE SUR UNE TOUCHE POUR LANCER");
  } else if (etat === "compte"){
    ctx.fillStyle = "rgba(6,9,20,.5)";
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.textAlign = "center";
    ctx.font = "bold 84px monospace";
    ctx.fillStyle = "#fff";
    ctx.fillText(String(Math.ceil(compte)), cv.width/2, 280);
    ctx.textAlign = "left";
  } else if (etat === "fin"){
    ecranTexte("MANCHE TERMINÉE !", [
      "Surface nettoyée : " + pctNettoye() + " %",
      "Cases frottées : " + (joueur ? joueur.nettoyees : 0),
      "MOPZILLA (bot) : " + (ia ? ia.nettoyees : 0) + " cases · PROPRETAIN (bot) : " + (bot2 ? bot2.nettoyees : 0) + " cases",
      "Cœurs de loutre : " + (joueur ? joueur.coeurs : 0) + " / 3",
      "Les specs vivent, les loutres aussi."
    ], "R : REJOUER");
  }
}

/* ---------------------- 13. BOUCLE requestAnimationFrame ---------------------- */
/* Logique à pas fixe 60 Hz, affichage vsync : le proto tourne à 60 fps. */
let dernierT = performance.now(), accum = 0;

function boucle(temps){
  requestAnimationFrame(boucle);
  let dt = (temps - dernierT)/1000;
  dernierT = temps;
  if (dt > 0.25) dt = 0.25;          // onglet en arrière-plan

  if (etat === "course"){
    accum += dt;
    while (accum >= CADRE){
      update(CADRE);
      accum -= CADRE;
      if (etat !== "course") { accum = 0; break; }
    }
  } else if (etat === "compte"){
    const avant = Math.ceil(compte);
    compte -= dt;
    if (Math.ceil(compte) !== avant && compte > 0) sonKlaxon();
    if (compte <= 0){ etat = "course"; compte = 0; dernierT = performance.now(); }
  } else if (etat === "titre"){
    if (Object.values(touches).some(Boolean)) demarrerManche();
  } else if (etat === "fin"){
    if (touches.KeyR) demarrerManche();
  }

  dessiner();
}

/* ---------------------- 14. DÉMARRAGE ---------------------- */
creerArene();
creerPanneaux();
placerLoutres();
joueur = creerMachine(1, 1, "#4fc3f7", "TOI", false);
ia     = creerMachine(13, 11, "#ff7043", "MOPZILLA", true);
bot2   = creerMachine(13, 1, "#66bb6a", "PROPRETAIN", true);
BOTS.push(ia, bot2);
laya = new BotBrain();
requestAnimationFrame(boucle);
