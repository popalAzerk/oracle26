}


/* matrice de Bayer 4x4 : tramage ordonné, celui des consoles 16-bit */
var BAYER_TEX=(function(){
  var M=[0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5];
  var c=document.createElement('canvas'); c.width=4; c.height=4;
  var g=c.getContext('2d');
  for(var y=0;y<4;y++) for(var x=0;x<4;x++){
    var v=Math.round(M[y*4+x]/16*255);
    g.fillStyle='rgb('+v+','+v+','+v+')'; g.fillRect(x,y,1,1);
  }
  var t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.REPEAT);
  return t;
})();

function drawBlit(){
  gl.uniform4f(U.grade,1,1,1,1);   /* blit : pas d'étalonnage */
  gl.uniform1f(U.outline, 1);      /* v1.8 : contour actif sur la passe finale */
  gl.uniform1f(U.quant, window.__noQuant ? 0 : 1);   /* v1.9 : palette 7 niveaux + trame Bayer */
  gl.uniform2f(U.texel, 1/GW, 1/GH);
  var id=ident();
  gl.uniformMatrix4fv(U.mvp,false,id);
  gl.uniformMatrix3fv(U.nmat,false,new Float32Array([1,0,0,0,1,0,0,0,1]));
  gl.uniform2f(U.uvScale,1,1);
  gl.uniform1f(U.useTex,1);
  gl.uniform1f(U.unlit,1);
  gl.uniform1f(U.emit,0);
  gl.uniform1f(U.alpha,1);
  gl.uniform3f(U.color,1,1,1);
  gl.uniform1f(U.vig,1);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, BAYER_TEX);
  gl.uniform1i(U.bayer, 1);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D,fbTex);
  bindMesh(QUAD_XY);
  gl.drawElements(gl.TRIANGLES,6,gl.UNSIGNED_SHORT,0);
}

/* ---------- 11. LOGIQUE ---------- */
var MOVE_TIME=0.135;
var DIRS=[[0,-1],[0,1],[1,0],[-1,0]]; // haut bas droite gauche

function startMove(m,di){
  if(m.stun>0) return false;
  var d=DIRS[di];
  var nx=m.gx+d[0], ny=m.gy+d[1];
  if(!canEnter(nx,ny,m)) return false;
  m.fx=m.gx; m.fy=m.gy;
  m.gx=nx;  m.gy=ny;
  m.dx=d[0]; m.dz=d[1]; m.dirIdx=di;
  m.angle=Math.atan2(d[0],d[1]);
  m.t=0; m.moving=true;
  /* v0.8 : savon x1,6 / colere de la grand-mere x0,5 */
  var sp=(m.soapT>0?SAVON_VITESSE_MUL:1)*(m.slowT>0?0.5:1)*(m.speedMul||1)*(m.rocketT>0?1.9:1);
  m.moveTime=MOVE_TIME/sp;
  if(m===player) beep(220,0.03,0.03);
  return true;
}

function stationAt(gx,gy){
  for(var i=0;i<LV.props.length;i++){
    var pr=LV.props[i];
    if(pr.gx===gx && pr.gy===gy && (pr.k==='recharge' || pr.k==='vidange')) return pr.k;
  }
  return null;
}
function applyStation(m){
  if(m!==player) return;
  var st=stationAt(m.gx,m.gy);
  if(!st) return;
  if(st==='recharge' && m.water<0.999){
    m.water=Math.min(1, m.water+0.35);
    burst(m.wx,m.wz,10,[0.5,1.1,1.9]);
    beep(760,0.08,0.04); beep(1040,0.07,0.03);
  } else if(st==='vidange' && m.dirt>0.01){
    score+=Math.round(m.dirt*10);            /* la crasse vidangée rapporte des points */
    m.dirt=0;
    burst(m.wx,m.wz,12,[1.6,0.9,0.35]);
    beep(320,0.10,0.05); beep(240,0.10,0.04);
  }
}

function arrive(m){
  var i=idxAt(m.gx,m.gy);
  applyStation(m);
  removeMarkAt(m.gx,m.gy);          /* v0.9 : la tache disparait avec la salete */
  if(cells[i]===3){
    /* NID DE DETRITUS — lavage 3x plus lent, compte double */
    detHits[i]++;
    if(detHits[i]>=DETRITUS_COEF){
      cells[i]=2; detW[i]=0; foamT[i]=FOAM_LIFE;
      removeNest(m.gx,m.gy);
      if(m===player) score+=DETRITUS_MULT; else botScore+=DETRITUS_MULT;
      burst(m.wx,m.wz,7,[0.5,0.42,0.30]);
      buildFloor(); recomputeCounts();
    } else {
      burst(m.wx,m.wz,3,[0.55,0.46,0.33]);
      if(m===player) beep(150,0.05,0.03);
    }
  } else if(cells[i]===0){
    /* v0.9 : une case sale peut demander 1 ou 2 passages (niveau 4) */
    /* v0.16 : le reservoir d'eau du joueur se vide à chaque case lavée.
       Réservoir vide = plus aucun lavage : il faut aller chercher une bonbonne. */
    if(m===player && player.water<=0){
      if(!waterWarn || timeNow()-waterWarn>1.2){ waterWarn=timeNow(); beep(120,0.10,0.05); }
      return;
    }
    if(m===player && player.dirt>=0.999){
      /* bac à crasse plein : il faut aller VIDANGER avant de pouvoir relaver */
      if(!dirtWarn || timeNow()-dirtWarn>1.2){ dirtWarn=timeNow(); beep(100,0.12,0.05); }
      return;
    }
    cleanHits[i]++;
    if(cleanHits[i]>=LV.passes){
      cleanHits[i]=0;
      if(m===player){
        cells[i]=2; foamT[i]=FOAM_LIFE; score++;
        player.water=Math.max(0, player.water - (player.rocketT>0?0.012:0.045));
        player.dirt=Math.min(1, player.dirt + 0.030);      /* v0.17 : bac à crasse */
      }
      else { cells[i]=4; foamT[i]=FOAM_LIFE; botScore++; }   /* v0.14 : trace verte */
      m._dirty=true;
      emitFoam(m);   /* v1.2 : gerbe de mousse a la brosse */
    } else {
      burst(m.wx,m.wz,3,[0.72,0.78,0.72]);   /* premier passage : la crasse part a moitie */
    }
    buildFloor();
    recomputeCounts();
  } else if(m===player && (cells[i]===1||cells[i]===4)){
    cells[i]=2; foamT[i]=FOAM_LIFE; buildFloor();   /* le joueur repasse en bleu sur du vert */
  } else if(m!==player && (cells[i]===1||cells[i]===2)){
    cells[i]=4; foamT[i]=FOAM_LIFE; buildFloor();   /* le bot repasse en vert */
  }
  if(dirtyLeft<=0 && mode==='play') mode='win';
}
function removeNest(gx,gy){
  for(var i=nests.length-1;i>=0;i--) if(nests[i].gx===gx&&nests[i].gy===gy) nests.splice(i,1);
}

function updatePickups(dt){
  /* respawn des bonbonnes d'eau */
  if(waters.length<EAU_BONBONNES){
    waterRespawn[0]-=dt;
    if(waterRespawn[0]<=0){
      var p=randFreeCell(2,player);
      if(p){ waters.push({gx:p[0],gy:p[1],t:0}); waterRespawn[0]=EAU_REAPPARITION; }
      else waterRespawn[0]=2.0;
    }
  }
  /* respawn de la fusée */
  if(rockets.length<FUSEE_NB){
    rocketRespawn[0]-=dt;
    if(rocketRespawn[0]<=0){
      var q=randFreeCell(3,bot);
      if(q){ rockets.push({gx:q[0],gy:q[1],t:0}); rocketRespawn[0]=FUSEE_REAPPARITION; }
      else rocketRespawn[0]=2.0;
    }
  }
  for(var i=0;i<waters.length;i++) waters[i].t+=dt;
  for(var j=0;j<rockets.length;j++) rockets[j].t+=dt;
  pickWaters(player); pickWaters(bot);
  pickRockets(player);
  /* la fusée s'éteint */
  if(player.rocketT>0){
    player.rocketT-=dt;
    if(player.rocketT<=0){ player.rocketT=0; beep(200,0.12,0.04); }
  }
}

function updateMachines(dt){
  var list=[player,bot];
  for(var i=0;i<2;i++){
    var m=list[i];
    /* rebond visuel amorti */
    if(m.kox||m.koz){
      var dd=Math.min(1,dt*7.5);
      m.kox-=m.kox*dd; m.koz-=m.koz*dd;
      if(Math.abs(m.kox)<0.002) m.kox=0;
      if(Math.abs(m.koz)<0.002) m.koz=0;
    }
    if(m.moving){
      m.t += dt/(m.moveTime||MOVE_TIME);
      if(m.t>=1){
        m.t=1; m.moving=false;
        arrive(m);
        var next = (m===player) ? player.queued : -1;
        if(m===player) player.queued=-1;
        if(m.stun>0){ next=-1; }
        if(next>=0){
          if(LV.ice && m===player && next!==m.dirIdx){
            /* PATINOIRE : pivot lent — la machine garde son cap 0,35 s */
            m.queued=next; m.pivotT=ICE_PIVOT;
          } else startMove(m,next);
        }
        else if(!LV.ice && m===player && heldDir>=0) startMove(m,heldDir);
        else if(m.soapT>0){ startMove(m,m.dirIdx); }        /* inertie du savon */
      }
      var e=m.t*m.t*(3-2*m.t);
      var ax=lerp(m.fx,m.gx,e), az=lerp(m.fy,m.gy,e);
      m.wx=ax-7; m.wz=az-6;
    } else {
      m.wx=m.gx-7; m.wz=m.gy-6;
      /* v0.9 : pivot differe de la patinoire */
      if(m.pivotT>0){
        m.pivotT-=dt;
        if(m.pivotT<=0 && m.queued>=0){
          var qd=m.queued; m.queued=-1;
          m.pivotT=0;
          startMove(m,qd);
        }
      } else if(m.iceCd>0){
        m.iceCd-=dt;
      }
      if(!m.moving && m.pivotT<=0){
        if(m.soapT>0 && m.stun<=0 && m===bot){ startMove(bot, bot.dirIdx); }
        else if(LV.ice && m.stun<=0 && m.iceCd<=0){
          /* v0.9 : la machine DERAPE en permanence sur la glace */
          if(startMove(m,m.dirIdx)) m.iceCd=ICE_GLISSE;
          else m.iceCd=0.20;
        }
      }
    }
  }
}
function lerp(a,b,t){ return a+(b-a)*t; }

var heldDir=-1;
var botTimer=0;
var demoAITimer=0;

/* ── v0.8 : les bonus / pieces / etats, par frame ── */
function burst(x,z,n,col){
  if(parts.length>12) return;
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, sp=0.5+Math.random()*1.1;
    parts.push({
      x:x, y:0.12+Math.random()*0.30, z:z,
      vx:Math.cos(a)*sp, vy:0.7+Math.random()*1.2, vz:Math.sin(a)*sp,
      life:0.45+Math.random()*0.35, max:0.8, size:0.04+Math.random()*0.04,
      col:[col[0],col[1],col[2]]
    });
  }
}
function updateParticles(dt){
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt; p.z+=p.vz*dt; p.y+=p.vy*dt;
    p.vy-=2.6*dt; p.vx*=0.96; p.vz*=0.96;
    if(p.y<0.05){ p.y=0.05; p.vy*=-0.35; }
    p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }
}

function pickSoap(m){
  if(!soap) return;
  if(Math.abs(m.wx-(soap.gx-7))>0.62 || Math.abs(m.wz-(soap.gy-6))>0.62) return;
  m.soapT=SAVON_DUREE*(m===player && player.soapMul? player.soapMul : 1);
  burst(m.wx,m.wz,12,[1.6,1.35,1.5]);
  soap=null;
  soapTimer=SAVON_REAPPARITION;
  beep(680,0.10,0.05);
  if(m===player) beep(940,0.07,0.04);
}

function pickTorpille(m){
  if(!torp) return;
  if(Math.abs(m.wx-(torp.gx-7))>0.62 || Math.abs(m.wz-(torp.gy-6))>0.62) return;
  torp=null;
  m.torpCharge=TORPILLE_CHARGE_AUTO;
  burst(m.wx,m.wz,10,[1.4,1.5,1.6]);
  beep(420,0.12,0.05);
}

function fireTorpille(m){
  if(torpUsed) return;
  torpUsed=true;
  m.torpCharge=0;
  var cx=m.gx, cy=m.gy;
  wave={cx:cx,cy:cy,t:0};
  var zone = TORPILLE_ZONE + ((m===player && player.torpBonus)?player.torpBonus:0);
  var r0=zone>>1, nids=0;
  for(var dl=-r0;dl<=r0;dl++){
    for(var dc=-r0;dc<=r0;dc++){
      var cc=cx+dc, ll=cy+dl;
      if(cc<0||ll<0||cc>=COLS||ll>=ROWS) continue;
      if(blocked[idxAt(cc,ll)]) continue;
      var k=idxAt(cc,ll);
      if(cells[k]===3){
        cells[k]=(m===player)?2:4; foamT[k]=FOAM_LIFE; detW[k]=0; detHits[k]=0; removeNest(cc,ll); removeMarkAt(cc,ll);
        if(m===player) score+=DETRITUS_MULT; else botScore+=DETRITUS_MULT;
        nids++;
      } else if(cells[k]===0){
        cells[k]=(m===player)?2:4; foamT[k]=FOAM_LIFE; cleanHits[k]=0; removeMarkAt(cc,ll);
        if(m===player) score++; else botScore++;
      }
    }
  }
  buildFloor(); recomputeCounts();
  if(dirtyLeft<=0 && mode==='play') mode='win';
  burst(cx-7,cy-6,16,[1.6,1.75,1.8]);
  beep(300,0.16,0.06); beep(520,0.10,0.04);
  if(m===player) beep(880,0.07,0.03);
}

function updateGrandMere(dt){
  if(!gm) return;
  gm.step+=dt*0.4;
  gm.pieces=(gm.pieces+dt/2.4)%4;          /* elle compte « 1… 2… 3… » */
  gm.dirT-=dt;
  if(gm.dirT<=0){
    if(Math.random()<0.6){
      var d=DIRS[(Math.random()*4)|0];
      gm.dirX=d[0]; gm.dirZ=d[1];
    }
    gm.dirT=3.5+Math.random()*3.5;
  }
  var nx=gm.x+gm.dirX*VITESSE_GRAND_MERE*dt;
  var nz=gm.z+gm.dirZ*VITESSE_GRAND_MERE*dt;
  if(nx<-6.5||nx>6.5){ gm.dirX*=-1; gm.dirT=2.5; } else gm.x=nx;
  if(nz<-5.5||nz>5.5){ gm.dirZ*=-1; gm.dirT=2.5; } else gm.z=nz;
  /* toutes les ~20 s : une PIECE JAUNE */
  gm.pieceTimer-=dt;
  if(gm.pieceTimer<=0){
    gm.pieceTimer=PIECE_INTERVAL;
    gm.nbPieces++;
    coins.push({x:gm.x+0.30,z:gm.z+0.18,t:0});
    burst(gm.x,gm.z,5,[2.0,1.7,0.35]);
    beep(900,0.06,0.035);
  }
  if(gm.colere>0) gm.colere-=dt;
  if(gm.coupsWin>0){ gm.coupsWin-=dt; if(gm.coupsWin<=0) gm.coups=0; }
}

/* ── collisions/ramassages par frame pour une machine ── */
function machineCollisions(m,dt){
  if(m.stun>0){ m.stun-=dt; if(m.stun<0) m.stun=0; }
  if(m.soapT>0){ m.soapT-=dt; if(m.soapT<0) m.soapT=0; }
  /* v0.8 : traînée d'ETINCELLES blanches pendant la glisse */
  if(m.soapT>0 && parts.length<34){
    for(var sp2=0;sp2<2;sp2++){
      parts.push({
        x:m.wx+(Math.random()-0.5)*0.66, y:0.10+Math.random()*0.26, z:m.wz+(Math.random()-0.5)*0.66,
        vx:(Math.random()-0.5)*0.55, vy:0.40+Math.random()*0.65, vz:(Math.random()-0.5)*0.55,
        life:0.40+Math.random()*0.35, max:0.75, size:0.05+Math.random()*0.035,
        col:[1.95,1.95,1.98]
      });
    }
  }
  if(m.slowT>0){ m.slowT-=dt; if(m.slowT<0) m.slowT=0; }

  /* savon / torpille */
  pickSoap(m);
  pickTorpille(m);
  if(m.torpCharge>0){
    m.torpCharge-=dt;
    if(m.torpCharge<=0) fireTorpille(m);
  }

  /* pieces jaunes : +1 point */
  for(var i=coins.length-1;i>=0;i--){
    var c=coins[i];
    if(Math.abs(m.wx-c.x)<0.55 && Math.abs(m.wz-c.z)<0.55){
      coins.splice(i,1);
      if(m===player) score+=PIECE_POINTS; else botScore+=PIECE_POINTS;
      m.coins++;
      burst(c.x,c.z,6,[2.0,1.7,0.35]);
      beep(990,0.07,0.04);
    }
  }

  /* grand-mere : INFRANCHISSABLE — la machine est repoussee */
  if(gm){
    var dx=m.wx-gm.x, dz=m.wz-gm.z;
    var n=Math.sqrt(dx*dx+dz*dz)||0.001;
    if(n<0.95){
      m.kox+=dx/n*0.30; m.koz+=dz/n*0.30;
      if((m._gmCd||0)<=0){
        m._gmCd=1.0;
        gm.coups++; gm.coupsWin=FENETRE_COUPS;
        beep(210,0.07,0.04);
        if(gm.coups>=COUPS_GRAND_MERE){
          gm.coups=0; gm.coupsWin=0; gm.colere=2.5;
          m.slowT=RALENTI_GRAND_MERE;          /* ralentie 2 s */
          burst(gm.x,gm.z,9,[1.1,0.95,1.5]);
          beep(120,0.22,0.05);
        }
      }
    }
    if(m._gmCd>0) m._gmCd-=dt;
  }
}

function updateEntities(dt){
  updateGrandMere(dt);

  /* v0.9 : les pollueurs salissent, les taches vieillissent */
  updatePolluters(dt);
  for(var mi=0;mi<soilMarks.length;mi++) soilMarks[mi].t+=dt;

  /* reapparition du savon ~12 s */
  if(!soap){
    soapTimer-=dt;
    if(soapTimer<=0){ placeSoap(); beep(760,0.05,0.03); }
  }
  /* vague de la torpille */
  if(wave){ wave.t+=dt; if(wave.t>0.85) wave=null; }

  for(var ci=0;ci<coins.length;ci++) coins[ci].t+=dt;
  updateParticles(dt);
  updateFoam(dt);            /* v1.2 : dissipation de la mousse */
  updateFoamParticles(dt);

  machineCollisions(player,dt);
  machineCollisions(bot,dt);
}

function aiThink(m,dt){
  if(m.stun>0 || m.moving) return;
  m.aiT=(m.aiT||0)-dt;
  if(m.aiT>0) return;
  m.aiT=0.24;
  /* cherche la case sale / le nid le plus proche */
  var best=-1,bx=0,by=0,bd=1e9;
  for(var gy=0;gy<ROWS;gy++){
    for(var gx=0;gx<COLS;gx++){
      var st=cells[idxAt(gx,gy)];
      if(st!==0 && st!==3) continue;
      var d=Math.abs(gx-m.gx)+Math.abs(gy-m.gy);
      if(d>0 && d<bd){ bd=d; bx=gx; by=gy; best=0; }
    }
  }
  var opts=[];
  for(var k=0;k<4;k++){
    var nx=m.gx+DIRS[k][0], ny=m.gy+DIRS[k][1];
    if(!canEnter(nx,ny,m)) continue;
    if(best===0){
      var nd=Math.abs(bx-nx)+Math.abs(by-ny);
      if(nd<bd) opts.push(k);
    } else opts.push(k);
  }
  if(!opts.length){
    for(var k2=0;k2<4;k2++){
      var nx2=m.gx+DIRS[k2][0], ny2=m.gy+DIRS[k2][1];
      if(canEnter(nx2,ny2,m)) opts.push(k2);
    }
  }
  if(opts.length) startMove(m, opts[(Math.random()*opts.length)|0]);
}
function botThink(dt){ aiThink(bot,dt); }

/* ---------- 12. SON (optionnel) ---------- */
function beep(freq,dur,vol){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    var o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.value=vol;
    o.connect(g); g.connect(audioCtx.destination);
    var t=audioCtx.currentTime;
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur+0.01);
  }catch(e){ /* son non bloquant */ }
}

/* ---------- 13. ENTREES ---------- */
var keyMap={ArrowUp:0,ArrowDown:1,ArrowRight:2,ArrowLeft:3,w:0,s:1,d:2,a:3,W:0,S:1,D:2,A:3};
window.addEventListener('keydown',function(e){
  var k=e.key;

  /* --- v0.14 : CHOIX DU PERSONNAGE / DE LA MACHINE --- */
  if(mode==='charPick'||mode==='vehPick'){
    var list = (mode==='charPick')?CHARS:VEHICLES;
    var isChar = (mode==='charPick');
    var cur = isChar?charIdx:vehIdx;
    /* v2.6 : les cartes forment une LISTE VERTICALE — haut/bas = ±1.
       Le ±2 venait d'une grille 2×2 abandonnée : depuis, « bas » sautait une carte
       (1 → 3 → 4) et « haut » n'en remontait qu'une sur deux. */
    if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); cur=Math.min(cur+1,list.length-1); }
    else if(k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); cur=Math.max(cur-1,0); }
    else if(k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); cur=Math.min(cur+1,list.length-1); }
    else if(k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); cur=Math.max(cur-1,0); }
    else if(k==='Enter'||k===' '){
      e.preventDefault();
      if(isChar){ charIdx=cur; mode='vehPick'; beep(720,0.07,0.04); }
      else { vehIdx=cur; mode='select'; selIdx=levelIdx; beep(880,0.08,0.04); }
      return;
    }
    else if(k==='Escape'){ e.preventDefault(); resetGame('attract'); return; }
    else return;
    if(isChar) charIdx=cur; else vehIdx=cur;
    beep(520,0.04,0.03);
    return;
  }

  /* --- v0.9 : ECRAN DE SELECTION DES NIVEAUX --- */
  if(mode==='select'){
    if(k==='ArrowRight'||k==='d'||k==='D'){ e.preventDefault(); navSel(1,0); beep(520,0.04,0.03); return; }
    if(k==='ArrowLeft'||k==='a'||k==='A'){ e.preventDefault(); navSel(-1,0); beep(520,0.04,0.03); return; }
    if(k==='ArrowDown'||k==='s'||k==='S'){ e.preventDefault(); navSel(0,1); beep(460,0.04,0.03); return; }
    if(k==='ArrowUp'||k==='w'||k==='W'){ e.preventDefault(); navSel(0,-1); beep(460,0.04,0.03); return; }
    if(k==='Enter'||k===' '){ e.preventDefault(); startLevel(selIdx); return; }
    if(k==='m'||k==='M'){ soundOn=!soundOn; return; }
    if(k==='Escape'){ e.preventDefault(); resetGame('attract'); return; }
    return;
  }

  /* --- ENTREE : titres / resultats / niveau suivant --- */
  if(k==='Enter'||k===' '){
    e.preventDefault();
    if(mode==='attract'){ mode='charPick'; beep(660,0.08,0.05); return; }
    if(mode==='over'||mode==='win'){ nextLevel(); return; }
    return;
  }
  if(k==='Escape'){
    e.preventDefault();
    if(mode==='play'||mode==='over'||mode==='win'){ recordHighScore(); mode='charPick'; beep(300,0.07,0.04); }
    return;
  }
  if(k==='r'||k==='R'){
    if(mode==='play'||mode==='over'||mode==='win') startLevel(levelIdx);
    else if(mode==='attract') resetGame('attract');
    return;
  }
  if(k==='m'||k==='M'){ soundOn=!soundOn; return; }
  /* E tire la torpille laveuse chargee */
  if(k==='e'||k==='E'){
    if(mode==='play' && player.torpCharge>0) fireTorpille(player);
    return;
  }
  var di=keyMap[k];
  if(di===undefined) return;
  e.preventDefault();
  /* ═══ v0.16 : DÉPLACEMENT STRICTEMENT CASE PAR CASE ═══
     Un appui = une case. Les répétitions automatiques du clavier
     (maintien de la touche) sont IGNORÉES… sauf pendant une FUSÉE,
     où le déplacement redevient continu tant qu'elle est active. */
  var rocket = (mode==='play' && player.rocketT>0);
  if(e.repeat && !rocket) return;
  heldDir=di;
  if(mode!=='play') return;
  if(player.stun>0) return;
  /* PATINOIRE : pivot lent, la machine garde son cap 0,35 s */
  if(LV.ice){
    if(!player.moving){
      if(di!==player.dirIdx){ player.queued=di; player.pivotT=ICE_PIVOT; }
    } else player.queued=di;
    return;
  }
  if(!player.moving){
    /* pendant la glisse du savon, pas de pivot sur place —
       la machine glisse encore une case avant de tourner (inertie) */
    if(player.soapT>0 && di!==player.dirIdx && (player.inertiaMul===undefined||player.inertiaMul>0.6)){
      if(startMove(player,player.dirIdx)){ player.queued=di; return; }
    }
    startMove(player,di);
  } else player.queued=di;
});
window.addEventListener('keyup',function(e){
  var di=keyMap[e.key];
  if(di!==undefined && di===heldDir) heldDir=-1;
});

/* v0.9 : entrer dans un niveau / enchaîner */
function startLevel(i){
  levelIdx = (i+LEVELS.length)%LEVELS.length;
  selIdx = levelIdx;
  resetGame('play');
  beep(760,0.09,0.05); beep(1040,0.09,0.04);
}
function nextLevel(){
  startLevel((levelIdx+1)%LEVELS.length);
}
function startGame(){
  if(mode!=='attract') recordHighScore();   /* la demo ne compte pas au HIGH SCORE */
  startLevel(levelIdx);
}

function hudText(s,x,y,size,color,align,weight){

/* v0.8 : projection monde -> HUD (640x360), pour la bulle de la grand-mere */
function hudProject(x,y,z){
  var v=[x,y,z,1], o=[0,0,0,0];
  for(var r=0;r<4;r++) o[r]=PV[r]*v[0]+PV[4+r]*v[1]+PV[8+r]*v[2]+PV[12+r]*v[3];
  if(o[3]<=0.001) return null;
  var ix=o[0]/o[3], iy=o[1]/o[3];
  return { x:(ix*0.5+0.5)*640, y:(1-(iy*0.5+0.5))*360 };
}

/* v0.9 : etoiles de difficulte (★ a ★★★★) */
function hudStars(x,y,n,on){
  var s='';

  hud.font='bold 9px "Courier New",monospace';
  hud.textAlign='right'; hud.textBaseline='middle';
  hud.fillStyle='rgba(0,0,0,0.72)';

  hud.fillText(s,x,y);
}


/* ═════════ v0.16 : PORTRAITS 2D PIXEL ART (esprit Street Fighter II) ═════════
   Les écrans de choix n'utilisent plus le modèle 3D : ce sont de vrais
   portraits 2D dessinés au pixel, avec ombrage 2 tons + contour, comme sur
   les écrans de sélection des jeux de baston d'antan. */
function pxr(x,y,w,h,col){ hud.fillStyle=col; hud.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function shade(col,k,add){
  var a=add||0;
  return 'rgb('+Math.max(0,Math.min(255,Math.round(col[0]*255*k+a)))+','
              +Math.max(0,Math.min(255,Math.round(col[1]*255*k+a)))+','
              +Math.max(0,Math.min(255,Math.round(col[2]*255*k+a)))+')';
}
/* portrait : x,y = coin haut-gauche, u = taille d'un pixel */
/* ═════════ v2.2 : PORTRAITS issus de la chaîne FLUX + re-pixelisation ═════════
   Planche de 4 portraits 96x96 (stg, chef, vet, rob) encodée en palette + RLE base36,
   générée hors-ligne puis re-pixelisée (palette verrouillée 13 tons, contour continu,

      g.fillStyle='#'+col;
      var y=(i/W)|0, x=i%W, rem=n;
      while(rem>0){

}

function drawSegmentedBar(x,y,w,h,ratio,fillCol,hiCol,segs,emptyCol,borderCol){
  var rx=Math.round(x), ry=Math.round(y), rw=Math.round(w), rh=Math.round(h);
  var r = Math.max(0, Math.min(1, ratio||0));
  var n = segs || 10;
  hud.fillStyle = '#070b10';
  hud.fillRect(rx, ry, rw, rh);
  hud.fillStyle = emptyCol || 'rgba(255,255,255,0.12)';
  hud.fillRect(rx+1, ry+1, rw-2, rh-2);
  var fw = Math.round((rw-2)*r);
  if(fw > 0){
    hud.fillStyle = fillCol;
    hud.fillRect(rx+1, ry+1, fw, rh-2);
    if(hiCol && rh>=6){
      hud.fillStyle = hiCol;
      hud.fillRect(rx+1, ry+1, fw, Math.max(1, Math.floor((rh-2)*0.32)));
    }
  }
  /* séparateurs de segments */
  hud.fillStyle = '#070b10';
  for(var i=1; i<n; i++){
    var sx = rx + Math.round(rw * i / n);
    hud.fillRect(sx, ry+1, 1, rh-2);
  }
  /* bordure franche 1px */
  hud.fillStyle = borderCol || 'rgba(210,235,255,0.42)';
  hud.fillRect(rx, ry, rw, 1);
  hud.fillRect(rx, ry+rh-1, rw, 1);
  hud.fillRect(rx, ry, 1, rh);
  hud.fillRect(rx+rw-1, ry, 1, rh);
}

  hud.fillRect(rx+t, ry+t, rw-t*2, 1);
  hud.fillRect(rx+t, ry+rh-t-1, rw-t*2, 1);
  hud.fillRect(rx+t, ry+t, 1, rh-t*2);
  hud.fillRect(rx+rw-t-1, ry+t, 1, rh-t*2);
  /* coins renforcés en L */
  if(cornerCol){
    var cl = Math.min(12, Math.floor(Math.min(rw,rh)*0.22));
    var ct = t + 1;
    hud.fillStyle = cornerCol;
    /* haut-gauche */
    hud.fillRect(rx-1, ry-1, cl, ct); hud.fillRect(rx-1, ry-1, ct, cl);
    /* haut-droite */
    hud.fillRect(rx+rw+1-cl, ry-1, cl, ct); hud.fillRect(rx+rw+1-ct, ry-1, ct, cl);
    /* bas-gauche */
    hud.fillRect(rx-1, ry+rh+1-ct, cl, ct); hud.fillRect(rx-1, ry+rh+1-cl, ct, cl);
    /* bas-droite */
    hud.fillRect(rx+rw+1-cl, ry+rh+1-ct, cl, ct); hud.fillRect(rx+rw+1-ct, ry+rh+1-cl, ct, cl);
  }
}

function drawDitherRect(x,y,w,h,col,dens,step){
  var s = step || 2;
  var x0 = Math.round(x), y0 = Math.round(y), x1 = Math.round(x+w), y1 = Math.round(y+h);
  hud.fillStyle = col;
  for(var py=y0; py<y1; py+=s){
    var by = BAYER4[((py/s)|0)&3];
    for(var px0=x0; px0<x1; px0+=s){
      if(((by[((px0/s)|0)&3]+0.5)/16) < dens){
        hud.fillRect(px0, py, s, s);
      }
    }
  }
}

function drawPixelWord(word, x, y, u, gap, pal){
  var curX = x;
  for(var i=0; i<word.length; i++){
    var ch = word.charAt(i);
    if(ch===' '){ curX += u*3; continue; }
    var g = LOGO_FONT[ch];
    if(!g) continue;
    /* 1. ombre tramée (dithering ordonné) décalée de +u, +u */
    for(var ry=0; ry<7; ry++){
      for(var rx=0; rx<5; rx++){
        if(g[ry].charAt(rx)==='1'){
          drawDitherRect(curX+rx*u+u, y+ry*u+u, u, u, '#04060a', 0.60, 1);
        }
      }
    }
    /* 2. contour franc + extrusion pixel 3D */
    for(var ry2=0; ry2<7; ry2++){
      for(var rx2=0; rx2<5; rx2++){
        if(g[ry2].charAt(rx2)==='1'){
          pxr(curX+rx2*u-1, y+ry2*u-1, u+2, u+2, '#070a10');
          pxr(curX+rx2*u+2, y+ry2*u+2, u, u, pal.ext);
        }
      }
    }
    /* 3. remplissage par bandes franches (haut / milieu / bas) + reflet pixel */
    for(var ry3=0; ry3<7; ry3++){
      var col = (ry3<=1) ? pal.hi : (ry3<=4 ? pal.mid : pal.lo);
      for(var rx3=0; rx3<5; rx3++){
        if(g[ry3].charAt(rx3)==='1'){
          pxr(curX+rx3*u, y+ry3*u, u, u, col);
          if(ry3===0){ pxr(curX+rx3*u, y+ry3*u, u, 1, '#ffffff'); }
        }
      }
    }
    curX += 5*u + gap;
  }
}

/* ═════════ v2.1 : ECRAN GARAGE ═════════════════════════════════════════════
   Construction reprise de l'ecran de garage de Death Rally (1996), demandee par
   Jose : symetrie portrait / sphere de vehicule, panneau central granit, jauges
   a segments rouges, vehicule mis en vitrine dans une sphere noire lustree.
   Adaptation a MOB RACER : fond oxblood + accent ambre, textes bitmap blancs
   contours noirs, tout dessine en code (zero asset). */
function granitePanel(x,y,w,h){
  pxr(x,y,w,h,'#6b6862');
  for(var yy=0; yy<h; yy+=2){
    for(var xx=0; xx<w; xx+=2){
      var n=(xx*7+yy*13)%11;
      if(n<4) pxr(x+xx,y+yy,2,2,'#77746e');
      else if(n>8) pxr(x+xx,y+yy,2,2,'#5e5b56');
    }
  }
  pxr(x,y,w,2,'#9b9791'); pxr(x,y,2,h,'#9b9791');           /* biseau clair */
  pxr(x,y+h-2,w,2,'#3f3d3a'); pxr(x+w-2,y,2,h,'#3f3d3a');   /* biseau sombre */
}
function glossSphere(cx,cy,r){
  for(var i=r; i>0; i--){
    var t=i/r;
    var v=Math.round(6+26*t*t);
    hud.fillStyle='rgb('+v+','+(v+2)+','+(v+8)+')';
    hud.beginPath(); hud.arc(cx,cy,i,0,Math.PI*2); hud.fill();
  }
  /* pas de reflet de vitre : la sphère reste mate (consigne) */
  hud.strokeStyle='rgba(150,190,230,0.55)'; hud.lineWidth=1;
  hud.beginPath(); hud.arc(cx,cy,r-1,Math.PI*0.15,Math.PI*0.85); hud.stroke();
  hud.strokeStyle='rgba(20,26,34,0.9)';
  hud.beginPath(); hud.arc(cx,cy,r,0,Math.PI*2); hud.stroke();
}
function segGauge(x,y,w,label,val,col,hideZero){
  hudText(label, x, y+5, 6.5, '#f2efe6', 'left', 'normal');
  var bx=x+66, bw=w-66, segs=14, sw=Math.floor((bw-(segs-1)*2)/segs);
  var on=Math.round(val*segs);
  /* code couleur : >=10 vert, 5-9 ambre, <5 rouge */
  var c = on>=10 ? '#4fd07a' : (on>=5 ? '#e8c44a' : '#e0453a');
  for(var i=0;i<segs;i++){
    pxr(bx+i*(sw+2), y-2, sw, 10, '#3a2a2c');
    pxr(bx+i*(sw+2), y-2, sw, 1, '#4d3a3c');
    if(i<on){
      pxr(bx+i*(sw+2), y-2, sw, 10, c);
      pxr(bx+i*(sw+2), y-2, sw, 2, 'rgba(255,255,255,0.38)');
    }
  }
  if(on===0){
    pxr(bx, y-2, sw, 10, '#5a4a2e');
    hudText('MIN', bx+bw+8, y+5, 6.5, '#c8b0a8', 'right', 'normal');
  } else {
    hudText(on+'/'+segs, bx+bw+8, y+5, 6.5, '#c8b0a8', 'right', 'normal');
  }
}

/* v0.9 : retour a la ligne simple pour les cartes */
function hudWrap(s,maxChars){
  var words=s.split(' '), out=[], cur='';
  for(var i=0;i<words.length;i++){
    var test=cur?cur+' '+words[i]:words[i];
    if(test.length>maxChars){ if(cur) out.push(cur); cur=words[i]; }
    else cur=test;
  }
  if(cur) out.push(cur);
  return out;
}

/* v0.8 : bordure a rayures diagonales rouge/jaune, facon borne 80s */
function drawStripeBorder(){
  var bh=9;
  for(var i=-14;i<646;i+=14){
    hud.fillStyle=(((i/14)|0)%2)? '#ffd45a' : '#e74c3c';
    hud.beginPath(); hud.moveTo(i,0); hud.lineTo(i+14,0); hud.lineTo(i+14-bh,bh); hud.lineTo(i-bh,bh); hud.closePath(); hud.fill();
    hud.beginPath(); hud.moveTo(i,360); hud.lineTo(i+14,360); hud.lineTo(i+14-bh,360-bh); hud.lineTo(i-bh,360-bh); hud.closePath(); hud.fill();
  }
  for(var j=-14;j<366;j+=14){
    hud.fillStyle=(((j/14)|0)%2)? '#ffd45a' : '#e74c3c';
    hud.beginPath(); hud.moveTo(0,j); hud.lineTo(0,j+14); hud.lineTo(bh,j+14-bh); hud.lineTo(bh,j-bh); hud.closePath(); hud.fill();
    hud.beginPath(); hud.moveTo(640,j); hud.lineTo(640,j+14); hud.lineTo(640-bh,j+14-bh); hud.lineTo(640-bh,j-bh); hud.closePath(); hud.fill();
  }
}

function drawHUD(){
  hud.setTransform(2.25,0,0,2.25,0,0);   /* v1.7 : HUD rendu en 1440×810 (coût Canvas 2D ÷3), étiré sur le stage 2160 */
  var CRT_PAT=null;
  /* v2.6 : sur un téléphone l'arène ne fait que ~220 px de haut — la mini-carte (114×123)
   et la console de jauges (508×40) mangeaient le quart bas du terrain. En mode compact
   elles disparaissent du canvas : les valeurs vivent dans la barre de stats sous le jeu. */
function hudCompact(){
  var L=window.__layout;
  return !!(L && (L.scale < 0.42 || L.drawW < 760));
}
function crtScanlines(){
    /* v1.7 : un motif 1×2 mis en cache puis rempli d'un seul coup — 180 fillRect par
       frame devenaient le premier poste de coût du HUD en 2160×1215 */
    if(!CRT_PAT){
      var cc=document.createElement('canvas'); cc.width=1; cc.height=2;
      var cg=cc.getContext('2d');
      cg.fillStyle='rgba(0,0,0,0.10)'; cg.fillRect(0,0,1,1);
      CRT_PAT=hud.createPattern(cc,'repeat');
    }
    hud.fillStyle=CRT_PAT;
    hud.fillRect(0,0,640,360);
  }
  if(window.__padOnFlag && (performance.now()|0)%4===0 && typeof stPct!=='undefined' && stPct){
    var pctTxt = Math.round((totalCleanable>0 ? (totalCleanable-dirtyLeft)/totalCleanable : 1)*100)+'%';
    stPct.textContent=pctTxt;
    stTime.textContent=Math.max(0,Math.ceil(timeLeft));
    stMe.textContent=score;
    stBot.textContent=botScore;
    stWater.textContent=Math.round(player.water*100)+'%';
    if(stDirt) stDirt.textContent=Math.round(player.dirt*100)+'%';
    if(stSoap) stSoap.textContent=Math.round((player.soapT||0))+'s';
  }
  hud.clearRect(0,0,640,360);
  hudAccent();

  if(mode==='attract'){ drawAttract(); return; }   /* v1.7 : scanlines gérées par le shader */
  if(window.__sprTest){
    hud.fillStyle='#10141a'; hud.fillRect(0,0,640,360);
    var keys=['you','bot'], dirs=[0,1,2];
    for(var a=0;a<keys.length;a++){
      for(var b2=0;b2<dirs.length;b2++){
        var key=keys[a]+'_'+dirs[b2];
        spriteTex(keys[a],dirs[b2]);
        if(SPRC[key]){
          hud.imageSmoothingEnabled=false;
          hud.drawImage(SPRC[key], 30+b2*180, 40+a*160, 90, 132);
          hudText(key, 75+b2*180, 190+a*160, 8, '#7ad8f0','center');
        }
      }
    }
    hudText('PLANCHE DES SPRITES (QA)', 320, 20, 10, '#ffd45a','center');
    return;
  }
  if(mode==='select'){ drawSelect(); /* v1.7 : scanlines faites par le shader de blit */ return; }
  if(mode==='charPick'){ drawCharPick(); /* v1.7 : scanlines faites par le shader de blit */ return; }
  if(mode==='vehPick'){ drawVehPick(); /* v1.7 : scanlines faites par le shader de blit */ return; }

  var pct = totalCleanable ? Math.round(100*(totalCleanable-dirtyLeft)/totalCleanable) : 0;
  var nowMs = performance.now();
  var pulseFast = Math.floor(nowMs/260)%2===0;

  /* Contexte de dominance visuelle :
     - Si l'eau est basse (<= 35%) ou vide, la jauge EAU / WATER devient critique et dominante.
     - Sinon, la jauge d'objectif principal PROPRETE / CLEAN est visuellement dominante. */
  var waterCrit = (player.water <= 0.35);
  var dirtCrit  = (player.dirt >= 0.85);
  var cleanDom  = !waterCrit;

  /* ═════════ BARRE HAUTE : PROPRETÉ / CHRONO / DUEL ═════════ */
  pxr(0, 0, 640, 28, '#101620');
  pxr(0, 28, 640, 1, '#3a4c60');
  pxr(0, 29, 640, 13, 'rgba(6,10,15,0.95)');
  pxr(0, 42, 640, 1, 'rgba(120,190,240,0.22)');

  /* 1. Jauge PROPRETE / CLEAN (label bilingue AU-DESSUS de la barre) */

  if(cleanDom){
    pxr(cBoxX, cBoxY, cBoxW, cBoxH, '#16283b');
    pxr(cBoxX, cBoxY, cBoxW, 1, '#5fd8ec');
    pxr(cBoxX, cBoxY+cBoxH-1, cBoxW, 1, '#5fd8ec');
    pxr(cBoxX, cBoxY, 2, cBoxH, '#ffd45a');

  drawIconClean(cBoxX+5, cBoxY+2, 1);

    '#38b6ff', '#a8ebff', 10, 'rgba(255,255,255,0.12)', cleanDom ? '#7ad8f0' : '#3a5064');

  /* 2. Chrono central octogonal */
  (function(){
    var tl=Math.max(0,Math.ceil(timeLeft));
    var mm=Math.floor(tl/60), ss=tl%60;
    var txt=(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;
    var px0=270, py0=2, pw=100, ph=24, c=5;
    hud.beginPath();
    hud.moveTo(px0+c,py0); hud.lineTo(px0+pw-c,py0); hud.lineTo(px0+pw,py0+c);
    hud.lineTo(px0+pw,py0+ph-c); hud.lineTo(px0+pw-c,py0+ph); hud.lineTo(px0+c,py0+ph);
    hud.lineTo(px0,py0+ph-c); hud.lineTo(px0,py0+c); hud.closePath();
    hud.fillStyle='#090d14'; hud.fill();
    hud.strokeStyle=(timeLeft<=10&&mode==='play')?'#ff5a5a':'#4a6278'; hud.lineWidth=1; hud.stroke();
    hudText(txt, px0+pw/2, py0+ph/2+1, 13,

  /* 3. Compteurs de duel : TOI (bleu) vs LAYA (vert) */
  pxr(380, 3, 124, 22, '#0e2236');

  pxr(510, 3, 124, 22, '#0e261a');

  /* 4. Bandeau secondaire d'informations de salle */

  hudText('PIECES : x'+player.coins, 476, 36, 7, '#ffd45a');
  hudText(LV.passes>1 ? ('LAVAGE x'+LV.passes) : ('RECORD '+(highScores[LV.id]||0)), 630, 36, 7, '#9fd8f0', 'right');

  /* ═════════ 4. MINI-CARTE (bas gauche : bordure lisible, liseré murs, légende) ═════════ */
  if(!hudCompact()) (function(){
    var MX=6, MY=214, MW=114, MH=123;
    drawArcadeBox(MX, MY, MW, MH, 'rgba(6,10,16,0.92)', HUD_ACC, '#7ad8f0', 2, false);

    pxr(MX+2, MY+2, MW-4, 12, '#132232');

    /* Zone de la grille 15×13 avec liseré extérieur qui distingue l'enceinte des murs */
    var gx0 = MX+7, gy0 = MY+16, gw = 100, gh = 78;
    var cw = gw/COLS, ch = gh/ROWS;
    /* Liseré d'enceinte des murs (double filet clair/sombre autour de l'arène) */
    pxr(gx0-2, gy0-2, gw+4, gh+4, '#9ab2c8');
    pxr(gx0-1, gy0-1, gw+2, gh+2, '#18222e');

    for(var gy=0; gy<ROWS; gy++){
      for(var gx=0; gx<COLS; gx++){
        var idx = idxAt(gx,gy);
        var cx0 = Math.round(gx0 + gx*cw);
        var cy0 = Math.round(gy0 + gy*ch);
        var cw0 = Math.max(2, Math.round((gx+1)*cw) - Math.round(gx*cw));
        var ch0 = Math.max(2, Math.round((gy+1)*ch) - Math.round(gy*ch));
        if(blocked[idx]){
          /* Mur / obstacle : remplissage dense + liseré clair qui distingue les murs */
          pxr(cx0, cy0, cw0, ch0, '#465466');
          pxr(cx0, cy0, cw0, 1, '#c4d8ea');
          pxr(cx0, cy0, 1, ch0, '#c4d8ea');
          pxr(cx0, cy0+ch0-1, cw0, 1, '#1a222c');
        } else {
          var c;
          if(cells[idx]===3)      c = '#9c6228';
          else if(cells[idx]===0) c = 'rgba(148,118,78,0.42)';
          else if(cells[idx]===2) c = 'rgba(72,186,248,0.85)';
          else if(cells[idx]===4) c = 'rgba(78,214,122,0.85)';
          else                    c = 'rgba(220,235,245,0.16)';
          pxr(cx0, cy0, cw0, ch0, c);
        }
      }
    }
    /* Stations (Recharge eau = cyan, Vidange = orange) avec contour franc */
    for(var si=0; si<LV.props.length; si++){
      var sp2 = LV.props[si];
      if(sp2.k==='recharge' || sp2.k==='vidange'){
        var sx = Math.round(gx0 + sp2.gx*cw) - 1;

        var sw = Math.ceil(cw)+2, sh = Math.ceil(ch)+2;
        pxr(sx-1, sy-1, sw+2, sh+2, '#070b10');
        pxr(sx, sy, sw, sh, sp2.k==='recharge' ? '#4de0ff' : '#ffa63c');
        pxr(sx+1, sy+1, Math.max(1,sw-2), 1, '#ffffff');

    /* Marqueurs Joueur (bleu) et LAYA (vert) */
    var pxM = Math.round(gx0 + player.gx*cw) - 1;
    var pyM = Math.round(gy0 + player.gy*ch) - 1;
    var bxM = Math.round(gx0 + bot.gx*cw) - 1;

    var mw = Math.ceil(cw)+2, mh = Math.ceil(ch)+2;
    pxr(bxM-1, byM-1, mw+2, mh+2, '#07120a');
    pxr(bxM, byM, mw, mh, '#5fd07a');
    pxr(bxM, byM, mw, 1, '#d8ffe2');

    /* Légende discrète sur 2 lignes en bas de la mini-carte */

  if(!hudCompact()) drawArcadeBox(126, 297, 508, 40, 'rgba(7,12,19,0.92)', '#2e4458', null, 2, false);

     Col 2 (CRASSE / GRIME) : x=276, w=134 (fin 410)  [écart = 10]

  var Y_ICON = 301, Y_LBL = 307, Y_BAR = 317, H_BAR = 11;

/* ═════════ v0.12 : LAYOUT RESPONSIVE (portrait / paysage) + MANETTE AMIGA ═════════
   Ancien comportement : un simple scale centré, sans tenir compte des barres
   du navigateur mobile ni de la place d'une manette. Maintenant :
     · PORTRAIT → le jeu occupe le haut (16:9), la manette occupe le bas ;
     · PAYSAGE  → le jeu remplit l'écran, la manette flotte dans les coins.
   Calcul via visualViewport (barres d'URL) + safe-area (encoche). */
var stPct=document.getElementById('stPct'), stTime=document.getElementById('stTime'),
    stMe=document.getElementById('stMe'), stBot=document.getElementById('stBot'),
    stWater=document.getElementById('stWater'),
    stDirt=document.getElementById('stDirt'), stSoap=document.getElementById('stSoap');
var padEl=document.getElementById('pad'), knobEl=document.getElementById('knob'),
    stickEl=document.getElementById('stick');   /* v0.16 : plus utilisé (D-PAD) */
var PAD_ON=false, isTouch=false;
var DEAD=0.20;                      /* zone morte du stick */
var DIRKEYS={up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight'};
var stickState={ id:null, cx:0, cy:0, dir:null };

function viewport(){
  var vv=window.visualViewport;
  return { w: Math.round(vv? vv.width : window.innerWidth),
           h: Math.round(vv? vv.height : window.innerHeight) };
}
function layout(){
  var v=viewport();
  var portrait = v.h > v.w*1.02;
  var availH = (portrait && PAD_ON) ? Math.round(v.h*0.62) : v.h;
  var sc = Math.max(0.18, Math.min(v.w/OW, availH/OH));
  var drawW=OW*sc, drawH=OH*sc;
  /* encoche / Dynamic Island : inset haut lu sur une sonde CSS */
  var probe=document.getElementById('safeProbe');
  var safeTop=0;
  if(probe){ safeTop=parseInt(getComputedStyle(probe).paddingTop,10)||0; }
  var px=Math.round((v.w-drawW)/2);
  var py=portrait ? safeTop : Math.max(safeTop, Math.round((v.h-drawH)/2));
  stage.style.transformOrigin='top left';
  stage.style.left='0px'; stage.style.top='0px';
  stage.style.transform='translate('+px+'px,'+py+'px) scale('+sc+')';
  if(portrait && PAD_ON){
    padEl.style.top=Math.round(drawH)+'px';
    padEl.style.bottom='0px';
    padEl.style.height='auto';
  } else {
    padEl.style.top='auto';
    padEl.style.bottom='0px';
    padEl.style.height='auto';
  }
  padEl.classList.toggle('on', PAD_ON);
  window.__padOnFlag = PAD_ON;
  /* v2.6 : sous ~0,42 d'échelle, chaque texel de trame occupe moins d'un pixel écran :
     le tramage devient un grain sale et assombrit l'image. On coupe palette + trame. */
  window.__noQuant = (sc < 0.42);
  /* v2.6 : sur téléphone, l'arène n'a plus de HUD superposé — on récupère la bande du bas
     (décalage vertical) et on resserre la caméra de 10 % pour grossir les engins. */
  if(typeof rebuildCam==='function'){
    if(sc < 0.42) rebuildCam(0.90, 0.015);
    else          rebuildCam(1.00, 0.090);
  }
  window.__layout={ vw:v.w, vh:v.h, portrait:portrait, scale:Math.round(sc*1000)/1000,
                    drawW:Math.round(drawW), drawH:Math.round(drawH), pad:PAD_ON };
}
function detectTouch(){
  isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints||0)>0 ||
            window.matchMedia('(pointer: coarse)').matches;
  PAD_ON = isTouch;
  layout();
}

/* ── Entrées synthétiques : le jeu écoute window keydown/keyup (e.key) ── */
function sendKey(key, down){
  try{
    window.dispatchEvent(new KeyboardEvent(down?'keydown':'keyup',
      {key:key, code:key, bubbles:true, cancelable:true}));
  }catch(err){}
}
function bindButton(el, key){
  if(!el) return;
  function press(ev){ ev.preventDefault(); el.classList.add('down'); sendKey(key,true); }
  function release(ev){ if(ev) ev.preventDefault(); if(!el.classList.contains('down')) return;
                        el.classList.remove('down'); sendKey(key,false); }
  el.addEventListener('pointerdown', press);
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  el.addEventListener('pointerleave', release);
  el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

});

/* ── JOYSTICK 8 directions (zone morte + hystérésis + multi-touch) ── */
function stickDir(dx,dy){
  if(!stickEl) return null;
  var R=stickEl.getBoundingClientRect(), dead=R.width*DEAD;
  if(Math.sqrt(dx*dx+dy*dy) < dead) return null;
  var ang=Math.atan2(dy,dx);                  /* 0 = droite, PI/2 = bas */
  var oct=Math.round(ang/(Math.PI/4));
  if(oct<0) oct+=8;
  return ['right','downright','down','downleft','left','upleft','up','upright'][oct%8];
}
var ALLDIRS=['up','down','left','right'];
function applyStick(dx,dy){
  var nd=stickDir(dx,dy);
  if(nd===stickState.dir) return;
  for(var i=0;i<ALLDIRS.length;i++) sendKey(DIRKEYS[ALLDIRS[i]], false);
  stickState.dir=nd;
  if(!nd) return;
  if(nd.indexOf('up')>=0)    sendKey(DIRKEYS.up, true);
  if(nd.indexOf('down')>=0)  sendKey(DIRKEYS.down, true);
  if(nd.indexOf('left')>=0)  sendKey(DIRKEYS.left, true);
  if(nd.indexOf('right')>=0) sendKey(DIRKEYS.right, true);
}
function knobTo(dx,dy){
  if(!stickEl||!knobEl) return;
  var R=stickEl.getBoundingClientRect(), max=R.width*0.30;
  var d=Math.sqrt(dx*dx+dy*dy), k=(d>max)? max/d : 1;
  knobEl.style.transform='translate(calc(-50% + '+(dx*k)+'px), calc(-50% + '+(dy*k)+'px))';
}
function stickStart(ev){
  if(!stickEl) return;
  ev.preventDefault();
  if(stickState.id!==null) return;
  stickState.id=ev.pointerId;
  var R=stickEl.getBoundingClientRect();
  stickState.cx=R.left+R.width/2; stickState.cy=R.top+R.height/2;
  try{ stickEl.setPointerCapture(ev.pointerId); }catch(err){}
  stickMove(ev);
}
function stickMove(ev){
  if(stickState.id===null || ev.pointerId!==stickState.id) return;
  ev.preventDefault();
  var dx=ev.clientX-stickState.cx, dy=ev.clientY-stickState.cy;
  knobTo(dx,dy); applyStick(dx,dy);
}
function stickEnd(ev){
  if(stickState.id===null) return;
  if(ev && ev.pointerId!==undefined && ev.pointerId!==stickState.id) return;
  stickState.id=null; stickState.dir=null;
  knobEl.style.transform='translate(-50%,-50%)';
  for(var i=0;i<ALLDIRS.length;i++) sendKey(DIRKEYS[ALLDIRS[i]], false);
}
/* v0.16 : le joystick analogique est remplacé par un D-PAD 4 FLÈCHES cliquables
   (José : « le joystick n'est pas adapté, des flèches cliquables seraient plus
   adaptés »). Chaque appui = UNE case, exactement comme au clavier. */
(function(){
  var btns=document.querySelectorAll('.dbtn');
  for(var i=0;i<btns.length;i++){
    (function(el){
      var key=el.getAttribute('data-key');
      function press(ev){
        ev.preventDefault();
        if(el.classList.contains('down')) return;
        el.classList.add('down');
        sendKey(key,true);
      }
      function release(ev){
        if(ev) ev.preventDefault();
        if(!el.classList.contains('down')) return;
        el.classList.remove('down');
        sendKey(key,false);
      }
      el.addEventListener('pointerdown', press);
      el.addEventListener('pointerup', release);
      el.addEventListener('pointercancel', release);
      el.addEventListener('pointerleave', release);
      el.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    })(btns[i]);
  }
})();

/* ── TAP sur l'écran de jeu = valider (Entrée) : rend le jeu jouable
   entièrement au doigt (titre → sélection → manche suivante). */
(function(){
  var downAt=null;
  stage.addEventListener('pointerdown', function(ev){ downAt={x:ev.clientX,y:ev.clientY,t:Date.now()}; });
  stage.addEventListener('pointerup', function(ev){
    if(!downAt) return;
    var moved=Math.abs(ev.clientX-downAt.x)+Math.abs(ev.clientY-downAt.y);
    var dt=Date.now()-downAt.t; downAt=null;
    if(moved<14 && dt<700) sendKey('Enter', true), setTimeout(function(){ sendKey('Enter', false); }, 40);
  });
})();

  /* QA : planche des sprites de pollueurs, agrandis x6, pour juger le DESSIN seul */
  var types=['human','dog','raccoon','gull'], cvs=[];
  for(var ti=0;ti<types.length;ti++){
    for(var f=0;f<2;f++) cvs.push(critterCanvas(types[ti],0,f));
  }
  var S=6, pad=8, W=0, H=0;
  for(var i=0;i<cvs.length;i++){ W+=cvs[i].width*S+pad; H=Math.max(H,cvs[i].height*S); }
  var out=document.createElement('canvas'); out.width=W+pad; out.height=H+pad*2;
  var g=out.getContext('2d'); g.imageSmoothingEnabled=false;
  g.fillStyle='#2a2f38'; g.fillRect(0,0,out.width,out.height);
  var x=pad;
  for(var j=0;j<cvs.length;j++){
    g.drawImage(cvs[j], x, pad, cvs[j].width*S, cvs[j].height*S);
    x += cvs[j].width*S + pad;
  }
  return out.toDataURL('image/png');
};   /* QA : visiter les 5 salles sans jouer */

/* v1.3 : INSTRUMENTATION — coût par sous-système (ms) et FPS réels, exposés par __dbg.timing */
var PERF={update:0, scene:0, blit:0, hud:0, total:0, fps:0, frames:0, acc:0};
function perfSample(key, t0){ PERF[key]=PERF[key]*0.9 + (performance.now()-t0)*0.1; }
function frame(now){
  tFrame=performance.now();
  var _t0=tFrame;
  var dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;

  if(mode==='play'){
    timeLeft-=dt;
    if(timeLeft<=0){ timeLeft=0; mode='over'; recordHighScore(); }
  } else if(mode==='attract'){
    /* demo auto-jouee 8-10 s, relancee en boucle (un niveau different a chaque tour) */
    demoT-=dt;
    if(demoT<=0) resetGame('attract');
  }
  updatePickups(dt);      /* v0.16 : bonbonnes d'eau + fusée */
  updateMachines(dt);
  updateEntities(dt);

  if(mode==='play') botThink(dt);
  if(mode==='attract'){ aiThink(bot,dt); aiThink(player,dt); }
  perfSample('update', _t0);

  // --- passe scene -> FBO basse res ---
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.viewport(0,0,GW,GH);
  gl.clearColor(LV.sky[0],LV.sky[1],LV.sky[2],1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.disable(gl.CULL_FACE);
  drawScene();

  PERF.scene=PERF.scene*0.9+(performance.now()-_t0)*0.1;   /* coût de la passe 3D (FBO) */
  var _t1=performance.now();
  // --- passe upscale NEAREST -> canvas ---
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,OW,OH);
  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  drawBlit();

  var _t2=performance.now();
  drawHUD();
  var _t3=performance.now();
  PERF.blit=PERF.blit*0.9+(_t2-_t1)*0.1;
  PERF.hud =PERF.hud*0.9+(_t3-_t2)*0.1;
  PERF.total=PERF.total*0.9+(_t3-tFrame)*0.1;
  cpuMs += _t3-tFrame; cpuN++;

  fpsFrames++;
  PERF.frames++;
  if(now-fpsT>=1000){
    PERF.fps=Math.round(1000*fpsFrames/(now-fpsT));
    var f=Math.round(1000*fpsFrames/(now-fpsT));
    if(fpsReported<12 || fpsReported%5===0) console.log('FPS: '+f+' ('+fpsFrames+' frames / '+Math.round(now-fpsT)+' ms)');
    if(maxDrawCalls>lastLoggedDraws){
      lastLoggedDraws=maxDrawCalls;
      console.log('BOITES MAX: '+maxDrawCalls+' / 250  (niveau '+LV.name+')');
    }
    fpsReported++;
    fpsFrames=0; fpsT=now;
  }
  requestAnimationFrame(frame);
}

  },
  giveSoap: function(){ player.soapT=SAVON_DUREE; },
  fire: function(){ fireTorpille(player); },
  project: function(x,y,z){
    var v=[x,y,z,1], o=[0,0,0,0];
    for(var r=0;r<4;r++) o[r]=PV[r]*v[0]+PV[4+r]*v[1]+PV[8+r]*v[2]+PV[12+r]*v[3];
    var ix=o[0]/o[3], iy=o[1]/o[3];
    return [Math.round((ix*0.5+0.5)*OW), Math.round((1-(iy*0.5+0.5))*OH)];
  },
  pos: function(){
    return { player:{x:player.wx,z:player.wz,a:player.angle}, bot:{x:bot.wx,z:bot.wz,a:bot.angle} };
  }
};

window.__dbg = {
  get level(){ return { idx:levelIdx, sel:selIdx, id:LV.id, name:LV.name, num:LV.num, ice:!!LV.ice,
                        coef:LV.coef, diffLabel:LV.diffLabel, stars:LV.stars,

    return LEVELS.map(function(L,i){

      for(var k=0;k<L.mobs.length;k++) by[L.mobs[k]]++;
      return { idx:i, id:L.id, name:L.name, num:L.num, coef:L.coef, diffLabel:L.diffLabel,
               stars:L.stars, total:L.mobs.length, by:by, nests:L.nests, passes:L.passes,
               cdScale:Math.round(100/L.coef)/100 };
    });
  },
  get mode(){ return mode; },
  get cleanPct(){
    return totalCleanable ? Math.round(1000*(totalCleanable-dirtyLeft)/totalCleanable)/10 : 0;
  },
  get dirtyLeft(){ return dirtyLeft; },
  get dirtyCells(){
    var n=0;
    for(var i=0;i<cells.length;i++) if(!blocked[i] && cells[i]===0) n++;
    return n;
  },
  get polluters(){
    return polluters.map(function(p){
      return { type:p.type, state:p.state, x:Math.round(p.x*100)/100, z:Math.round(p.z*100)/100,
               cd:Math.round(p.cd*10)/10, cell:p.cell?[p.cell[0],p.cell[1]]:null };
    });
  },
  get dirtyByPolluters(){ return dirtyByPolluters; },
  get marks(){
    return soilMarks.map(function(m){ return {gx:m.gx,gy:m.gy,kind:m.kind}; });
  },
  get bakeProbe(){ var arr=Object.keys(bakeKeys).map(function(k){return {k:k, n:bakeKeys[k]};}).sort(function(a,b){return b.n-a.n;}); return {keys:arr.length, total:bakeTotal, top:arr.slice(0,12)}; },
  get staticBatches(){ return staticPropDraws; },
  get drawBreak(){ return {floor:drawBreak.floor, props:drawBreak.props, machines:drawBreak.machines, entities:drawBreak.entities, particles:drawBreak.particles, other:drawBreak.other}; },
  get timing(){ return { ms:{update:PERF.update, scene:PERF.scene, blit:PERF.blit, hud:PERF.hud, total:PERF.total}, fps:PERF.fps, frames:PERF.frames, draws:maxDrawCalls, clipped:drawClipped }; },
  get foam(){
    var a=0,f=0;
    var e=0;
    for(var i=0;i<foamT.length;i++){ if(foamT[i]>0){ a++; if(foamT[i]<=FOAM_FADE_AT) f++; } else if(foamT[i]<0) e++; }
    var pa=0; for(var j=0;j<FP_N;j++) if(fpLife[j]>0) pa++;
    return { active:a, fading:f, extinct:e, floorBuilds:floorBuilds, floorBuildMs:floorBuildMs, floorCnt:[0,1,2,3,4,5,6].map(function(k){return floorCnt[k];}), particles:pa };
  },
  resetFloorStats: function(){ floorBuilds=0; floorBuildMs=0; },
  get maxDrawCalls(){ return maxDrawCalls; },
  get drawClipped(){ return drawClipped; },
  get drawBudget(){ return DRAW_BUDGET; },
  get highScores(){ return highScores; },
  forcePollute: function(type){
    for(var i=0;i<polluters.length;i++){
      if(!type || polluters[i].type===type){
        var p=polluters[i];
        if(!p.cell) p.cell=pickCleanCell(p.x,p.z,0.5,14);
        if(p.cell){ doPollute(p); return true; }
      }
    }
    return false;
  }
};
